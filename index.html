                            y: Math.max(titleHeight, y)
                        });
                    }

                    setSnapPoint(foundSnap);
                    setIsClosingSnap(closing);
                } else {
                    setSnapPoint(null);
                    setIsClosingSnap(false);
                }
            };

            const handleMouseUp = () => {
                if (mode === 'draw_freehand' && isDrawingFreehand) {
                    setIsDrawingFreehand(false);
                    if (currentPoints.length >= 3) {
                        closePolygon(currentPoints);
                    } else {
                        setCurrentPoints([]);
                    }
                }
                setDraggingVertex(null);
                setDraggingPoly(null);
                setDraggingTextId(null);
                setDraggingSymbolId(null);
            };

            const handleCanvasClick = (e) => {
                const { x, y } = getMouseCoords(e);

                if (mode === 'draw_freehand') return;

                if (mode === 'add_symbol') {
                    const isInDrawZone = x > colAgeWidth && x < dimensions.width - colDescWidth && y > titleHeight;
                    if (isInDrawZone) {
                        saveHistory();
                        const newSym = {
                            id: Date.now().toString(),
                            symbolType: activeSymbolType,
                            name: GEO_SYMBOLS[activeSymbolType]?.name || 'Símbolo',
                            x,
                            y,
                            size: 24,
                            rotation: 0,
                            color: '#000000'
                        };
                        setGeoSymbols([...geoSymbols, newSym]);
                        setSelectedSymbolId(newSym.id);
                        setSelectedId(null);
                        setSelectedTextId(null);
                    }
                    return;
                }

                if (mode === 'select') {
                    for (let i = geoSymbols.length - 1; i >= 0; i--) {
                        const sym = geoSymbols[i];
                        if (Math.hypot(sym.x - x, sym.y - y) < 20) {
                            setSelectedSymbolId(sym.id);
                            setSelectedId(null);
                            setSelectedTextId(null);
                            return;
                        }
                    }

                    const ctx = canvasRef.current.getContext('2d');
                    let clickedTId = null;
                    for (let t of floatingTexts) {
                        ctx.font = `bold ${t.size}px sans-serif`;
                        const m = ctx.measureText(t.text);
                        if (x >= t.x - m.width / 2 - 10 && x <= t.x + m.width / 2 + 10 &&
                            y >= t.y - t.size / 2 - 10 && y <= t.y + t.size / 2 + 10) {
                            clickedTId = t.id;
                            break;
                        }
                    }
                    if (clickedTId) {
                        setSelectedTextId(clickedTId);
                        setSelectedId(null);
                        setSelectedSymbolId(null);
                        return;
                    }
                }

                if (mode === 'add_text') {
                    saveHistory();
                    const newT = { id: Date.now().toString(), text: 'Nuevo Texto', x, y, size: 14, color: '#000' };
                    setFloatingTexts([...floatingTexts, newT]);
                    setSelectedTextId(newT.id);
                    setSelectedId(null);
                    setSelectedSymbolId(null);
                    setMode('select');
                    return;
                }

                const isInDrawZone = x >= colAgeWidth - 5 && x <= dimensions.width - colDescWidth + 5 && y >= titleHeight - 5;
                if (mode === 'select' || mode === 'edit_vectors') {
                    const ctx = canvasRef.current.getContext('2d');
                    let clickedPolyId = null;

                    for (let i = polygons.length - 1; i >= 0; i--) {
                        const poly = polygons[i];
                        if (poly.type === 'line') {
                            for (let j = 0; j < poly.points.length - 1; j++) {
                                if (getDistToSegment({ x, y }, poly.points[j], poly.points[j + 1]).dist < 10) {
                                    clickedPolyId = poly.id;
                                    break;
                                }
                            }
                            if (clickedPolyId) break;
                        }
                    }

                    if (!clickedPolyId) {
                        for (let i = polygons.length - 1; i >= 0; i--) {
                            const poly = polygons[i];
                            if (poly.type === 'line') continue;
                            ctx.beginPath();
                            ctx.moveTo(poly.points[0].x, poly.points[0].y);
                            poly.points.forEach(p => ctx.lineTo(p.x, p.y));
                            ctx.closePath();
                            if (ctx.isPointInPath(x, y)) {
                                clickedPolyId = poly.id;
                                break;
                            }
                        }
                    }

                    setSelectedId(clickedPolyId);
                    if (clickedPolyId) {
                        setSelectedTextId(null);
                        setSelectedSymbolId(null);
                    }
                } else if ((mode === 'draw_poly' || mode === 'draw_line') && isInDrawZone) {
                    const rawPt = {
                        x: Math.max(colAgeWidth, Math.min(dimensions.width - colDescWidth, x)),
                        y: Math.max(titleHeight, y)
                    };
                    const clampedPt = snapPoint || applyGridSnap(rawPt);

                    if (mode === 'draw_line' && currentPoints.length >= 2) {
                        const last = currentPoints[currentPoints.length - 1];
                        if (Math.hypot(last.x - x, last.y - y) < 25 || isClosingSnap) {
                            closePolygon(currentPoints);
                            return;
                        }
                    }

                    if (mode === 'draw_poly' && currentPoints.length >= 3) {
                        const first = currentPoints[0];
                        if (Math.hypot(first.x - x, first.y - y) < 35 || isClosingSnap) {
                            closePolygon(currentPoints);
                            return;
                        }
                    }

                    setCurrentPoints(prev => [...prev, clampedPt]);
                }
            };

            const handleDoubleClick = (e) => {
                if ((mode === 'draw_poly' && currentPoints.length >= 3) || (mode === 'draw_line' && currentPoints.length >= 2)) {
                    closePolygon(currentPoints);
                    return;
                }
                if (mode === 'edit_vectors' && selectedId) {
                    const { x, y } = getMouseCoords(e);
                    const poly = polygons.find(p => p.id === selectedId);
                    if (!poly) return;
                    const segCount = poly.type === 'line' ? poly.points.length - 1 : poly.points.length;
                    let bestIdx = -1;
                    let bestDist = 14;
                    let bestProj = null;
                    for (let i = 0; i < segCount; i++) {
                        const p1 = poly.points[i];
                        const p2 = poly.points[(i + 1) % poly.points.length];
                        const res = getDistToSegment({ x, y }, p1, p2);
                        if (res.dist < bestDist) {
                            bestDist = res.dist;
                            bestIdx = i + 1;
                            bestProj = res.proj;
                        }
                    }
                    if (bestIdx !== -1 && bestProj) {
                        saveHistory();
                        setPolygons(prev => prev.map(p => {
                            if (p.id !== poly.id) return p;
                            const nextPts = [...p.points];
                            nextPts.splice(bestIdx, 0, bestProj);
                            return { ...p, points: nextPts };
                        }));
                    }
                }
            };

            const getLegendData = () => {
                const uniqueUnits = polygons.filter(p => p.type === 'polygon').reduce((acc, p) => {
                    if (!acc.find(f => f.name === p.name && f.color === p.color)) acc.push(p);
                    return acc;
                }, []);

                const litEntries = [];
                polygons.filter(p => p.type === 'polygon').forEach(p => {
                    [p.pattern1, p.pattern2, p.pattern3].forEach(pat => {
                        if (pat && pat !== 'none') {
                            const key = `${pat}`;
                            if (!litEntries.find(item => item.key === key)) {
                                litEntries.push({
                                    key,
                                    pattern: pat,
                                    color: p.color,
                                    name: PATTERNS[pat]?.name || pat,
                                    unitName: p.name
                                });
                            }
                        }
                    });
                });

                const structEntries = [{ key: 'contact_concordant', kind: 'line', styleType: 'concordant', color: '#000', label: 'Contacto Concordante' }];

                polygons.forEach(p => {
                    if (p.type === 'polygon' && p.contactType && p.contactType !== 'concordant' && p.contactType !== 'none') {
                        const k = `contact_${p.contactType}`;
                        if (!structEntries.find(item => item.key === k)) {
                            structEntries.push({
                                key: k,
                                kind: 'line',
                                styleType: p.contactType,
                                color: '#000',
                                label: CONTACT_TYPES[p.contactType]?.name || p.contactType
                            });
                        }
                    } else if (p.type === 'line') {
                        const typeName = LINE_TYPES[p.lineType]?.name || 'Línea de Dibujo';
                        const customName = p.name && p.name.trim() !== '' && p.name !== typeName
                            ? `${p.name} (${typeName})`
                            : (p.name || typeName);
                        const k = `line_${p.lineType}_${customName}_${p.color}`;
                        if (!structEntries.find(item => item.key === k)) {
                            structEntries.push({
                                key: k,
                                kind: 'line',
                                styleType: p.lineType || 'normal',
                                color: p.color || '#000',
                                label: customName
                            });
                        }
                    }
                });

                geoSymbols.forEach(sym => {
                    const symTitle = GEO_SYMBOLS[sym.symbolType]?.name || sym.name;
                    const customLabel = sym.name && sym.name !== symTitle ? `${sym.name} (${symTitle})` : symTitle;
                    const k = `sym_${sym.symbolType}_${customLabel}_${sym.color}`;
                    if (!structEntries.find(item => item.key === k)) {
                        structEntries.push({
                            key: k,
                            kind: 'symbol',
                            symbolType: sym.symbolType,
                            color: sym.color || '#000',
                            label: customLabel
                        });
                    }
                });

                return { uniqueUnits, litEntries, structEntries };
            };

            const handleExport = () => {
                const scale = dimensions.width > 1800 ? 2 : 3;
                const { uniqueUnits, litEntries, structEntries } = getLegendData();

                const maxRows = Math.max(uniqueUnits.length, litEntries.length, structEntries.length, 1);
                const legendHeight = 150 + (maxRows * 38);
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = dimensions.width * scale;
                exportCanvas.height = (dimensions.height + legendHeight) * scale;
                const eCtx = exportCanvas.getContext('2d');
                eCtx.scale(scale, scale);

                drawCanvas(eCtx, dimensions.width, dimensions.height, true);

                eCtx.fillStyle = '#ffffff';
                eCtx.fillRect(0, dimensions.height, dimensions.width, legendHeight);
                eCtx.strokeStyle = '#e5e7eb';
                eCtx.lineWidth = 1;
                eCtx.beginPath();
                eCtx.moveTo(0, dimensions.height);
                eCtx.lineTo(dimensions.width, dimensions.height);
                eCtx.stroke();

                eCtx.fillStyle = '#000';
                eCtx.font = 'bold 22px sans-serif';
                eCtx.textAlign = 'center';
                eCtx.fillText('REFERENCIAS', dimensions.width / 2, dimensions.height + 40);

                const col1X = 40;
                const col2X = Math.round(dimensions.width * 0.34);
                const col3X = Math.round(dimensions.width * 0.66);

                let lY = dimensions.height + 80;
                eCtx.font = 'bold 16px sans-serif';
                eCtx.textAlign = 'left';

                eCtx.fillStyle = '#000';
                eCtx.fillText('Formaciones', col1X, lY);
                uniqueUnits.forEach((f, i) => {
                    const rowY = lY + 20 + (i * 36);
                    eCtx.fillStyle = f.color;
                    eCtx.fillRect(col1X, rowY, 44, 24);
                    eCtx.strokeStyle = '#000';
                    eCtx.lineWidth = 1;
                    eCtx.strokeRect(col1X, rowY, 44, 24);
                    eCtx.fillStyle = '#000';
                    eCtx.font = '13px sans-serif';
                    eCtx.fillText(f.name, col1X + 54, rowY + 17);
                });

                eCtx.fillStyle = '#000';
                eCtx.font = 'bold 16px sans-serif';
                eCtx.fillText('Litologías', col2X, lY);
                litEntries.forEach((item, i) => {
                    const rowY = lY + 20 + (i * 36);
                    eCtx.fillStyle = item.color || '#ffffff';
                    eCtx.fillRect(col2X, rowY, 44, 24);
                    eCtx.fillStyle = getPattern(eCtx, item.pattern, 'transparent');
                    eCtx.fillRect(col2X, rowY, 44, 24);
                    eCtx.strokeStyle = '#000';
                    eCtx.lineWidth = 1;
                    eCtx.strokeRect(col2X, rowY, 44, 24);
                    eCtx.fillStyle = '#000';
                    eCtx.font = '13px sans-serif';
                    eCtx.fillText(item.name, col2X + 54, rowY + 17);
                });

                eCtx.fillStyle = '#000';
                eCtx.font = 'bold 16px sans-serif';
                eCtx.fillText('Contactos y Estructuras', col3X, lY);
                structEntries.forEach((s, i) => {
                    const midY = lY + 32 + (i * 36);
                    if (s.kind === 'symbol') {
                        drawGeoSymbol(eCtx, { x: col3X + 22, y: midY, size: 20, symbolType: s.symbolType, color: s.color });
                    } else {
                        drawDecoratedSegment(eCtx, { x: col3X, y: midY }, { x: col3X + 48, y: midY }, s.styleType, s.color, false);
                    }
                    eCtx.fillStyle = '#000';
                    eCtx.font = '13px sans-serif';
                    eCtx.fillText(s.label, col3X + 58, midY + 5);
                });

                const link = document.createElement('a');
                link.download = `diagrama-geologico-${dimensions.width}px.png`;
                link.href = exportCanvas.toDataURL();
                link.click();
                showToast('Imagen PNG HD exportada', 'success');
            };

            const confirmReset = () => {
                saveHistory();
                setPolygons([]);
                setFloatingTexts([]);
                setGeoSymbols([]);
                setCurrentPoints([]);
                setSelectedId(null);
                setSelectedTextId(null);
                setSelectedSymbolId(null);
                setExtraTopSpace(0);
                setOrientationLeft('');
                setOrientationRight('');
                setDimensions(prev => ({ ...prev, height: 600 }));
                try {
                    localStorage.removeItem('geo_v15_polys');
                    localStorage.removeItem('geo_v15_texts');
                    localStorage.removeItem('geo_v15_syms');
                    localStorage.removeItem('geo_v15_extra_top');
                    localStorage.removeItem('geo_v15_ori_l');
                    localStorage.removeItem('geo_v15_ori_r');
                } catch (e) {}
                setShowResetModal(false);
                showToast('Lienzo reiniciado', 'info');
            };

            const selectedPoly = polygons.find(p => p.id === selectedId);
            const selectedText = floatingTexts.find(t => t.id === selectedTextId);
            const selectedSymbol = geoSymbols.find(s => s.id === selectedSymbolId);
            const { uniqueUnits, litEntries, structEntries } = getLegendData();

            return (
                <div className="flex h-screen bg-gray-100 font-sans text-gray-800 overflow-hidden relative">
                    <input
                        ref={fileInputRef}
                        type="file"
                        accept=".json"
                        onChange={handleLoadProject}
                        className="hidden"
                    />

                    {/* Notificación flotante tipo Toast */}
                    {toastMsg && (
                        <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full shadow-xl text-xs font-bold tracking-wide text-white transition-all ${
                            toastMsg.type === 'error' ? 'bg-red-600' : toastMsg.type === 'success' ? 'bg-emerald-600' : 'bg-slate-800'
                        }`}>
                            {toastMsg.text}
                        </div>
                    )}

                    {/* Modal de confirmación de reinicio */}
                    {showResetModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-gray-900">¿Reiniciar todo el lienzo?</h3>
                                <p className="text-sm text-gray-600">Se borrarán todas las formaciones, estructuras y textos guardados. Podés revertirlo con Deshacer (Ctrl+Z) antes de recargar.</p>
                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={() => setShowResetModal(false)} className="px-4 py-2 border rounded-lg text-sm font-semibold hover:bg-gray-50">Cancelar</button>
                                    <button onClick={confirmReset} className="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-semibold hover:bg-red-700">Sí, reiniciar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Barra lateral izquierda de herramientas */}
                    <div className="w-16 bg-white border-r shadow-md flex flex-col items-center py-3 space-y-1.5 z-20 shrink-0 overflow-y-auto">
                        <button
                            onClick={() => setMode('select')}
                            className={`p-2.5 rounded-xl transition ${mode === 'select' ? 'bg-blue-100 text-blue-600' : 'hover:bg-gray-100'}`}
                            title="Seleccionar elemento"
                        >
                            <Icon name="select" size={20} />
                        </button>
                        <button
                            onClick={() => setMode('move')}
                            className={`p-2.5 rounded-xl transition ${mode === 'move' ? 'bg-indigo-100 text-indigo-600' : 'hover:bg-gray-100'}`}
                            title="Seleccionar y Mover Figura"
                        >
                            <Icon name="move" size={20} />
                        </button>
                        <button
                            onClick={() => setMode('edit_vectors')}
                            className={`p-2.5 rounded-xl transition ${mode === 'edit_vectors' ? 'bg-amber-100 text-amber-600' : 'hover:bg-gray-100'}`}
                            title="Editar Nodos / Vértices (Doble clic agrega nodo, Shift+clic borra)"
                        >
                            <Icon name="target" size={20} />
                        </button>
                        <button
                            onClick={() => setMode('add_text')}
                            className={`p-2.5 rounded-xl transition ${mode === 'add_text' ? 'bg-blue-100 text-blue-600' : 'hover:bg-gray-100'}`}
                            title="Insertar Texto"
                        >
                            <Icon name="text" size={20} />
                        </button>

                        <div className="w-8 h-px bg-gray-200 my-1"></div>

                        <button
                            onClick={() => setMode('draw_poly')}
                            className={`p-2.5 rounded-xl transition ${mode === 'draw_poly' ? 'bg-blue-100 text-blue-600' : 'hover:bg-gray-100'}`}
                            title="Polígono Recto"
                        >
                            <Icon name="pen" size={20} />
                        </button>
                        <button
                            onClick={() => setMode('draw_freehand')}
                            className={`p-2.5 rounded-xl transition ${mode === 'draw_freehand' ? 'bg-blue-100 text-blue-600' : 'hover:bg-gray-100'}`}
                            title="Mano Alzada"
                        >
                            <Icon name="pencil" size={20} />
                        </button>
                        <button
                            onClick={() => setMode('draw_line')}
                            className={`p-2.5 rounded-xl transition ${mode === 'draw_line' ? 'bg-blue-100 text-blue-600' : 'hover:bg-gray-100'}`}
                            title="Dibujar Falla / Estructura Lineal"
                        >
                            <Icon name="line" size={20} />
                        </button>
                        <button
                            onClick={() => setMode('add_symbol')}
                            className={`p-2.5 rounded-xl transition ${mode === 'add_symbol' ? 'bg-purple-100 text-purple-600' : 'hover:bg-gray-100'}`}
                            title="Estampar Símbolo Geológico / Fósil / Buzamiento"
                        >
                            <Icon name="stamp" size={20} />
                        </button>

                        <div className="w-8 h-px bg-gray-200 my-1"></div>

                        <button
                            onClick={() => setShowGrid(!showGrid)}
                            className={`p-2.5 rounded-xl transition ${showGrid ? 'bg-emerald-100 text-emerald-700' : 'hover:bg-gray-100 text-gray-500'}`}
                            title="Mostrar / Ocultar Cuadrícula Guía"
                        >
                            <Icon name="grid" size={20} />
                        </button>

                        <div className="flex-grow"></div>

                        <button
                            onClick={handleSaveProject}
                            className="p-2.5 text-sky-600 hover:bg-sky-50 rounded-xl"
                            title="Guardar Proyecto Editable (.json)"
                        >
                            <Icon name="fileJson" size={20} />
                        </button>
                        <button
                            onClick={() => fileInputRef.current?.click()}
                            className="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl"
                            title="Abrir Proyecto (.json)"
                        >
                            <Icon name="upload" size={20} />
                        </button>
                        <button
                            onClick={() => setShowResetModal(true)}
                            className="p-2.5 text-orange-500 hover:bg-orange-50 rounded-xl"
                            title="Reiniciar Lienzo"
                        >
                            <Icon name="reset" size={20} />
                        </button>
                        <button
                            onClick={handleUndo}
                            disabled={currentPoints.length === 0 && history.length === 0}
                            className="p-2.5 hover:bg-gray-100 text-gray-500 disabled:opacity-30 rounded-xl"
                            title="Deshacer (Ctrl+Z)"
                        >
                            <Icon name="undo" size={20} />
                        </button>
                        <button
                            onClick={handleExport}
                            className="p-2.5 text-green-600 hover:bg-green-50 rounded-xl"
                            title="Exportar Imagen HD con Referencias"
                        >
                            <Icon name="download" size={20} />
                        </button>
                    </div>

                    {/* Área central con barra superior fija + viewport con scroll X e Y */}
                    <div className="flex-1 flex flex-col bg-gray-200 overflow-hidden relative">
                        <div className="bg-white/95 backdrop-blur border-b px-4 py-2 flex flex-wrap items-center gap-2 z-30 shadow-sm shrink-0">
                            <button
                                onClick={() => setAutoSave(!autoSave)}
                                title="Haz clic para activar o desactivar el auto-guardado"
                                className={`px-2.5 py-1 rounded-full border flex items-center gap-1.5 transition cursor-pointer ${
                                    autoSave ? 'bg-green-50/70 border-green-200 hover:bg-green-100' : 'bg-gray-50 border-gray-300 hover:bg-gray-100'
                                }`}
                            >
                                <div className={`w-2 h-2 rounded-full ${autoSave ? 'bg-green-500 animate-pulse' : 'bg-gray-400'}`}></div>
                                <span className={`text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 ${autoSave ? 'text-green-700' : 'text-gray-500'}`}>
                                    <Icon name="save" size={12} /> {autoSave ? 'Auto: ON' : 'Auto: OFF'}
                                </span>
                            </button>

                            {/* Selector de ancho / formato panorámico */}
                            <div className="flex items-center gap-1 bg-gray-100 p-0.5 rounded-lg border border-gray-200">
                                <span className="text-[10px] font-bold text-gray-500 uppercase px-1.5">Hoja:</span>
                                {SHEET_PRESETS.map(p => (
                                    <button
                                        key={p.width}
                                        onClick={() => changeSheetWidth(p.width)}
                                        className={`px-2 py-1 rounded-md text-[10px] font-bold transition ${
                                            dimensions.width === p.width
                                                ? 'bg-blue-600 text-white shadow-sm'
                                                : 'text-gray-600 hover:bg-white hover:text-gray-900'
                                        }`}
                                        title={`Ancho ${p.desc}`}
                                    >
                                        {p.label}
                                    </button>
                                ))}
                                <div className="flex items-center border-l border-gray-300 pl-1 ml-0.5 gap-0.5">
                                    <button
                                        onClick={() => changeSheetWidth(dimensions.width - 100)}
                                        className="w-5 h-5 flex items-center justify-center rounded hover:bg-white text-xs font-bold text-gray-600"
                                        title="Reducir ancho (-100px)"
                                    >-</button>
                                    <span className="text-[10px] font-mono font-bold text-gray-700 w-12 text-center">{dimensions.width}px</span>
                                    <button
                                        onClick={() => changeSheetWidth(dimensions.width + 100)}
                                        className="w-5 h-5 flex items-center justify-center rounded hover:bg-white text-xs font-bold text-gray-600"
                                        title="Ampliar ancho (+100px)"
                                    >+</button>
                                </div>
                            </div>

                            {/* Control de Zoom */}
                            <div className="flex items-center gap-1 bg-gray-100 px-1.5 py-0.5 rounded-lg border border-gray-200">
                                <span className="text-[10px] font-bold text-gray-500 uppercase">Zoom:</span>
                                <button
                                    onClick={() => setZoom(z => Math.max(0.45, Math.round((z - 0.1) * 100) / 100))}
                                    className="w-5 h-5 flex items-center justify-center rounded hover:bg-white text-xs font-bold text-gray-700"
                                    title="Alejar"
                                >-</button>
                                <span className="text-[10px] font-mono font-bold text-gray-700 w-9 text-center">{Math.round(zoom * 100)}%</span>
                                <button
                                    onClick={() => setZoom(z => Math.min(1.5, Math.round((z + 0.1) * 100) / 100))}
                                    className="w-5 h-5 flex items-center justify-center rounded hover:bg-white text-xs font-bold text-gray-700"
                                    title="Acercar"
                                >+</button>
                                <button
                                    onClick={handleFitZoom}
                                    className="px-1.5 py-0.5 rounded text-[10px] font-bold text-blue-600 hover:bg-white border-l border-gray-300 ml-0.5"
                                    title="Ajustar hoja al ancho de pantalla"
                                >
                                    Ajustar
                                </button>
                            </div>

                            {/* Compactar altura / encuadrar */}
                            <button
                                onClick={handleCompactSheet}
                                className="px-2.5 py-1 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 text-[10px] font-bold text-gray-700 flex items-center gap-1 transition"
                                title="Ajustar espacio superior e inferior de la hoja al contenido"
                            >
                                <Icon name="compress" size={12} /> Encuadrar
                            </button>

                            {showGrid && (
                                <button
                                    onClick={() => setSnapToGrid(!snapToGrid)}
                                    className={`px-2 py-1 rounded-lg border text-[10px] font-bold transition ${
                                        snapToGrid ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                                    }`}
                                    title="Activar imán a la cuadrícula"
                                >
                                    Imán: {snapToGrid ? 'ON' : 'OFF'}
                                </button>
                            )}

                            <div className="flex items-center gap-1.5 bg-gray-100 px-2 py-0.5 rounded-lg border border-gray-200">
                                <span className="text-[10px] font-bold text-gray-500 uppercase">Fondo</span>
                                <input
                                    type="color"
                                    value={bgColor}
                                    onChange={(e) => setBgColor(e.target.value)}
                                    className="w-5 h-5 border rounded cursor-pointer p-0 bg-transparent"
                                    title="Cambiar color de fondo de la hoja"
                                />
                            </div>

                            <button
                                onClick={() => setShowSheetSettings(!showSheetSettings)}
                                className={`px-2 py-1 rounded-lg border text-[10px] font-bold transition ${
                                    showSheetSettings ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                                }`}
                                title="Configurar orientación del perfil (O-E, NO-SE, etc.)"
                            >
                                Rumbo (O–E)
                            </button>

                            {currentPoints.length >= 2 && (
                                <button
                                    onClick={() => closePolygon(currentPoints)}
                                    className="px-3 py-1 rounded-full shadow bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold uppercase tracking-wider transition cursor-pointer ml-auto"
                                >
                                    ✓ Terminar / Cerrar Trazo (Enter)
                                </button>
                            )}
                        </div>

                        {showSheetSettings && (
                            <div className="bg-slate-50 border-b px-4 py-2 flex flex-wrap items-center gap-4 text-xs z-20 shrink-0">
                                <span className="font-bold text-slate-600 uppercase text-[10px] tracking-wider">Orientación del Afloramiento:</span>
                                <div className="flex items-center gap-1.5">
                                    <label className="text-[11px] text-slate-500 font-semibold">Izquierda:</label>
                                    <input
                                        type="text"
                                        placeholder="ej. O / NO"
                                        value={orientationLeft}
                                        onChange={(e) => setOrientationLeft(e.target.value)}
                                        className="w-20 px-2 py-1 border rounded text-xs bg-white focus:outline-none focus:ring-1 focus:ring-blue-500"
                                    />
                                </div>
                                <div className="flex items-center gap-1.5">
                                    <label className="text-[11px] text-slate-500 font-semibold">Derecha:</label>
                                    <input
                                        type="text"
                                        placeholder="ej. E / SE"
                                        value={orientationRight}
                                        onChange={(e) => setOrientationRight(e.target.value)}
                                        className="w-20 px-2 py-1 border rounded text-xs bg-white focus:outline-none focus:ring-1 focus:ring-blue-500"
                                    />
                                </div>
                                <div className="flex items-center gap-1">
                                    {[['O', 'E'], ['NO', 'SE'], ['SO', 'NE'], ['N', 'S'], ['', '']].map(([l, r], idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => { setOrientationLeft(l); setOrientationRight(r); }}
                                            className="px-2 py-0.5 rounded border bg-white hover:bg-blue-50 text-[10px] font-bold text-slate-600"
                                        >
                                            {l ? `${l} — ${r}` : 'Limpiar'}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Contenedor scrolleable en X e Y */}
                        <div className="flex-1 overflow-auto relative flex flex-col" ref={containerRef}>
                            <div className="p-8 min-w-max flex flex-col items-center">
                                <div
                                    style={{
                                        width: dimensions.width * zoom,
                                        height: dimensions.height * zoom
                                    }}
                                    className="relative shrink-0 shadow-2xl bg-white transition-shadow"
                                >
                                    <canvas
                                        ref={canvasRef}
                                        width={dimensions.width}
                                        height={dimensions.height}
                                        style={{
                                            width: dimensions.width * zoom,
                                            height: dimensions.height * zoom
                                        }}
                                        className={`absolute top-0 left-0 z-10 bg-transparent ${mode.startsWith('draw') ? 'cursor-crosshair' : mode === 'move' ? 'cursor-move' : 'cursor-default'}`}
                                        onMouseMove={handleMouseMove}
                                        onMouseDown={handleMouseDown}
                                        onMouseUp={handleMouseUp}
                                        onMouseLeave={handleMouseUp}
                                        onClick={handleCanvasClick}
                                        onDoubleClick={handleDoubleClick}
                                    />
                                </div>
                            </div>

                            <div className="bg-white border-t p-8 shrink-0 mt-auto">
                                <h3 className="font-black text-center text-gray-800 mb-8 text-xl tracking-widest uppercase">Referencias</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-12 max-w-6xl mx-auto">
                                    <div>
                                        <h4 className="text-xs font-bold text-gray-400 mb-4 border-b pb-2 uppercase">Formaciones</h4>
                                        <div className="space-y-3">
                                            {uniqueUnits.map((f, i) => (
                                                <div key={i} className="flex items-center gap-3">
                                                    <div className="w-12 h-7 border border-black shadow-sm shrink-0" style={{ backgroundColor: f.color }}></div>
                                                    <span className="text-sm font-semibold">{f.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="text-xs font-bold text-gray-400 mb-4 border-b pb-2 uppercase">Litologías</h4>
                                        <div className="space-y-3">
                                            {litEntries.map((item, i) => (
                                                <div key={i} className="flex items-center gap-3">
                                                    <img
                                                        src={createPatternDataURL(getPattern, item.pattern, item.color)}
                                                        alt={item.name}
                                                        className="w-12 h-7 border border-black shadow-sm shrink-0 object-cover"
                                                    />
                                                    <span className="text-sm font-medium">{item.name}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="text-xs font-bold text-gray-400 mb-4 border-b pb-2 uppercase">Contactos y Estructuras</h4>
                                        <div className="space-y-3">
                                            {structEntries.map((s, i) => (
                                                <div key={i} className="flex items-center gap-3">
                                                    {s.kind === 'symbol' ? (
                                                        <div className="w-12 h-7 flex items-center justify-center shrink-0">
                                                            <img src={createSymbolPreviewDataURL(s.symbolType, s.color)} alt={s.label} className="h-7 object-contain" />
                                                        </div>
                                                    ) : (
                                                        <div className="w-12 h-7 flex items-center justify-center shrink-0">
                                                            <img src={createLinePreviewDataURL(s.styleType, s.color)} alt={s.label} className="w-12 h-6 object-contain" />
                                                        </div>
                                                    )}
                                                    <span className="text-sm">{s.label}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Panel derecho de propiedades */}
                    <div className="w-80 bg-white border-l shadow-xl flex flex-col z-20 shrink-0 overflow-y-auto">
                        <div className="p-4 border-b bg-gray-50 flex items-center gap-2 font-bold text-xs uppercase tracking-widest text-gray-700">
                            <Icon name="settings" size={16} /> Propiedades y Estructuras
                        </div>

                        {mode === 'edit_vectors' && (
                            <div className="px-4 py-2.5 bg-amber-50 border-b border-amber-200 text-[11px] text-amber-800 space-y-1">
                                <div className="font-bold">Edición de Nodos activa:</div>
                                <div>• Arrastrá los círculos naranjas para mover vértices.</div>
                                <div>• <b>Doble clic</b> en un borde para insertar un nodo.</div>
                                <div>• <b>Shift + clic</b> en un nodo para eliminarlo.</div>
                            </div>
                        )}

                        {(mode === 'draw_line' || mode === 'add_symbol') && (
                            <div className="p-4 border-b bg-blue-50/40 space-y-3">
                                <div className="flex items-center justify-between">
                                    <span className="text-[11px] font-extrabold uppercase text-blue-800 tracking-wider">
                                        Catálogo Geológico
                                    </span>
                                    <span className="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold">
                                        {mode === 'draw_line' ? 'Modo Trazado' : 'Modo Sello'}
                                    </span>
                                </div>

                                <div className="grid grid-cols-3 gap-1 bg-gray-200 p-1 rounded-lg text-[10px] font-bold">
                                    <button
                                        onClick={() => { setActiveCatalogTab('fallas'); setMode('draw_line'); }}
                                        className={`py-1.5 rounded-md transition ${activeCatalogTab === 'fallas' && mode === 'draw_line' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                    >
                                        Fallas / Ejes
                                    </button>
                                    <button
                                        onClick={() => { setActiveCatalogTab('planos'); setMode('draw_line'); }}
                                        className={`py-1.5 rounded-md transition ${activeCatalogTab === 'planos' && mode === 'draw_line' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                    >
                                        Planos / Diques
                                    </button>
                                    <button
                                        onClick={() => { setActiveCatalogTab('simbolos'); setMode('add_symbol'); }}
                                        className={`py-1.5 rounded-md transition ${mode === 'add_symbol' ? 'bg-white text-purple-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                    >
                                        Símbolos / Facies
                                    </button>
                                </div>

                                {mode === 'draw_line' && activeCatalogTab === 'fallas' && (
                                    <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                                        {['fault_normal', 'fault_reverse', 'fault_strike', 'fault', 'inferred', 'anticline', 'syncline'].map(k => (
                                            <button
                                                key={k}
                                                onClick={() => setActiveLineType(k)}
                                                className={`w-full flex items-center gap-3 p-2 rounded-lg border text-left text-xs transition ${
                                                    activeLineType === k ? 'bg-blue-50 border-blue-400 font-bold text-blue-900' : 'bg-white hover:bg-gray-50 border-gray-200'
                                                }`}
                                            >
                                                <img src={createLinePreviewDataURL(k, '#000')} className="w-12 h-5 border bg-white rounded px-1 shrink-0" />
                                                <span className="truncate">{LINE_TYPES[k].name}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {mode === 'draw_line' && activeCatalogTab === 'planos' && (
                                    <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                                        {['normal', 'joint', 'foliation', 'dike'].map(k => (
                                            <button
                                                key={k}
                                                onClick={() => setActiveLineType(k)}
                                                className={`w-full flex items-center gap-3 p-2 rounded-lg border text-left text-xs transition ${
                                                    activeLineType === k ? 'bg-blue-50 border-blue-400 font-bold text-blue-900' : 'bg-white hover:bg-gray-50 border-gray-200'
                                                }`}
                                            >
                                                <img src={createLinePreviewDataURL(k, '#000')} className="w-12 h-5 border bg-white rounded px-1 shrink-0" />
                                                <span className="truncate">{LINE_TYPES[k].name}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {mode === 'add_symbol' && (
                                    <div className="space-y-1.5 max-h-60 overflow-y-auto pr-1">
                                        {Object.entries(GEO_SYMBOLS).map(([k, d]) => (
                                            <button
                                                key={k}
                                                onClick={() => setActiveSymbolType(k)}
                                                className={`w-full flex items-center gap-3 p-2 rounded-lg border text-left text-xs transition ${
                                                    activeSymbolType === k ? 'bg-purple-50 border-purple-400 font-bold text-purple-900' : 'bg-white hover:bg-gray-50 border-gray-200'
                                                }`}
                                            >
                                                <img src={createSymbolPreviewDataURL(k, '#000')} className="w-9 h-7 border bg-white rounded p-0.5 shrink-0" />
                                                <div>
                                                    <div className="truncate">{d.name}</div>
                                                    <div className="text-[9px] text-gray-400 uppercase">{d.category}</div>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}
                                <p className="text-[10px] text-gray-500 italic">
                                    {mode === 'draw_line'
                                        ? 'Haz clic en el lienzo para trazar puntos y vuelve a hacer clic en el último punto (o Enter) para cerrar la estructura.'
                                        : 'Haz clic en cualquier parte del perfil para estampar el símbolo seleccionado.'}
                                </p>
                            </div>
                        )}

                        <div className="p-4 space-y-6">
                            {selectedPoly ? (
                                <div className="space-y-5">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">
                                            {selectedPoly.type === 'line' ? 'Nombre en Referencias' : 'Nombre de Formación'}
                                        </label>
                                        <input
                                            type="text"
                                            value={selectedPoly.name}
                                            onChange={(e) => setPolygons(polygons.map(p => p.id === selectedId ? { ...p, name: e.target.value } : p))}
                                            className="w-full px-3 py-2 border rounded text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Color</label>
                                        <input
                                            type="color"
                                            value={selectedPoly.color}
                                            onChange={(e) => setPolygons(polygons.map(p => p.id === selectedId ? { ...p, color: e.target.value } : p))}
                                            className="w-full h-8 border rounded cursor-pointer mt-1"
                                        />
                                    </div>

                                    <div className="grid grid-cols-3 gap-1.5 pt-2 border-t">
                                        <button
                                            onClick={() => movePolyLayer(selectedPoly.id, 'up')}
                                            className="py-1.5 px-2 bg-gray-100 hover:bg-gray-200 rounded text-[11px] font-semibold flex items-center justify-center gap-1"
                                            title="Traer un nivel adelante"
                                        >
                                            <Icon name="layersUp" size={14} /> Subir
                                        </button>
                                        <button
                                            onClick={() => movePolyLayer(selectedPoly.id, 'down')}
                                            className="py-1.5 px-2 bg-gray-100 hover:bg-gray-200 rounded text-[11px] font-semibold flex items-center justify-center gap-1"
                                            title="Enviar un nivel atrás"
                                        >
                                            <Icon name="layersDown" size={14} /> Bajar
                                        </button>
                                        <button
                                            onClick={() => duplicatePoly(selectedPoly.id)}
                                            className="py-1.5 px-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded text-[11px] font-semibold flex items-center justify-center gap-1"
                                            title="Duplicar figura"
                                        >
                                            <Icon name="copy" size={13} /> Clonar
                                        </button>
                                    </div>

                                    {selectedPoly.type !== 'line' ? (
                                        <>
                                            <div className="pt-2 border-t space-y-2">
                                                <label className="text-[10px] font-bold text-gray-500 uppercase">Litología (3 Secciones)</label>
                                                {['1', '2', '3'].map(num => (
                                                    <select
                                                        key={num}
                                                        value={selectedPoly[`pattern${num}`]}
                                                        onChange={(e) => setPolygons(polygons.map(p => p.id === selectedId ? { ...p, [`pattern${num}`]: e.target.value } : p))}
                                                        className="w-full px-2 py-1.5 border rounded text-xs mb-1 bg-gray-50"
                                                    >
                                                        {Object.entries(PATTERNS).map(([k, d]) => (
                                                            <option key={k} value={k}>{d.name}</option>
                                                        ))}
                                                    </select>
                                                ))}
                                            </div>
                                            <div className="pt-2 border-t space-y-2">
                                                <label className="text-[10px] font-bold text-gray-500 uppercase">Contacto</label>
                                                <select
                                                    value={selectedPoly.contactType}
                                                    onChange={(e) => setPolygons(polygons.map(p => p.id === selectedId ? { ...p, contactType: e.target.value } : p))}
                                                    className="w-full px-2 py-1.5 border rounded text-xs bg-gray-50"
                                                >
                                                    {Object.entries(CONTACT_TYPES).map(([k, d]) => (
                                                        <option key={k} value={k}>{d.name}</option>
                                                    ))}
                                                </select>
                                                <select
                                                    value={selectedPoly.contactPosition || 'base'}
                                                    onChange={(e) => setPolygons(polygons.map(p => p.id === selectedId ? { ...p, contactPosition: e.target.value } : p))}
                                                    className="w-full px-2 py-1.5 border rounded text-xs bg-gray-50"
                                                >
                                                    {Object.entries(CONTACT_POSITIONS).map(([k, d]) => (
                                                        <option key={k} value={k}>{d.name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </>
                                    ) : (
                                        <div className="space-y-3 pt-2 border-t">
                                            <label className="text-[10px] font-bold text-gray-500 uppercase">Tipo de Estructura / Falla</label>
                                            <select
                                                value={selectedPoly.lineType}
                                                onChange={(e) => {
                                                    const newType = e.target.value;
                                                    setPolygons(polygons.map(p => p.id === selectedId ? {
                                                        ...p,
                                                        lineType: newType,
                                                        name: (!p.name || LINE_TYPES[p.lineType]?.name === p.name || p.name === 'Estructura')
                                                            ? LINE_TYPES[newType].name
                                                            : p.name
                                                    } : p));
                                                }}
                                                className="w-full px-2 py-1.5 border rounded text-xs bg-gray-50"
                                            >
                                                {Object.entries(LINE_TYPES).map(([k, d]) => (
                                                    <option key={k} value={k}>{d.name}</option>
                                                ))}
                                            </select>
                                            <div className="flex items-center gap-2 p-2 bg-gray-50 rounded border">
                                                <img src={createLinePreviewDataURL(selectedPoly.lineType, selectedPoly.color)} className="w-14 h-6 border bg-white rounded px-1" />
                                                <span className="text-[11px] text-gray-600 font-medium">{LINE_TYPES[selectedPoly.lineType]?.name}</span>
                                            </div>
                                        </div>
                                    )}
                                    <button
                                        onClick={() => { saveHistory(); setPolygons(polygons.filter(p => p.id !== selectedId)); setSelectedId(null); }}
                                        className="w-full py-2 bg-red-50 text-red-600 font-bold rounded flex items-center justify-center gap-2 hover:bg-red-100 transition text-sm"
                                    >
                                        <Icon name="trash" size={16} /> Eliminar
                                    </button>
                                </div>
                            ) : selectedSymbol ? (
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Nombre en Referencias</label>
                                        <input
                                            type="text"
                                            value={selectedSymbol.name}
                                            onChange={(e) => setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, name: e.target.value } : s))}
                                            className="w-full px-3 py-2 border rounded text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Tipo de Símbolo</label>
                                        <select
                                            value={selectedSymbol.symbolType}
                                            onChange={(e) => {
                                                const newT = e.target.value;
                                                setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? {
                                                    ...s,
                                                    symbolType: newT,
                                                    name: GEO_SYMBOLS[newT]?.name || s.name
                                                } : s));
                                            }}
                                            className="w-full px-2 py-1.5 border rounded text-xs bg-gray-50 mt-1"
                                        >
                                            {Object.entries(GEO_SYMBOLS).map(([k, d]) => (
                                                <option key={k} value={k}>{d.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase text-xs">Tamaño: {selectedSymbol.size}px</label>
                                        <input
                                            type="range"
                                            min="14"
                                            max="48"
                                            value={selectedSymbol.size}
                                            onChange={(e) => setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, size: parseInt(e.target.value) } : s))}
                                            className="w-full h-2 bg-gray-200 rounded-lg cursor-pointer mt-1"
                                        />
                                    </div>
                                    <div>
                                        <div className="flex items-center justify-between">
                                            <label className="text-[10px] font-bold text-gray-500 uppercase text-xs">Inclinación / Rotación: {selectedSymbol.rotation || 0}°</label>
                                            <button
                                                onClick={() => setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, rotation: 0 } : s))}
                                                className="text-[10px] text-blue-600 font-bold hover:underline"
                                            >0°</button>
                                        </div>
                                        <input
                                            type="range"
                                            min="-180"
                                            max="180"
                                            value={selectedSymbol.rotation || 0}
                                            onChange={(e) => setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, rotation: parseInt(e.target.value) } : s))}
                                            className="w-full h-2 bg-gray-200 rounded-lg cursor-pointer mt-1"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase text-xs">Color</label>
                                        <input
                                            type="color"
                                            value={selectedSymbol.color}
                                            onChange={(e) => setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, color: e.target.value } : s))}
                                            className="w-full h-8 border rounded cursor-pointer mt-1"
                                        />
                                    </div>
                                    <button
                                        onClick={() => { saveHistory(); setGeoSymbols(geoSymbols.filter(s => s.id !== selectedSymbolId)); setSelectedSymbolId(null); }}
                                        className="w-full py-2 bg-red-50 text-red-600 font-bold rounded hover:bg-red-100 transition text-sm"
                                    >
                                        Eliminar Símbolo
                                    </button>
                                </div>
                            ) : selectedText ? (
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Contenido</label>
                                        <input
                                            type="text"
                                            value={selectedText.text}
                                            onChange={(e) => setFloatingTexts(floatingTexts.map(t => t.id === selectedTextId ? { ...t, text: e.target.value } : t))}
                                            className="w-full px-3 py-2 border rounded text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase text-xs">Tamaño: {selectedText.size}px</label>
                                        <input
                                            type="range"
                                            min="8"
                                            max="60"
                                            value={selectedText.size}
                                            onChange={(e) => setFloatingTexts(floatingTexts.map(t => t.id === selectedTextId ? { ...t, size: parseInt(e.target.value) } : t))}
                                            className="w-full h-2 bg-gray-200 rounded-lg cursor-pointer mt-1"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase text-xs">Color</label>
                                        <input
                                            type="color"
                                            value={selectedText.color}
                                            onChange={(e) => setFloatingTexts(floatingTexts.map(t => t.id === selectedTextId ? { ...t, color: e.target.value } : t))}
                                            className="w-full h-8 border rounded cursor-pointer mt-1"
                                        />
                                    </div>
                                    <button
                                        onClick={() => { saveHistory(); setFloatingTexts(floatingTexts.filter(t => t.id !== selectedTextId)); setSelectedTextId(null); }}
                                        className="w-full py-2 bg-red-50 text-red-600 font-bold rounded hover:bg-red-100 transition text-sm"
                                    >
                                        Borrar Texto
                                    </button>
                                </div>
                            ) : (
                                <div className="text-center opacity-50 text-xs py-16 space-y-2">
                                    <div className="italic">Selecciona un elemento para editar</div>
                                    <div className="text-[10px] text-gray-400">Atajos: Ctrl+Z (Deshacer) · Supr (Eliminar) · Enter (Cerrar trazo)</div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
