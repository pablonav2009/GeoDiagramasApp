            // Estado de Recorte / Bloques de Falla
            const [cutPoints, setCutPoints] = useState([]);
            const [cutScope, setCutScope] = useState('all'); // 'all' | 'selected'
            const [cutFaultType, setCutFaultType] = useState('fault_normal');
            const [cutSession, setCutSession] = useState(null);
            const [draggingCutBlock, setDraggingCutBlock] = useState(null);

            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [snapPoint, setSnapPoint] = useState(null);
            const [snapInfo, setSnapInfo] = useState(null);
            const [isClosingSnap, setIsClosingSnap] = useState(false);
            const [geoSnap, setGeoSnap] = useState(true);
            const [autoSave, setAutoSave] = useState(true);
            const [history, setHistory] = useState([]);
            const [redoStack, setRedoStack] = useState([]);
            const [showResetModal, setShowResetModal] = useState(false);
            const [toast, setToast] = useState(null);

            const [activeLineType, setActiveLineType] = useState('fault_normal');
            const [activeSymbolType, setActiveSymbolType] = useState('ball_pillow');
            const [defaultSymbolSize, setDefaultSymbolSize] = useState(24);
            const [defaultSymbolColor, setDefaultSymbolColor] = useState('#000000');
            const [customColors, setCustomColors] = useState([]);
            const [rightTab, setRightTab] = useState('props'); // 'props' | 'catalog'
            const [activeCatalogTab, setActiveCatalogTab] = useState('simbolos'); // 'cuerpos' | 'fallas' | 'planos' | 'simbolos'
            const [symbolCategoryFilter, setSymbolCategoryFilter] = useState('Todas');

            const [dimensions, setDimensions] = useState({ width: 900, height: 600 });
            const [extraTopSpace, setExtraTopSpace] = useState(0);
            const [zoom, setZoom] = useState(1);
            const [showGrid, setShowGrid] = useState(false);
            const [snapToGrid, setSnapToGrid] = useState(false);
            const [orientationLeft, setOrientationLeft] = useState('');
            const [orientationRight, setOrientationRight] = useState('');
            const [showSheetSettings, setShowSheetSettings] = useState(false);

            // Textos editables de encabezados de columnas y etiquetas de referencias
            const [colTitles, setColTitles] = useState({
                age: 'Edad',
                formation: 'Formación',
                obs: 'Observaciones'
            });
            const [legendTitles, setLegendTitles] = useState({
                main: 'Referencias',
                formations: 'Formaciones',
                lithologies: 'Litologías',
                structures: 'Contactos y Estructuras'
            });
            const [customLegendLabels, setCustomLegendLabels] = useState({});

            const [selectedId, setSelectedId] = useState(null);
            const [selectedTextId, setSelectedTextId] = useState(null);
            const [selectedSymbolId, setSelectedSymbolId] = useState(null);
            const [draggingVertex, setDraggingVertex] = useState(null);
            const [draggingControl, setDraggingControl] = useState(null);
            const [draggingPoly, setDraggingPoly] = useState(null);
            const [draggingTextId, setDraggingTextId] = useState(null);
            const [draggingSymbolId, setDraggingSymbolId] = useState(null);
            const [isDrawingFreehand, setIsDrawingFreehand] = useState(false);

            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);
            const toastTimerRef = useRef(null);

            const colAgeWidth = 140;
            const colDescWidth = 200;
            const titleHeight = 60;
            const gridSize = 25;
            const TOP_MARGIN = 35;

            const isInteracting = Boolean(
                draggingPoly || draggingVertex || draggingControl || draggingTextId || draggingSymbolId || draggingCutBlock || isDrawingFreehand
            );

            const showToast = (msg, type = 'info') => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ msg, type });
                toastTimerRef.current = setTimeout(() => setToast(null), 3200);
            };

            const createSnapshot = () => ({
                polygons: JSON.parse(JSON.stringify(polygons)),
                floatingTexts: JSON.parse(JSON.stringify(floatingTexts)),
                geoSymbols: JSON.parse(JSON.stringify(geoSymbols)),
                extraTopSpace
            });

            const saveHistory = () => {
                setHistory(prev => [...prev.slice(-39), createSnapshot()]);
                setRedoStack([]);
            };

            const handleUndo = () => {
                if (cutPoints.length > 0) {
                    setCutPoints([]);
                    return;
                }
                if (cutSession) {
                    setCutSession(null);
                }
                if (channelPoints.length > 0) {
                    setChannelPoints(prev => prev.slice(0, -1));
                    return;
                }
                if (currentPoints.length > 0) {
                    setCurrentPoints(currentPoints.slice(0, -1));
                } else if (history.length > 0) {
                    const lastState = history[history.length - 1];
                    setRedoStack(prev => [...prev.slice(-39), createSnapshot()]);
                    setPolygons(lastState.polygons);
                    setFloatingTexts(lastState.floatingTexts);
                    setGeoSymbols(lastState.geoSymbols || []);
                    if (typeof lastState.extraTopSpace === 'number') {
                        setExtraTopSpace(lastState.extraTopSpace);
                    }
                    setHistory(history.slice(0, -1));
                    setSelectedId(null);
                    setSelectedTextId(null);
                    setSelectedSymbolId(null);
                }
            };

            const handleRedo = () => {
                if (redoStack.length === 0) return;
                const nextState = redoStack[redoStack.length - 1];
                setHistory(prev => [...prev.slice(-39), createSnapshot()]);
                setPolygons(nextState.polygons);
                setFloatingTexts(nextState.floatingTexts);
                setGeoSymbols(nextState.geoSymbols || []);
                if (typeof nextState.extraTopSpace === 'number') {
                    setExtraTopSpace(nextState.extraTopSpace);
                }
                setRedoStack(prev => prev.slice(0, -1));
                setSelectedId(null);
                setSelectedTextId(null);
                setSelectedSymbolId(null);
            };

            // Cargar desde localStorage (compatible con v4/v5)
            useEffect(() => {
                const savedAutoSave = localStorage.getItem('geo_v15_autosave');
                if (savedAutoSave !== null) setAutoSave(savedAutoSave === 'true');
                const savedPolys = localStorage.getItem('geo_v15_polys');
                const savedTexts = localStorage.getItem('geo_v15_texts');
                const savedSyms = localStorage.getItem('geo_v15_syms');
                const savedBg = localStorage.getItem('geo_v15_bg');
                const savedWidth = localStorage.getItem('geo_v15_width');
                const savedExtraTop = localStorage.getItem('geo_v15_extra_top');
                const savedOriL = localStorage.getItem('geo_v15_ori_l');
                const savedOriR = localStorage.getItem('geo_v15_ori_r');
                const savedCustomColors = localStorage.getItem('geo_v15_custom_colors');
                const savedSymSize = localStorage.getItem('geo_v15_sym_size');
                const savedSymColor = localStorage.getItem('geo_v15_sym_color');
                const savedColTitles = localStorage.getItem('geo_v15_col_titles');
                const savedLegendTitles = localStorage.getItem('geo_v15_legend_titles');
                const savedLegendLabels = localStorage.getItem('geo_v15_legend_labels');

                if (savedPolys) { try { setPolygons(JSON.parse(savedPolys)); } catch(e){} }
                if (savedTexts) { try { setFloatingTexts(JSON.parse(savedTexts)); } catch(e){} }
                if (savedSyms) { try { setGeoSymbols(JSON.parse(savedSyms)); } catch(e){} }
                if (savedBg) setBgColor(savedBg);
                if (savedCustomColors) { try { const parsed = JSON.parse(savedCustomColors); if (Array.isArray(parsed)) setCustomColors(parsed); } catch(e){} }
                if (savedSymSize) { const sz = parseInt(savedSymSize, 10); if (!isNaN(sz) && sz >= 10 && sz <= 56) setDefaultSymbolSize(sz); }
                if (savedSymColor) setDefaultSymbolColor(savedSymColor);
                if (savedWidth) {
                    const w = parseInt(savedWidth, 10);
                    if (!isNaN(w) && w >= 750 && w <= 3000) {
                        setDimensions(prev => ({ ...prev, width: w }));
                    }
                }
                if (savedExtraTop) {
                    const et = parseFloat(savedExtraTop);
                    if (!isNaN(et) && et >= 0) setExtraTopSpace(et);
                }
                if (savedOriL !== null) setOrientationLeft(savedOriL);
                if (savedOriR !== null) setOrientationRight(savedOriR);
                if (savedColTitles) { try { setColTitles(prev => ({ ...prev, ...JSON.parse(savedColTitles) })); } catch(e){} }
                if (savedLegendTitles) { try { setLegendTitles(prev => ({ ...prev, ...JSON.parse(savedLegendTitles) })); } catch(e){} }
                if (savedLegendLabels) { try { setCustomLegendLabels(JSON.parse(savedLegendLabels)); } catch(e){} }
            }, []);

            // Auto-guardado y ajuste vertical bidireccional inteligente
            useEffect(() => {
                localStorage.setItem('geo_v15_autosave', autoSave);
                if (autoSave) {
                    localStorage.setItem('geo_v15_polys', JSON.stringify(polygons));
                    localStorage.setItem('geo_v15_texts', JSON.stringify(floatingTexts));
                    localStorage.setItem('geo_v15_syms', JSON.stringify(geoSymbols));
                    localStorage.setItem('geo_v15_bg', bgColor);
                    localStorage.setItem('geo_v15_width', String(dimensions.width));
                    localStorage.setItem('geo_v15_extra_top', String(extraTopSpace));
                    localStorage.setItem('geo_v15_ori_l', orientationLeft);
                    localStorage.setItem('geo_v15_ori_r', orientationRight);
                    localStorage.setItem('geo_v15_custom_colors', JSON.stringify(customColors));
                    localStorage.setItem('geo_v15_sym_size', String(defaultSymbolSize));
                    localStorage.setItem('geo_v15_sym_color', defaultSymbolColor);
                    localStorage.setItem('geo_v15_col_titles', JSON.stringify(colTitles));
                    localStorage.setItem('geo_v15_legend_titles', JSON.stringify(legendTitles));
                    localStorage.setItem('geo_v15_legend_labels', JSON.stringify(customLegendLabels));
                }

                if (isInteracting) return;

                if (polygons.length === 0 && floatingTexts.length === 0 && geoSymbols.length === 0) {
                    if (extraTopSpace !== 0) setExtraTopSpace(0);
                    if (dimensions.height !== 600) {
                        setDimensions(prev => ({ ...prev, height: 600 }));
                    }
                    return;
                }

                let maxY = 400;
                let minY = Infinity;
                polygons.forEach(p => p.points.forEach(pt => {
                    if (pt.y > maxY) maxY = pt.y;
                    if (pt.y < minY) minY = pt.y;
                }));
                floatingTexts.forEach(t => {
                    if (t.y > maxY) maxY = t.y;
                    if (t.y < minY) minY = t.y;
                });
                geoSymbols.forEach(s => {
                    if (s.y > maxY) maxY = s.y;
                    if (s.y < minY) minY = s.y;
                });

                const safeTop = titleHeight + TOP_MARGIN;

                if (minY < titleHeight + 20) {
                    const shiftDown = Math.ceil(safeTop - minY);
                    if (shiftDown > 0) {
                        setPolygons(prev => prev.map(p => translatePoly(p, 0, shiftDown)));
                        setFloatingTexts(prev => prev.map(t => ({ ...t, y: t.y + shiftDown })));
                        setGeoSymbols(prev => prev.map(s => ({ ...s, y: s.y + shiftDown })));
                        setExtraTopSpace(prev => prev + shiftDown);
                        setDimensions(prev => ({ ...prev, height: Math.max(600, Math.ceil(maxY + shiftDown + 60)) }));
                        return;
                    }
                }

                if (extraTopSpace > 0 && minY > safeTop + 2) {
                    const availableSlack = Math.floor(minY - safeTop);
                    const reclaim = Math.min(extraTopSpace, availableSlack);
                    if (reclaim > 1) {
                        setPolygons(prev => prev.map(p => translatePoly(p, 0, -reclaim)));
                        setFloatingTexts(prev => prev.map(t => ({ ...t, y: t.y - reclaim })));
                        setGeoSymbols(prev => prev.map(s => ({ ...s, y: s.y - reclaim })));
                        setExtraTopSpace(prev => Math.max(0, prev - reclaim));
                        setDimensions(prev => ({ ...prev, height: Math.max(600, Math.ceil(maxY - reclaim + 60)) }));
                        return;
                    }
                }

                const calculatedHeight = Math.max(600, Math.ceil(maxY + 60));
                if (dimensions.height !== calculatedHeight) {
                    setDimensions(prev => ({ ...prev, height: calculatedHeight }));
                }
            }, [polygons, floatingTexts, geoSymbols, bgColor, autoSave, isInteracting, dimensions.width, extraTopSpace, orientationLeft, orientationRight, customColors, defaultSymbolSize, defaultSymbolColor, colTitles, legendTitles, customLegendLabels]);

            const addCustomColor = (hex) => {
                if (!hex) return;
                const norm = hex.toLowerCase();
                if (customColors.includes(norm)) {
                    showToast('Ese color ya está en tu paleta', 'info');
                    return;
                }
                setCustomColors(prev => [...prev.slice(-15), norm]);
                showToast('Color guardado en tus colores personalizados', 'success');
            };

            const removeCustomColor = (hex) => {
                setCustomColors(prev => prev.filter(c => c !== hex));
            };

            const changeSheetWidth = (newWidth) => {
                const clamped = Math.max(750, Math.min(3000, Math.round(newWidth)));
                if (clamped === dimensions.width) return;
                const oldWidth = dimensions.width;
                const deltaW = clamped - oldWidth;
                const oldRightColStart = oldWidth - colDescWidth;

                setFloatingTexts(prev => prev.map(t => (t.x >= oldRightColStart ? { ...t, x: t.x + deltaW } : t)));
                setDimensions(prev => ({ ...prev, width: clamped }));
            };

            const handleCompactSheet = () => {
                if (polygons.length === 0 && floatingTexts.length === 0 && geoSymbols.length === 0) {
                    setExtraTopSpace(0);
                    setDimensions(prev => ({ ...prev, height: 600 }));
                    return;
                }
                let minY = Infinity;
                let maxY = 0;
                polygons.forEach(p => p.points.forEach(pt => {
                    if (pt.y < minY) minY = pt.y;
                    if (pt.y > maxY) maxY = pt.y;
                }));
                floatingTexts.forEach(t => {
                    if (t.y < minY) minY = t.y;
                    if (t.y > maxY) maxY = t.y;
                });
                geoSymbols.forEach(s => {
                    if (s.y < minY) minY = s.y;
                    if (s.y > maxY) maxY = s.y;
                });

                const safeTop = titleHeight + TOP_MARGIN;
                const shiftUp = Math.floor(minY - safeTop);
                if (shiftUp !== 0) {
                    saveHistory();
                    setPolygons(prev => prev.map(p => translatePoly(p, 0, -shiftUp)));
                    setFloatingTexts(prev => prev.map(t => ({ ...t, y: t.y - shiftUp })));
                    setGeoSymbols(prev => prev.map(s => ({ ...s, y: s.y - shiftUp })));
                    setExtraTopSpace(0);
                    setDimensions(prev => ({ ...prev, height: Math.max(600, Math.ceil((maxY - shiftUp) + 60)) }));
                    showToast('Hoja encuadrada al contenido', 'success');
                }
            };

            const handleFitZoom = () => {
                if (!containerRef.current) return;
                const availW = containerRef.current.clientWidth - 64;
                const fitted = Math.max(0.45, Math.min(1, Math.floor((availW / dimensions.width) * 100) / 100));
                setZoom(fitted);
            };

            const handleSaveProject = () => {
                const payload = {
                    version: '5.9',
                    bgColor,
                    dimensions,
                    extraTopSpace,
                    orientationLeft,
                    orientationRight,
                    colTitles,
                    legendTitles,
                    customLegendLabels,
                    customColors,
                    polygons,
                    floatingTexts,
                    geoSymbols
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `proyecto-afloramiento-${new Date().toISOString().slice(0, 10)}.json`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
                showToast('Proyecto (.json) guardado', 'success');
            };

            const handleLoadProject = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        saveHistory();
                        if (Array.isArray(data.polygons)) setPolygons(data.polygons);
                        if (Array.isArray(data.floatingTexts)) setFloatingTexts(data.floatingTexts);
                        if (Array.isArray(data.geoSymbols)) setGeoSymbols(data.geoSymbols);
                        if (data.bgColor) setBgColor(data.bgColor);
                        if (data.dimensions?.width) {
                            setDimensions({
                                width: Math.max(750, Math.min(3000, data.dimensions.width)),
                                height: Math.max(600, data.dimensions.height || 600)
                            });
                        }
                        setExtraTopSpace(typeof data.extraTopSpace === 'number' ? data.extraTopSpace : 0);
                        setOrientationLeft(data.orientationLeft || '');
                        setOrientationRight(data.orientationRight || '');
                        if (data.colTitles) setColTitles(prev => ({ ...prev, ...data.colTitles }));
                        if (data.legendTitles) setLegendTitles(prev => ({ ...prev, ...data.legendTitles }));
                        setCustomLegendLabels(data.customLegendLabels || {});
                        if (Array.isArray(data.customColors)) setCustomColors(data.customColors);
                        setSelectedId(null);
                        setSelectedTextId(null);
                        setSelectedSymbolId(null);
                        showToast('Proyecto cargado correctamente', 'success');
                    } catch (err) {
                        showToast('No se pudo leer el archivo .json', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const movePolyLayer = (id, direction) => {
                const idx = polygons.findIndex(p => p.id === id);
                if (idx === -1) return;
                const targetIdx = direction === 'up' ? idx + 1 : idx - 1;
                if (targetIdx < 0 || targetIdx >= polygons.length) return;
                saveHistory();
                const copy = [...polygons];
                const [item] = copy.splice(idx, 1);
                copy.splice(targetIdx, 0, item);
                setPolygons(copy);
            };

            const duplicatePoly = (id) => {
                const poly = polygons.find(p => p.id === id);
                if (!poly) return;
                saveHistory();
                const cloned = translatePoly(JSON.parse(JSON.stringify(poly)), 25, 25);
                cloned.id = Date.now().toString();
                setPolygons(prev => [...prev, cloned]);
                setSelectedId(cloned.id);
            };

            // Generador de tramas litológicas
            const getPattern = (ctx, type, colorHex) => {
                if (type === 'none' || !type) return colorHex;
                const pCanvas = document.createElement('canvas');
                pCanvas.width = 40; pCanvas.height = 40;
                const pCtx = pCanvas.getContext('2d');
                pCtx.fillStyle = colorHex;
                pCtx.fillRect(0, 0, 40, 40);
                pCtx.strokeStyle = 'rgba(0,0,0,0.55)';
                pCtx.fillStyle = 'rgba(0,0,0,0.55)';
                pCtx.lineWidth = 1;

                if (type === 'diagonal') {
                    for (let i = -40; i < 80; i += 10) {
                        pCtx.beginPath(); pCtx.moveTo(i, 0); pCtx.lineTo(i + 40, 40); pCtx.stroke();
                    }
                } else if (type === 'sandstone') {
                    pCtx.fillStyle = 'rgba(0,0,0,0.65)';
                    for (let x = 4; x < 40; x += 8) {
                        for (let y = 4; y < 40; y += 8) {
                            pCtx.beginPath(); pCtx.arc(x + (y % 16 === 0 ? 4 : 0), y, 0.85, 0, Math.PI * 2); pCtx.fill();
                        }
                    }
                } else if (type === 'sandstone_cross') {
                    pCtx.fillStyle = 'rgba(0,0,0,0.55)';
                    for (let x = 4; x < 40; x += 10) {
                        for (let y = 4; y < 40; y += 10) {
                            pCtx.beginPath(); pCtx.arc(x, y, 0.7, 0, Math.PI * 2); pCtx.fill();
                        }
                    }
                    pCtx.beginPath();
                    pCtx.moveTo(0, 20); pCtx.lineTo(40, 20);
                    pCtx.moveTo(0, 40); pCtx.lineTo(40, 40);
                    for (let x = -10; x < 50; x += 12) {
                        pCtx.moveTo(x, 0); pCtx.lineTo(x + 12, 20);
                        pCtx.moveTo(x + 12, 20); pCtx.lineTo(x, 40);
                    }
                    pCtx.stroke();
                } else if (type === 'limestone' || type === 'limestone_fossil') {
                    for (let y = 0; y < 40; y += 10) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                        for (let x = 0; x < 40; x += 20) {
                            pCtx.beginPath(); pCtx.moveTo(x + (y % 20 === 0 ? 0 : 10), y); pCtx.lineTo(x + (y % 20 === 0 ? 0 : 10), y + 10); pCtx.stroke();
                        }
                    }
                    if (type === 'limestone_fossil') {
                        pCtx.strokeStyle = 'rgba(0,0,0,0.5)';
                        const fossils = [{ x: 5, y: 5 }, { x: 25, y: 5 }, { x: 15, y: 15 }, { x: 35, y: 15 }, { x: 5, y: 25 }, { x: 25, y: 25 }, { x: 15, y: 35 }];
                        fossils.forEach(f => {
                            pCtx.beginPath(); pCtx.arc(f.x, f.y, 2, 0.2, Math.PI - 0.2); pCtx.stroke();
                        });
                    }
                } else if (type === 'arcillita') {
                    for (let y = 2; y < 40; y += 4) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                } else if (type === 'limolita') {
                    pCtx.setLineDash([4, 4]);
                    for (let y = 4; y < 40; y += 8) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                    pCtx.setLineDash([]);
                    for (let x = 6; x < 40; x += 10) {
                        for (let y = 8; y < 40; y += 10) {
                            pCtx.beginPath(); pCtx.arc(x, y, 0.6, 0, Math.PI * 2); pCtx.fill();
                        }
                    }
                } else if (type === 'margas') {
                    for (let i = -40; i < 80; i += 12) {
                        pCtx.beginPath(); pCtx.moveTo(i, 0); pCtx.lineTo(i + 10, 10); pCtx.stroke();
                    }
                    for (let y = 0; y < 40; y += 10) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                } else if (type === 'fangolita') {
                    for (let y = 2; y < 40; y += 5) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                    pCtx.fillStyle = 'rgba(0,0,0,0.45)';
                    const mudDots = [{ x: 10, y: 10 }, { x: 30, y: 15 }, { x: 15, y: 30 }, { x: 35, y: 35 }, { x: 5, y: 20 }, { x: 25, y: 5 }];
                    mudDots.forEach(d => {
                        pCtx.beginPath(); pCtx.arc(d.x, d.y, 0.7, 0, Math.PI * 2); pCtx.fill();
                    });
                } else if (type === 'pelite_nodules') {
                    pCtx.setLineDash([7, 5]);
                    for (let y = 5; y < 40; y += 10) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                    pCtx.setLineDash([]);
                    [{ x: 11, y: 12, rx: 5, ry: 2.8 }, { x: 30, y: 28, rx: 5.5, ry: 3 }].forEach(n => {
                        pCtx.beginPath(); pCtx.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, Math.PI * 2); pCtx.stroke();
                    });
                } else if (type === 'arenisca_carbonatica') {
                    pCtx.fillStyle = 'rgba(0,0,0,0.6)';
                    for (let x = 4; x < 40; x += 10) {
                        for (let y = 4; y < 40; y += 10) {
                            pCtx.beginPath(); pCtx.arc(x, y, 0.8, 0, Math.PI * 2); pCtx.fill();
                        }
                    }
                    for (let y = 0; y < 40; y += 20) {
                        for (let x = 0; x < 40; x += 20) {
                            pCtx.strokeRect(x + 5, y + 5, 8, 4);
                        }
                    }
                } else if (type === 'metamorphic') {
                    for (let y = 5; y < 40; y += 10) {
                        pCtx.beginPath();
                        for (let x = 0; x <= 40; x += 5) {
                            pCtx.lineTo(x, y + Math.sin(x * 0.5) * 3);
                        }
                        pCtx.stroke();
                    }
                } else if (type === 'volcanic') {
                    for (let x = 10; x <= 40; x += 20) {
                        for (let y = 10; y <= 40; y += 20) {
                            pCtx.beginPath(); pCtx.moveTo(x - 4, y - 4); pCtx.lineTo(x, y + 2); pCtx.lineTo(x + 4, y - 4); pCtx.stroke();
                        }
                    }
                } else if (type === 'tuff') {
                    for (let x = 8; x < 40; x += 16) {
                        for (let y = 8; y < 40; y += 16) {
                            pCtx.beginPath(); pCtx.moveTo(x - 3, y + 2); pCtx.lineTo(x, y - 3); pCtx.lineTo(x + 3, y + 2); pCtx.stroke();
                            pCtx.beginPath(); pCtx.arc(x + 7, y + 6, 0.7, 0, Math.PI * 2); pCtx.fill();
                        }
                    }
                } else if (type === 'igneous') {
                    for (let x = 10; x <= 40; x += 20) {
                        for (let y = 10; y <= 40; y += 20) {
                            pCtx.beginPath(); pCtx.moveTo(x - 5, y); pCtx.lineTo(x + 5, y); pCtx.moveTo(x, y - 5); pCtx.lineTo(x, y + 5); pCtx.stroke();
                        }
                    }
                } else if (type === 'evaporite') {
                    for (let x = 10; x <= 40; x += 20) {
                        for (let y = 10; y <= 40; y += 20) {
                            pCtx.beginPath();
                            pCtx.moveTo(x - 4, y - 4); pCtx.lineTo(x + 4, y + 4);
                            pCtx.moveTo(x + 4, y - 4); pCtx.lineTo(x - 4, y + 4);
                            pCtx.stroke();
                        }
                    }
                } else if (type === 'shale') {
                    pCtx.setLineDash([8, 6]);
                    for (let y = 8; y < 40; y += 12) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                } else if (type === 'conglomerate') {
                    const clasts = [
                        { x: 10, y: 10, r: 4 }, { x: 30, y: 8, r: 6 },
                        { x: 15, y: 28, r: 5 }, { x: 35, y: 25, r: 4 },
                        { x: 5, y: 35, r: 3 }, { x: 25, y: 35, r: 5 }
                    ];
                    clasts.forEach(c => {
                        pCtx.beginPath(); pCtx.arc(c.x, c.y, c.r, 0, Math.PI * 2); pCtx.stroke();
                    });
                } else if (type === 'breccia') {
                    const tris = [[6, 12, 13, 4, 16, 14], [26, 16, 33, 6, 37, 15], [10, 34, 18, 24, 24, 35], [28, 36, 34, 26, 39, 34]];
                    tris.forEach(([x1, y1, x2, y2, x3, y3]) => {
                        pCtx.beginPath(); pCtx.moveTo(x1, y1); pCtx.lineTo(x2, y2); pCtx.lineTo(x3, y3); pCtx.closePath(); pCtx.stroke();
                    });
                }
                return ctx.createPattern(pCanvas, 'repeat');
            };

            // Generador de tramas continuas de estructuras sedimentarias para rellenar todo S1, S2 o S3
            const getStructurePattern = (ctx, rawType) => {
                const type = LEGACY_STRUCT_MAP[rawType] || rawType;
                if (!type || type === 'none' || !STRUCTURE_PATTERNS[type]) return null;

                const pCanvas = document.createElement('canvas');
                pCanvas.width = 56;
                pCanvas.height = 36;
                const pCtx = pCanvas.getContext('2d');
                pCtx.strokeStyle = 'rgba(0,0,0,0.72)';
                pCtx.fillStyle = 'rgba(0,0,0,0.72)';
                pCtx.lineWidth = 1.25;
                pCtx.lineCap = 'round';
                pCtx.lineJoin = 'round';

                if (type === 'struct_horizontal_lam') {
                    for (let y = 4; y < 36; y += 6) {
                        pCtx.beginPath();
                        pCtx.moveTo(0, y);
                        pCtx.lineTo(56, y);
                        pCtx.stroke();
                    }
                } else if (type === 'struct_cross_planar') {
                    // Sets tabulares horizontales con láminas frontales inclinadas (Sp)
                    [0, 18, 36].forEach(y => {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(56, y); pCtx.stroke();
                    });
                    for (let x = -18; x < 74; x += 14) {
                        pCtx.beginPath(); pCtx.moveTo(x, 0); pCtx.lineTo(x + 14, 18); pCtx.stroke();
                        pCtx.beginPath(); pCtx.moveTo(x + 7, 18); pCtx.lineTo(x + 21, 36); pCtx.stroke();
                    }
                } else if (type === 'struct_cross_trough') {
                    // Estratificación cruzada en artesa / festoneada (St)
                    const drawTrough = (ox, oy) => {
                        pCtx.beginPath();
                        pCtx.moveTo(ox, oy);
                        pCtx.quadraticCurveTo(ox + 14, oy + 16, ox + 28, oy);
                        pCtx.stroke();
                        pCtx.beginPath();
                        pCtx.moveTo(ox + 5, oy + 2);
                        pCtx.quadraticCurveTo(ox + 14, oy + 11, ox + 22, oy + 4);
                        pCtx.stroke();
                    };
                    drawTrough(0, 2);
                    drawTrough(28, 2);
                    drawTrough(-14, 18);
                    drawTrough(14, 18);
                    drawTrough(42, 18);
                } else if (type === 'struct_cross_low_angle') {
                    // Cruzada de bajo ángulo / Hummocky (HCS)
                    for (let y = 6; y < 36; y += 9) {
                        pCtx.beginPath();
                        pCtx.moveTo(0, y);
                        pCtx.quadraticCurveTo(14, y - 5, 28, y);
                        pCtx.quadraticCurveTo(42, y + 5, 56, y);
                        pCtx.stroke();
                    }
                } else if (type === 'struct_herringbone') {
                    // Espina de pescado (bimodal mareal)
                    [0, 18, 36].forEach(y => {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(56, y); pCtx.stroke();
                    });
                    for (let x = -14; x < 70; x += 14) {
                        pCtx.beginPath(); pCtx.moveTo(x, 0); pCtx.lineTo(x + 12, 18); pCtx.stroke();
                        pCtx.beginPath(); pCtx.moveTo(x + 12, 18); pCtx.lineTo(x, 36); pCtx.stroke();
                    }
                } else if (type === 'struct_ripples_current') {
                    // Ondulitas asimétricas de corriente (Sr)
                    for (let y = 10; y < 36; y += 14) {
                        pCtx.beginPath();
                        pCtx.moveTo(0, y);
                        for (let x = 0; x < 56; x += 14) {
                            pCtx.lineTo(x + 9, y - 5);
                            pCtx.lineTo(x + 14, y);
                        }
                        pCtx.stroke();
                    }
                } else if (type === 'struct_ripples_wave') {
                    // Ondulitas simétricas de oleaje
                    for (let y = 10; y < 36; y += 14) {
                        pCtx.beginPath();
                        pCtx.moveTo(0, y);
                        for (let x = 0; x < 56; x += 14) {
                            pCtx.quadraticCurveTo(x + 7, y - 8, x + 14, y);
                        }
                        pCtx.stroke();
                    }
                } else if (type === 'struct_flaser') {
                    // Flaser / lenticular con láminas fangosas discontinuas en senos de ondulitas
                    for (let row = 0; row < 3; row++) {
                        const y = 6 + row * 12;
                        const shift = (row % 2) * 14;
                        for (let x = -14; x < 70; x += 28) {
                            pCtx.beginPath();
                            pCtx.moveTo(x + shift, y);
                            pCtx.quadraticCurveTo(x + shift + 8, y + 6, x + shift + 16, y);
                            pCtx.stroke();
                        }
                    }
                } else if (type === 'struct_convolute') {
                    // Laminación convoluta
                    for (let y = 8; y < 34; y += 10) {
                        pCtx.beginPath();
                        pCtx.moveTo(0, y);
                        pCtx.bezierCurveTo(10, y - 9, 18, y + 9, 28, y - 2);
                        pCtx.bezierCurveTo(38, y + 9, 46, y - 9, 56, y);
                        pCtx.stroke();
                    }
                } else if (type === 'struct_ball_pillow') {
                    // Bola y almohadilla / nódulos de deformación
                    const pillows = [{ x: 14, y: 10, rx: 9, ry: 5.5 }, { x: 42, y: 24, rx: 10, ry: 5.5 }];
                    pillows.forEach(b => {
                        pCtx.beginPath();
                        pCtx.ellipse(b.x, b.y, b.rx, b.ry, 0, 0, Math.PI * 2);
                        pCtx.stroke();
                        pCtx.beginPath();
                        pCtx.arc(b.x, b.y - 1, b.rx * 0.55, 0.2, Math.PI - 0.2);
                        pCtx.stroke();
                    });
                } else if (type === 'struct_load_casts') {
                    // Calcos de carga y estructuras en llama
                    for (let y = 11; y < 36; y += 18) {
                        pCtx.beginPath();
                        pCtx.moveTo(0, y);
                        pCtx.quadraticCurveTo(7, y + 9, 14, y - 3);
                        pCtx.quadraticCurveTo(21, y + 9, 28, y - 4);
                        pCtx.quadraticCurveTo(35, y + 9, 42, y - 3);
                        pCtx.quadraticCurveTo(49, y + 9, 56, y);
                        pCtx.stroke();
                    }
                } else if (type === 'struct_bioturbation') {
                    // Galerías verticales y sinuosas de bioturbación
                    pCtx.beginPath();
                    pCtx.moveTo(10, 4); pCtx.bezierCurveTo(6, 14, 15, 22, 10, 32);
                    pCtx.moveTo(28, 6); pCtx.quadraticCurveTo(34, 16, 26, 26);
                    pCtx.moveTo(45, 3); pCtx.bezierCurveTo(50, 12, 40, 22, 46, 33);
                    pCtx.moveTo(18, 16); pCtx.quadraticCurveTo(23, 12, 28, 17);
                    pCtx.stroke();
                } else if (type === 'struct_graded') {
                    // Granoclasificación normal (grueso abajo -> fino arriba)
                    pCtx.beginPath(); pCtx.moveTo(0, 35); pCtx.lineTo(56, 35); pCtx.stroke();
                    for (let x = 6; x < 56; x += 10) {
                        pCtx.beginPath(); pCtx.arc(x, 29, 2.3, 0, Math.PI * 2); pCtx.stroke();
                        pCtx.beginPath(); pCtx.arc(x + 4, 19, 1.4, 0, Math.PI * 2); pCtx.fill();
                        pCtx.beginPath(); pCtx.arc(x + 1, 9, 0.85, 0, Math.PI * 2); pCtx.fill();
                    }
                } else if (type === 'struct_nodules') {
                    // Concreciones / nódulos diagenéticos
                    [{ x: 14, y: 10, rx: 7, ry: 3.5 }, { x: 42, y: 25, rx: 8, ry: 4 }].forEach(n => {
                        pCtx.beginPath(); pCtx.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, Math.PI * 2); pCtx.stroke();
                    });
                }

                return ctx.createPattern(pCanvas, 'repeat');
            };

            const getSharedStyle = (p1, p2, poly, allPolys, drawAreaRight, colAgeW) => {
                if (Math.abs(p1.x - colAgeW) < 10 && Math.abs(p2.x - colAgeW) < 10) return { type: 'none' };
                if (Math.abs(p1.x - drawAreaRight) < 10 && Math.abs(p2.x - drawAreaRight) < 10) return { type: 'none' };

                const role = getSegmentRole(p1, p2, poly.points);
                const isBase = role === 'base';
                const isTop = role === 'top';

                // Solo heredar contacto de otro estrato si el segmento entero coincide con un borde real suyo
                // y no se trata de un canal/cuerpo incrustado alterando un estrato más largo.
                if (!poly.architecturalMeta) {
                    for (let other of allPolys) {
                        if (other.id === poly.id || other.type === 'line' || other.architecturalMeta) continue;
                        const otherRole = findSharedEdgeRole(p1, p2, other.points);
                        if (!otherRole || otherRole === 'side' || otherRole === role) continue;
                        const oIsBase = otherRole === 'base';
                        const oIsTop = otherRole === 'top';
                        if (other.contactPosition === 'both' || (other.contactPosition === 'base' && oIsBase) || (other.contactPosition === 'top' && oIsTop)) {
                            return { type: other.contactType };
                        }
                    }
                }

                if (poly.contactPosition === 'both' || (poly.contactPosition === 'base' && isBase) || (poly.contactPosition === 'top' && isTop)) {
                    return { type: poly.contactType };
                }
                return { type: 'concordant' };
            };

            // Construye las secciones litológicas activas con color, geometría, estructura y peso
            const getPolySections = (poly) => {
                return [1, 2, 3].map(n => ({
                    num: n,
                    pattern: poly[`pattern${n}`] || 'none',
                    color: poly[`sectionColor${n}`] || '',
                    geometry: poly[`sectionGeo${n}`] || 'tabular',
                    structure: poly[`sectionStruct${n}`] || 'none',
                    structMode: poly[`sectionStructMode${n}`] || 'repeat',
                    weight: Math.max(1, Number(poly[`sectionWeight${n}`]) || 1)
                })).filter(s => s.pattern !== 'none' || (s.color && s.color !== '') || s.geometry !== 'tabular' || s.structure !== 'none');
            };

            const traceSectionRegion = (ctx, minX, maxX, topY, botY, geometry) => {
                const midY = (topY + botY) / 2;
                const h = botY - topY;
                ctx.beginPath();
                if (geometry === 'wedge_right') {
                    ctx.moveTo(minX, topY);
                    ctx.lineTo(maxX, midY);
                    ctx.lineTo(minX, botY);
                    ctx.closePath();
                } else if (geometry === 'wedge_left') {
                    ctx.moveTo(maxX, topY);
                    ctx.lineTo(maxX, botY);
                    ctx.lineTo(minX, midY);
                    ctx.closePath();
                } else if (geometry === 'lens') {
                    ctx.moveTo(minX, midY);
                    ctx.quadraticCurveTo((minX + maxX) / 2, topY - h * 0.25, maxX, midY);
                    ctx.quadraticCurveTo((minX + maxX) / 2, botY + h * 0.25, minX, midY);
                    ctx.closePath();
                } else if (geometry === 'interbedded') {
                    const bands = 4;
                    const bandH = h / bands;
                    for (let b = 0; b < bands; b += 2) {
                        ctx.rect(minX, topY + b * bandH, maxX - minX, bandH);
                    }
                } else {
                    ctx.rect(minX, topY, maxX - minX, h);
                }
            };

            // =========================================================================
            // RENDERIZADO PRINCIPAL DEL LIENZO
            // =========================================================================
            const drawCanvas = (ctx, canvasWidth, canvasHeight, forExport = false) => {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                const drawAreaRight = canvasWidth - colDescWidth;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, colAgeWidth, canvasHeight);
                ctx.fillRect(drawAreaRight, 0, colDescWidth, canvasHeight);
                ctx.fillRect(colAgeWidth, 0, drawAreaRight - colAgeWidth, titleHeight);

                if (!forExport && showGrid) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let gx = colAgeWidth; gx <= drawAreaRight; gx += gridSize) {
                        ctx.moveTo(gx, titleHeight);
                        ctx.lineTo(gx, canvasHeight);
                    }
                    for (let gy = titleHeight; gy <= canvasHeight; gy += gridSize) {
                        ctx.moveTo(colAgeWidth, gy);
                        ctx.lineTo(drawAreaRight, gy);
                    }
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                ctx.beginPath();
                ctx.rect(colAgeWidth, titleHeight, canvasWidth - colAgeWidth - colDescWidth, canvasHeight - titleHeight);
                ctx.clip();

                // Dibujar polígonos y líneas
                polygons.forEach(poly => {
                    if (poly.points.length < 2) return;

                    if (poly.type === 'line') {
                        for (let i = 0; i < poly.points.length - 1; i++) {
                            drawDecoratedSegment(
                                ctx,
                                poly.points[i],
                                poly.points[i + 1],
                                poly.lineType || 'normal',
                                poly.color || '#000',
                                selectedId === poly.id && !forExport,
                                Boolean(poly.flipArrows)
                            );
                        }
                        return;
                    }

                    const drawPath = () => {
                        ctx.beginPath();
                        ctx.moveTo(poly.points[0].x, poly.points[0].y);
                        for (let i = 0; i < poly.points.length; i++) {
                            const style = getSharedStyle(poly.points[i], poly.points[(i + 1) % poly.points.length], poly, polygons, drawAreaRight, colAgeWidth);
                            if (style.type === 'erosive') {
                                traceErosiveSegment(ctx, poly.points[i], poly.points[(i + 1) % poly.points.length]);
                            } else {
                                ctx.lineTo(poly.points[(i + 1) % poly.points.length].x, poly.points[(i + 1) % poly.points.length].y);
                            }
                        }
                        ctx.closePath();
                    };

                    drawPath();
                    ctx.fillStyle = poly.color;
                    ctx.fill();

                    // Renderizado avanzado de las 3 secciones litológicas (color propio, acuñamientos, espesor relativo)
                    const activeSections = getPolySections(poly);
                    if (activeSections.length > 0) {
                        const xs = poly.points.map(p => p.x);
                        const ys = poly.points.map(p => p.y);
                        const minX = Math.min(...xs), maxX = Math.max(...xs);
                        const minY = Math.min(...ys), maxY = Math.max(...ys);
                        const polyH = Math.max(1, maxY - minY);
                        const totalWeight = activeSections.reduce((acc, s) => acc + s.weight, 0);

                        // Si hay secciones acuñadas o intercaladas, primero rellenar con la roca de caja vecina
                        const hostSection = activeSections.find(s => s.geometry === 'tabular') || activeSections[0];
                        const hasWedged = activeSections.some(s => s.geometry !== 'tabular');
                        if (hasWedged && hostSection) {
                            ctx.save();
                            drawPath();
                            ctx.clip();
                            if (hostSection.color) {
                                ctx.fillStyle = hostSection.color;
                                ctx.fillRect(minX, minY, maxX - minX, polyH);
                            }
                            if (hostSection.pattern !== 'none') {
                                ctx.fillStyle = getPattern(ctx, hostSection.pattern, 'transparent');
                                ctx.fillRect(minX, minY, maxX - minX, polyH);
                            }
                            ctx.restore();
                        }

                        let cursorY = minY;
                        activeSections.forEach((sec, idx) => {
                            const secH = (sec.weight / totalWeight) * polyH;
                            const topY = cursorY;
                            const botY = cursorY + secH;
                            cursorY = botY;

                            ctx.save();
                            drawPath();
                            ctx.clip();

                            traceSectionRegion(ctx, minX, maxX, topY, botY, sec.geometry);
                            ctx.save();
                            ctx.clip();

                            if (sec.color) {
                                ctx.fillStyle = sec.color;
                                ctx.fillRect(minX, topY - secH * 0.3, maxX - minX, secH * 1.6);
                            }
                            if (sec.pattern && sec.pattern !== 'none') {
                                ctx.fillStyle = getPattern(ctx, sec.pattern, 'transparent');
                                ctx.fillRect(minX, topY - secH * 0.3, maxX - minX, secH * 1.6);
                            }

                            // Trama continua de estructura sedimentaria / deformación rellenando toda la sección
                            if (sec.structure && sec.structure !== 'none') {
                                const structPat = getStructurePattern(ctx, sec.structure);
                                if (structPat) {
                                    ctx.fillStyle = structPat;
                                    ctx.fillRect(minX, topY - secH * 0.3, maxX - minX, secH * 1.6);
                                } else if (GEO_SYMBOLS[sec.structure]) {
                                    // Respaldo de compatibilidad si un proyecto antiguo tenía un fósil/símbolo puntual
                                    const midY = (topY + botY) / 2;
                                    const spanW = Math.max(1, maxX - minX);
                                    const symSize = Math.max(14, Math.min(28, secH * 0.72));
                                    const stepX = Math.max(48, symSize * 2.6);
                                    const count = Math.max(1, Math.floor(spanW / stepX));
                                    const offsetX = (spanW - (count - 1) * stepX) / 2;
                                    for (let k = 0; k < count; k++) {
                                        drawGeoSymbol(ctx, {
                                            x: minX + offsetX + k * stepX,
                                            y: midY,
                                            size: symSize,
                                            symbolType: sec.structure,
                                            color: 'rgba(0,0,0,0.82)'
                                        });
                                    }
                                }
                            }
                            ctx.restore();
                            ctx.restore();
                        });
                    }

                    // Superficies internas de cuerpos arquitecturales (amalgamación, acreción lateral)
                    if (poly.internalLines && poly.internalLines.length > 0) {
                        ctx.save();
                        drawPath();
                        ctx.clip();
                        poly.internalLines.forEach(line => {
                            if (!line.points || line.points.length < 2) return;
                            for (let i = 0; i < line.points.length - 1; i++) {
                                drawDecoratedSegment(ctx, line.points[i], line.points[i + 1], line.style || 'concordant', 'rgba(0,0,0,0.75)', false);
                            }
                        });
                        ctx.restore();
                    }

                    // Bordes / contactos
                    for (let i = 0; i < poly.points.length; i++) {
                        const style = getSharedStyle(poly.points[i], poly.points[(i + 1) % poly.points.length], poly, polygons, drawAreaRight, colAgeWidth);
                        if (style.type === 'none') continue;
                        drawDecoratedSegment(
                            ctx,
                            poly.points[i],
                            poly.points[(i + 1) % poly.points.length],
                            style.type,
                            '#000',
                            selectedId === poly.id && !forExport
                        );
                    }
                });

                // Símbolos geológicos
                geoSymbols.forEach(sym => {
                    drawGeoSymbol(ctx, {
                        ...sym,
                        color: (selectedSymbolId === sym.id && !forExport) ? '#3b82f6' : sym.color
                    });
                    if (selectedSymbolId === sym.id && !forExport) {
                        ctx.save();
                        ctx.strokeStyle = '#3b82f6';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(sym.x - 14, sym.y - 14, 28, 28);
                        ctx.restore();
                    }
                });

                // Vista previa de trazo libre / polígono / línea
                if (!forExport && currentPoints.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(currentPoints[0].x, currentPoints[0].y);
                    for (let i = 1; i < currentPoints.length; i++) ctx.lineTo(currentPoints[i].x, currentPoints[i].y);
                    if (!isDrawingFreehand && mode !== 'draw_freehand') {
                        ctx.lineTo(snapPoint?.x || mousePos.x, snapPoint?.y || mousePos.y);
                    }
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.setLineDash(isDrawingFreehand ? [] : [5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    if (!isDrawingFreehand) {
                        currentPoints.forEach((p, idx) => {
                            const isFirst = idx === 0;
                            const isLast = idx === currentPoints.length - 1;
                            ctx.fillStyle = (isFirst && isClosingSnap) || (mode === 'draw_line' && isLast && isClosingSnap) ? '#10b981' : '#ef4444';
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, (isFirst && isClosingSnap) ? 6 : 4, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }
                }

                // Vista previa de Cuerpo Sedimentario (Canales / Barras / Lóbulos en 3 clics)
                if (!forExport && mode === 'draw_channel' && channelPoints.length > 0) {
                    const cursor = snapPoint || mousePos;
                    ctx.save();
                    if (channelPoints.length === 1) {
                        ctx.strokeStyle = '#d97706';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([6, 4]);
                        ctx.beginPath();
                        ctx.moveTo(channelPoints[0].x, channelPoints[0].y);
                        ctx.lineTo(cursor.x, cursor.y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    } else if (channelPoints.length === 2) {
                        const preview = buildArchitecturalBody(activeBodyType, channelPoints[0], channelPoints[1], cursor);
                        if (preview.points.length >= 3) {
                            ctx.beginPath();
                            ctx.moveTo(preview.points[0].x, preview.points[0].y);
                            for (let i = 1; i < preview.points.length; i++) ctx.lineTo(preview.points[i].x, preview.points[i].y);
                            ctx.closePath();
                            ctx.fillStyle = 'rgba(230, 184, 92, 0.35)';
                            ctx.fill();
                            ctx.strokeStyle = '#d97706';
                            ctx.lineWidth = 2;
                            ctx.setLineDash([5, 4]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                        if (preview.internalLines) {
                            preview.internalLines.forEach(line => {
                                ctx.beginPath();
                                ctx.moveTo(line.points[0].x, line.points[0].y);
                                for (let i = 1; i < line.points.length; i++) ctx.lineTo(line.points[i].x, line.points[i].y);
                                ctx.strokeStyle = 'rgba(180, 83, 9, 0.65)';
                                ctx.lineWidth = 1.5;
                                ctx.stroke();
                            });
                        }
                    }
                    channelPoints.forEach((pt, idx) => {
                        ctx.fillStyle = '#d97706';
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.font = 'bold 10px sans-serif';
                        ctx.fillStyle = '#92400e';
                        ctx.fillText(`M${idx + 1}`, pt.x + 8, pt.y - 6);
                    });
                    ctx.restore();
                }

                // Vista previa de línea de Recorte / Plano de Falla
                if (!forExport && mode === 'cut_poly' && cutPoints.length === 1) {
                    const cursor = snapPoint || mousePos;
                    const p1 = cutPoints[0];
                    ctx.save();
                    polygons.forEach(poly => {
                        if (poly.type === 'line') return;
                        if (cutScope === 'selected' && poly.id !== selectedId) return;
                        if (doesSegmentCrossPoly(p1, cursor, poly.points)) {
                            ctx.beginPath();
                            ctx.moveTo(poly.points[0].x, poly.points[0].y);
                            for (let i = 1; i < poly.points.length; i++) ctx.lineTo(poly.points[i].x, poly.points[i].y);
                            ctx.closePath();
                            ctx.fillStyle = 'rgba(225, 29, 72, 0.16)';
                            ctx.fill();
                        }
                    });
                    ctx.strokeStyle = '#e11d48';
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([8, 5]);
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(cursor.x, cursor.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    [p1, cursor].forEach(pt => {
                        ctx.fillStyle = '#e11d48';
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    });
                    ctx.restore();
                }

                // Resaltado del bloque activo en sesión de desplazamiento post-recorte
                if (!forExport && cutSession) {
                    const activeIds = cutSession.activeBlock === 'A' ? cutSession.blockAIds : cutSession.blockBIds;
                    ctx.save();
                    polygons.forEach(poly => {
                        if (!activeIds.includes(poly.id) || poly.points.length < 3) return;
                        ctx.beginPath();
                        ctx.moveTo(poly.points[0].x, poly.points[0].y);
                        for (let i = 1; i < poly.points.length; i++) ctx.lineTo(poly.points[i].x, poly.points[i].y);
                        ctx.closePath();
                        ctx.fillStyle = 'rgba(225, 29, 72, 0.14)';
                        ctx.fill();
                        ctx.strokeStyle = '#e11d48';
                        ctx.lineWidth = 2.5;
                        ctx.setLineDash([6, 4]);
                        ctx.stroke();
                    });
                    ctx.setLineDash([4, 4]);
                    ctx.strokeStyle = 'rgba(225, 29, 72, 0.65)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(cutSession.a.x, cutSession.a.y);
                    ctx.lineTo(cutSession.b.x, cutSession.b.y);
                    ctx.stroke();
                    ctx.restore();
                }

                // Visualización de nodos cercanos e imantado inteligente
                if (!forExport && geoSnap && (mode === 'draw_poly' || mode === 'draw_line' || mode === 'draw_freehand' || mode === 'draw_channel' || (mode === 'cut_poly' && !cutSession) || draggingVertex || draggingControl)) {
                    ctx.save();
                    polygons.forEach(poly => {
                        if (draggingVertex && poly.id === draggingVertex.polyId) return;
                        if (draggingControl && poly.id === draggingControl.polyId) return;
                        poly.points.forEach(pt => {
                            const d = Math.hypot(pt.x - mousePos.x, pt.y - mousePos.y);
                            if (d < 85) {
                                ctx.fillStyle = 'rgba(16, 185, 129, 0.25)';
                                ctx.strokeStyle = 'rgba(5, 150, 105, 0.85)';
                                ctx.lineWidth = 1.5;
                                ctx.beginPath();
                                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.stroke();
                            }
                        });
                    });

                    if (snapPoint) {
                        ctx.strokeStyle = isClosingSnap ? '#10b981' : '#0284c7';
                        ctx.fillStyle = isClosingSnap ? 'rgba(16, 185, 129, 0.25)' : 'rgba(2, 132, 199, 0.2)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(snapPoint.x, snapPoint.y, 7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Manejadores de edición de nodos (paramétricos para cuerpos o vértices libres)
                if (!forExport && mode === 'edit_vectors' && selectedId) {
                    const selP = polygons.find(p => p.id === selectedId);
                    if (selP) {
                        if (selP.architecturalMeta && !editRawVertices) {
                            const labels = ['M1', 'M2', 'Forma'];
                            const ctrls = selP.architecturalMeta.controls;
                            ctx.save();
                            ctx.strokeStyle = 'rgba(217, 119, 6, 0.55)';
                            ctx.setLineDash([4, 4]);
                            ctx.lineWidth = 1.5;
                            ctx.beginPath();
                            ctx.moveTo(ctrls[0].x, ctrls[0].y);
                            ctx.lineTo(ctrls[1].x, ctrls[1].y);
                            ctx.moveTo((ctrls[0].x + ctrls[1].x) / 2, (ctrls[0].y + ctrls[1].y) / 2);
                            ctx.lineTo(ctrls[2].x, ctrls[2].y);
                            ctx.stroke();
                            ctx.setLineDash([]);
                            ctrls.forEach((c, idx) => {
                                ctx.fillStyle = idx === 2 ? '#0284c7' : '#d97706';
                                ctx.strokeStyle = '#ffffff';
                                ctx.lineWidth = 2;
                                ctx.beginPath();
                                ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.stroke();
                                ctx.font = 'bold 10px sans-serif';
                                ctx.fillStyle = '#1e293b';
                                ctx.fillText(labels[idx], c.x + 10, c.y - 6);
                            });
                            ctx.restore();
                        } else {
                            selP.points.forEach(pt => {
                                ctx.fillStyle = '#f59e0b';
                                ctx.strokeStyle = '#ffffff';
                                ctx.lineWidth = 2;
                                ctx.beginPath();
                                ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.stroke();
                            });
                        }
                    }
                }

                ctx.restore();

                // Textos flotantes
                floatingTexts.forEach(t => {
                    ctx.save();
                    ctx.font = `bold ${t.size}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = (selectedTextId === t.id && !forExport) ? '#3b82f6' : t.color;
                    ctx.fillText(t.text, t.x, t.y);
                    if (selectedTextId === t.id && !forExport) {
                        const m = ctx.measureText(t.text);
                        ctx.strokeStyle = '#3b82f6';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(t.x - m.width / 2 - 4, t.y - t.size / 2 - 2, m.width + 8, t.size + 4);
                    }
                    ctx.restore();
                });

                // Encabezados de columnas
                ctx.fillStyle = '#1f2937';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';

                const targetSet = new Set(targets.map(t => t.id));
                const baseStamp = Date.now();
                let splitCount = 0;
