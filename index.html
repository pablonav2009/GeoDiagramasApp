                }

                if (mode === 'draw_channel') {
                    const isInDrawZone = x >= colAgeWidth - 5 && x <= dimensions.width - colDescWidth + 5 && y >= titleHeight - 5;
                    if (!isInDrawZone) return;
                    const pt = snapPoint || applyGridSnap(clampToDrawArea({ x, y }));
                    if (channelPoints.length < 2) {
                        setChannelPoints(prev => [...prev, pt]);
                    } else {
                        const preset = ARCHITECTURAL_BODIES[activeBodyType] || ARCHITECTURAL_BODIES.channel_simple;
                        const built = buildArchitecturalBody(activeBodyType, channelPoints[0], channelPoints[1], pt);
                        saveHistory();
                        const newBody = {
                            id: Date.now().toString(),
                            type: 'polygon',
                            name: preset.name,
                            points: built.points,
                            internalLines: built.internalLines,
                            architecturalMeta: built.architecturalMeta,
                            color: preset.defaultColor,
                            pattern1: preset.defaultPattern,
                            pattern2: 'none',
                            pattern3: 'none',
                            contactType: preset.defaultContact,
                            contactPosition: preset.defaultContactPos,
                            lineType: 'normal'
                        };
                        setPolygons(prev => [...prev, newBody]);
                        setChannelPoints([]);
                        setSelectedId(newBody.id);
                        setSelectedTextId(null);
                        setSelectedSymbolId(null);
                        setEditRawVertices(false);
                        setRightTab('props');
                        setMode('select');
                        showToast(`${preset.name} creado. Usa Nodos para ajustar su forma.`, 'success');
                    }
                    return;
                }

                if (mode === 'add_symbol') {
                    const isInDrawZone = x > colAgeWidth && x < dimensions.width - colDescWidth && y > titleHeight;
                    if (isInDrawZone) {
                        saveHistory();
                        const newSym = {
                            id: Date.now().toString(),
                            symbolType: activeSymbolType,
                            name: GEO_SYMBOLS[activeSymbolType]?.name || 'Símbolo',
                            x,
                            y,
                            size: defaultSymbolSize,
                            rotation: 0,
                            color: defaultSymbolColor
                        };
                        setGeoSymbols([...geoSymbols, newSym]);
                        setSelectedSymbolId(newSym.id);
                        setSelectedId(null);
                        setSelectedTextId(null);
                    }
                    return;
                }

                if (mode === 'select') {
                    for (let i = geoSymbols.length - 1; i >= 0; i--) {
                        const sym = geoSymbols[i];
                        if (Math.hypot(sym.x - x, sym.y - y) < 20) {
                            setSelectedSymbolId(sym.id);
                            setSelectedId(null);
                            setSelectedTextId(null);
                            setRightTab('props');
                            return;
                        }
                    }

                    const ctx = canvasRef.current.getContext('2d');
                    let clickedTId = null;
                    for (let t of floatingTexts) {
                        ctx.font = `bold ${t.size}px sans-serif`;
                        const m = ctx.measureText(t.text);
                        if (x >= t.x - m.width / 2 - 10 && x <= t.x + m.width / 2 + 10 &&
                            y >= t.y - t.size / 2 - 10 && y <= t.y + t.size / 2 + 10) {
                            clickedTId = t.id;
                            break;
                        }
                    }
                    if (clickedTId) {
                        setSelectedTextId(clickedTId);
                        setSelectedId(null);
                        setSelectedSymbolId(null);
                        setRightTab('props');
                        return;
                    }
                }

                if (mode === 'add_text') {
                    saveHistory();
                    const newT = { id: Date.now().toString(), text: 'Nuevo Texto', x, y, size: 14, color: '#000' };
                    setFloatingTexts([...floatingTexts, newT]);
                    setSelectedTextId(newT.id);
                    setSelectedId(null);
                    setSelectedSymbolId(null);
                    setRightTab('props');
                    setMode('select');
                    return;
                }

                const isInDrawZone = x >= colAgeWidth - 5 && x <= dimensions.width - colDescWidth + 5 && y >= titleHeight - 5;
                if (mode === 'select' || mode === 'edit_vectors') {
                    const ctx = canvasRef.current.getContext('2d');
                    let clickedPolyId = null;

                    for (let i = polygons.length - 1; i >= 0; i--) {
                        const poly = polygons[i];
                        if (poly.type === 'line') {
                            for (let j = 0; j < poly.points.length - 1; j++) {
                                if (getDistToSegment({ x, y }, poly.points[j], poly.points[j + 1]).dist < 10) {
                                    clickedPolyId = poly.id;
                                    break;
                                }
                            }
                            if (clickedPolyId) break;
                        }
                    }

                    if (!clickedPolyId) {
                        for (let i = polygons.length - 1; i >= 0; i--) {
                            const poly = polygons[i];
                            if (poly.type === 'line') continue;
                            ctx.beginPath();
                            ctx.moveTo(poly.points[0].x, poly.points[0].y);
                            poly.points.forEach(p => ctx.lineTo(p.x, p.y));
                            ctx.closePath();
                            if (ctx.isPointInPath(x, y)) {
                                clickedPolyId = poly.id;
                                break;
                            }
                        }
                    }

                    setSelectedId(clickedPolyId);
                    if (clickedPolyId) {
                        setSelectedTextId(null);
                        setSelectedSymbolId(null);
                        setRightTab('props');
                    }
                } else if ((mode === 'draw_poly' || mode === 'draw_line') && isInDrawZone) {
                    const clampedPt = snapPoint || applyGridSnap(clampToDrawArea({ x, y }));

                    if (mode === 'draw_line' && currentPoints.length >= 2) {
                        const last = currentPoints[currentPoints.length - 1];
                        if (Math.hypot(last.x - x, last.y - y) < 25 || isClosingSnap) {
                            closePolygon(currentPoints);
                            return;
                        }
                    }

                    if (mode === 'draw_poly' && currentPoints.length >= 3) {
                        const first = currentPoints[0];
                        if (Math.hypot(first.x - x, first.y - y) < 35 || isClosingSnap) {
                            closePolygon(currentPoints);
                            return;
                        }
                    }

                    setCurrentPoints(prev => [...prev, clampedPt]);
                }
            };

            const handleDoubleClick = (e) => {
                if ((mode === 'draw_poly' && currentPoints.length >= 3) || (mode === 'draw_line' && currentPoints.length >= 2)) {
                    closePolygon(currentPoints);
                    return;
                }
                if (mode === 'edit_vectors' && selectedId) {
                    const { x, y } = getMouseCoords(e);
                    const poly = polygons.find(p => p.id === selectedId);
                    if (!poly || (poly.architecturalMeta && !editRawVertices)) return;
                    const segCount = poly.type === 'line' ? poly.points.length - 1 : poly.points.length;
                    let bestIdx = -1;
                    let bestDist = 14;
                    let bestProj = null;
                    for (let i = 0; i < segCount; i++) {
                        const p1 = poly.points[i];
                        const p2 = poly.points[(i + 1) % poly.points.length];
                        const res = getDistToSegment({ x, y }, p1, p2);
                        if (res.dist < bestDist) {
                            bestDist = res.dist;
                            bestIdx = i + 1;
                            bestProj = res.proj;
                        }
                    }
                    if (bestIdx !== -1 && bestProj) {
                        saveHistory();
                        setPolygons(prev => prev.map(p => {
                            if (p.id !== poly.id) return p;
                            const nextPts = [...p.points];
                            nextPts.splice(bestIdx, 0, bestProj);
                            return { ...p, architecturalMeta: null, points: nextPts };
                        }));
                    }
                }
            };

            const getLegendData = () => {
                const uniqueUnits = polygons.filter(p => p.type === 'polygon').reduce((acc, p) => {
                    if (!acc.find(f => f.name === p.name && f.color === p.color)) acc.push(p);
                    return acc;
                }, []);

                const litEntries = [];
                polygons.filter(p => p.type === 'polygon').forEach(p => {
                    [1, 2, 3].forEach(n => {
                        const pat = p[`pattern${n}`];
                        const secColor = p[`sectionColor${n}`] || p.color;
                        if (pat && pat !== 'none') {
                            const key = `${pat}_${secColor}`;
                            if (!litEntries.find(item => item.key === key)) {
                                litEntries.push({
                                    key,
                                    pattern: pat,
                                    color: secColor,
                                    name: PATTERNS[pat]?.name || pat,
                                    unitName: p.name
                                });
                            }
                        }
                    });
                });

                const structEntries = [{ key: 'contact_concordant', kind: 'line', styleType: 'concordant', color: '#000', label: 'Contacto Concordante' }];

                polygons.forEach(p => {
                    if (p.type === 'polygon' && p.contactType && p.contactType !== 'concordant' && p.contactType !== 'none') {
                        const k = `contact_${p.contactType}`;
                        if (!structEntries.find(item => item.key === k)) {
                            structEntries.push({
                                key: k,
                                kind: 'line',
                                styleType: p.contactType,
                                color: '#000',
                                label: CONTACT_TYPES[p.contactType]?.name || p.contactType
                            });
                        }
                    } else if (p.type === 'line') {
                        const typeName = LINE_TYPES[p.lineType]?.name || 'Línea de Dibujo';
                        const customName = p.name && p.name.trim() !== '' && p.name !== typeName
                            ? `${p.name} (${typeName})`
                            : (p.name || typeName);
                        const k = `line_${p.lineType}_${customName}_${p.color}`;
                        if (!structEntries.find(item => item.key === k)) {
                            structEntries.push({
                                key: k,
                                kind: 'line',
                                styleType: p.lineType || 'normal',
                                color: p.color || '#000',
                                label: customName
                            });
                        }
                    }
                });

                geoSymbols.forEach(sym => {
                    const symTitle = GEO_SYMBOLS[sym.symbolType]?.name || sym.name;
                    const customLabel = sym.name && sym.name !== symTitle ? `${sym.name} (${symTitle})` : symTitle;
                    const k = `sym_${sym.symbolType}_${customLabel}_${sym.color}`;
                    if (!structEntries.find(item => item.key === k)) {
                        structEntries.push({
                            key: k,
                            kind: 'symbol',
                            symbolType: sym.symbolType,
                            color: sym.color || '#000',
                            label: customLabel
                        });
                    }
                });

                // Incluir también las tramas de estructuras sedimentarias asignadas a S1, S2 y S3
                polygons.filter(p => p.type === 'polygon').forEach(p => {
                    [1, 2, 3].forEach(n => {
                        const rawSt = p[`sectionStruct${n}`];
                        const mappedSt = LEGACY_STRUCT_MAP[rawSt] || rawSt;
                        if (mappedSt && mappedSt !== 'none' && STRUCTURE_PATTERNS[mappedSt]) {
                            const label = STRUCTURE_PATTERNS[mappedSt].name;
                            const k = `structpat_${mappedSt}`;
                            if (!structEntries.find(item => item.key === k)) {
                                structEntries.push({
                                    key: k,
                                    kind: 'struct_pattern',
                                    pattern: mappedSt,
                                    color: '#000000',
                                    label
                                });
                            }
                        } else if (rawSt && rawSt !== 'none' && GEO_SYMBOLS[rawSt]) {
                            const symTitle = GEO_SYMBOLS[rawSt].name;
                            const k = `sym_${rawSt}_${symTitle}_#000000`;
                            if (!structEntries.find(item => item.key === k)) {
                                structEntries.push({
                                    key: k,
                                    kind: 'symbol',
                                    symbolType: rawSt,
                                    color: '#000000',
                                    label: symTitle
                                });
                            }
                        }
                    });
                });

                const finalLitEntries = litEntries.map(item => {
                    const customKey = `lit_${item.key}`;
                    return {
                        ...item,
                        customKey,
                        defaultName: item.name,
                        name: customLegendLabels[customKey] !== undefined ? customLegendLabels[customKey] : item.name
                    };
                });

                const finalStructEntries = structEntries.map(s => {
                    const customKey = `struct_${s.key}`;
                    return {
                        ...s,
                        customKey,
                        defaultLabel: s.label,
                        label: customLegendLabels[customKey] !== undefined ? customLegendLabels[customKey] : s.label
                    };
                });

                return { uniqueUnits, litEntries: finalLitEntries, structEntries: finalStructEntries };
            };

            const updateLegendLabel = (customKey, value) => {
                setCustomLegendLabels(prev => ({ ...prev, [customKey]: value }));
            };

            const resetLegendLabel = (customKey) => {
                setCustomLegendLabels(prev => {
                    const next = { ...prev };
                    delete next[customKey];
                    return next;
                });
            };

            const renameFormationUnit = (oldName, color, newName) => {
                setPolygons(prev => prev.map(p =>
                    p.type === 'polygon' && p.name === oldName && p.color === color
                        ? { ...p, name: newName }
                        : p
                ));
            };

            const handleExport = () => {
                const scale = dimensions.width > 1800 ? 2 : 3;
                const { uniqueUnits, litEntries, structEntries } = getLegendData();

                const maxRows = Math.max(uniqueUnits.length, litEntries.length, structEntries.length, 1);
                const legendHeight = 150 + (maxRows * 38);
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = dimensions.width * scale;
                exportCanvas.height = (dimensions.height + legendHeight) * scale;
                const eCtx = exportCanvas.getContext('2d');
                eCtx.scale(scale, scale);

                drawCanvas(eCtx, dimensions.width, dimensions.height, true);

                eCtx.fillStyle = '#ffffff';
                eCtx.fillRect(0, dimensions.height, dimensions.width, legendHeight);
                eCtx.strokeStyle = '#e5e7eb';
                eCtx.lineWidth = 1;
                eCtx.beginPath();
                eCtx.moveTo(0, dimensions.height);
                eCtx.lineTo(dimensions.width, dimensions.height);
                eCtx.stroke();

                eCtx.fillStyle = '#000';
                eCtx.font = 'bold 22px sans-serif';
                eCtx.textAlign = 'center';
                eCtx.fillText((legendTitles.main || 'REFERENCIAS').toUpperCase(), dimensions.width / 2, dimensions.height + 40);

                const col1X = 40;
                const col2X = Math.round(dimensions.width * 0.34);
                const col3X = Math.round(dimensions.width * 0.66);

                let lY = dimensions.height + 80;
                eCtx.font = 'bold 16px sans-serif';
                eCtx.textAlign = 'left';

                eCtx.fillStyle = '#000';
                eCtx.fillText(legendTitles.formations || 'Formaciones', col1X, lY);
                uniqueUnits.forEach((f, i) => {
                    const rowY = lY + 20 + (i * 36);
                    eCtx.fillStyle = f.color;
                    eCtx.fillRect(col1X, rowY, 44, 24);
                    eCtx.strokeStyle = '#000';
                    eCtx.lineWidth = 1;
                    eCtx.strokeRect(col1X, rowY, 44, 24);
                    eCtx.fillStyle = '#000';
                    eCtx.font = '13px sans-serif';
                    eCtx.fillText(f.name, col1X + 54, rowY + 17);
                });

                eCtx.fillStyle = '#000';
                eCtx.font = 'bold 16px sans-serif';
                eCtx.fillText(legendTitles.lithologies || 'Litologías', col2X, lY);
                litEntries.forEach((item, i) => {
                    const rowY = lY + 20 + (i * 36);
                    eCtx.fillStyle = item.color || '#ffffff';
                    eCtx.fillRect(col2X, rowY, 44, 24);
                    eCtx.fillStyle = getPattern(eCtx, item.pattern, 'transparent');
                    eCtx.fillRect(col2X, rowY, 44, 24);
                    eCtx.strokeStyle = '#000';
                    eCtx.lineWidth = 1;
                    eCtx.strokeRect(col2X, rowY, 44, 24);
                    eCtx.fillStyle = '#000';
                    eCtx.font = '13px sans-serif';
                    eCtx.fillText(item.name, col2X + 54, rowY + 17);
                });

                eCtx.fillStyle = '#000';
                eCtx.font = 'bold 16px sans-serif';
                eCtx.fillText(legendTitles.structures || 'Contactos y Estructuras', col3X, lY);
                structEntries.forEach((s, i) => {
                    const midY = lY + 32 + (i * 36);
                    if (s.kind === 'struct_pattern') {
                        const rowY = lY + 20 + (i * 36);
                        eCtx.fillStyle = '#ffffff';
                        eCtx.fillRect(col3X, rowY, 44, 24);
                        const pat = getStructurePattern(eCtx, s.pattern);
                        if (pat) {
                            eCtx.fillStyle = pat;
                            eCtx.fillRect(col3X, rowY, 44, 24);
                        }
                        eCtx.strokeStyle = '#000';
                        eCtx.lineWidth = 1;
                        eCtx.strokeRect(col3X, rowY, 44, 24);
                    } else if (s.kind === 'symbol') {
                        drawGeoSymbol(eCtx, { x: col3X + 22, y: midY, size: 20, symbolType: s.symbolType, color: s.color });
                    } else if (s.styleType === 'fault_normal' || s.styleType === 'fault_reverse') {
                        drawDecoratedSegment(eCtx, { x: col3X + 6, y: midY - 8 }, { x: col3X + 42, y: midY + 8 }, s.styleType, s.color, false);
                    } else {
                        drawDecoratedSegment(eCtx, { x: col3X, y: midY }, { x: col3X + 48, y: midY }, s.styleType, s.color, false);
                    }
                    eCtx.fillStyle = '#000';
                    eCtx.font = '13px sans-serif';
                    eCtx.fillText(s.label, col3X + 58, midY + 5);
                });

                const link = document.createElement('a');
                link.download = `diagrama-geologico-${dimensions.width}px.png`;
                link.href = exportCanvas.toDataURL();
                link.click();
                showToast('Imagen HD exportada con referencias', 'success');
            };

            const confirmReset = () => {
                saveHistory();
                setPolygons([]);
                setFloatingTexts([]);
                setGeoSymbols([]);
                setCurrentPoints([]);
                setChannelPoints([]);
                setCutPoints([]);
                setCutSession(null);
                setSelectedId(null);
                setSelectedTextId(null);
                setSelectedSymbolId(null);
                setExtraTopSpace(0);
                setOrientationLeft('');
                setOrientationRight('');
                setColTitles({ age: 'Edad', formation: 'Formación', obs: 'Observaciones' });
                setLegendTitles({ main: 'Referencias', formations: 'Formaciones', lithologies: 'Litologías', structures: 'Contactos y Estructuras' });
                setCustomLegendLabels({});
                setDimensions(prev => ({ ...prev, height: 600 }));
                localStorage.removeItem('geo_v15_polys');
                localStorage.removeItem('geo_v15_texts');
                localStorage.removeItem('geo_v15_syms');
                localStorage.removeItem('geo_v15_extra_top');
                localStorage.removeItem('geo_v15_ori_l');
                localStorage.removeItem('geo_v15_ori_r');
                localStorage.removeItem('geo_v15_col_titles');
                localStorage.removeItem('geo_v15_legend_titles');
                localStorage.removeItem('geo_v15_legend_labels');
                setShowResetModal(false);
                showToast('Lienzo reiniciado', 'info');
            };

            const updateSelectedPoly = (patch) => {
                setPolygons(prev => prev.map(p => p.id === selectedId ? { ...p, ...patch } : p));
            };

            const selectedPoly = polygons.find(p => p.id === selectedId);
            const selectedText = floatingTexts.find(t => t.id === selectedTextId);
            const selectedSymbol = geoSymbols.find(s => s.id === selectedSymbolId);
            const { uniqueUnits, litEntries, structEntries } = getLegendData();

            const symbolCategories = ['Todas', 'Deformación', 'Sedimentario / Facies', 'Estructural', 'Paleontología'];
            const filteredSymbols = Object.entries(GEO_SYMBOLS).filter(([, d]) =>
                symbolCategoryFilter === 'Todas' || d.category === symbolCategoryFilter
            );

            return (
                <div className="flex h-screen bg-gray-100 font-sans text-gray-800 overflow-hidden relative">
                    <input
                        ref={fileInputRef}
                        type="file"
                        accept=".json"
                        onChange={handleLoadProject}
                        className="hidden"
                    />

                    {/* Toast de notificaciones */}
                    {toast && (
                        <div className={`fixed bottom-12 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full shadow-xl text-xs font-bold flex items-center gap-2 transition ${
                            toast.type === 'error' ? 'bg-rose-600 text-white' : toast.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-white'
                        }`}>
                            <span>{toast.msg}</span>
                        </div>
                    )}

                    {/* Modal de confirmación de reinicio */}
                    {showResetModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-gray-900">¿Reiniciar todo el lienzo?</h3>
                                <p className="text-sm text-gray-600">Se borrarán todas las formaciones, estructuras y textos guardados. Puedes revertirlo con Deshacer antes de recargar.</p>
                                <div className="flex justify-end gap-3 pt-2">
                                    <button onClick={() => setShowResetModal(false)} className="px-4 py-2 border rounded-lg text-sm font-semibold hover:bg-gray-50">Cancelar</button>
                                    <button onClick={confirmReset} className="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-semibold hover:bg-red-700">Sí, reiniciar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Barra lateral izquierda de herramientas con etiquetas claras */}
                    <div className="w-[74px] bg-white border-r shadow-md flex flex-col items-center py-2.5 px-1.5 space-y-1 z-20 shrink-0 overflow-y-auto">
                        {[
                            { id: 'select', icon: 'select', label: 'Elegir', activeBg: 'bg-blue-100 text-blue-700 border-blue-300', title: 'Seleccionar elemento' },
                            { id: 'move', icon: 'move', label: 'Mover', activeBg: 'bg-indigo-100 text-indigo-700 border-indigo-300', title: 'Mover formación, estructura o texto' },
                            { id: 'edit_vectors', icon: 'target', label: 'Nodos', activeBg: 'bg-amber-100 text-amber-800 border-amber-300', title: 'Editar nodos y deformar canales/barras' },
                            { id: 'cut_poly', icon: 'scissors', label: 'Recortar', activeBg: 'bg-rose-100 text-rose-700 border-rose-300', title: 'Recortar estratos por plano de falla y desplazar bloques arriba/abajo' }
                        ].map(tool => (
                            <button
                                key={tool.id}
                                onClick={() => { setMode(tool.id); setChannelPoints([]); setCutPoints([]); setCutSession(null); }}
                                className={`w-full py-1.5 px-1 rounded-xl border flex flex-col items-center gap-0.5 transition ${
                                    mode === tool.id ? `${tool.activeBg} shadow-sm` : 'border-transparent text-gray-600 hover:bg-gray-100'
                                }`}
                                title={tool.title}
                            >
                                <Icon name={tool.icon} size={18} />
                                <span className="text-[9px] font-bold tracking-tight">{tool.label}</span>
                            </button>
                        ))}

                        <div className="w-10 h-px bg-gray-200 my-1"></div>

                        {[
                            { id: 'draw_poly', icon: 'pen', label: 'Estrato', activeBg: 'bg-blue-100 text-blue-700 border-blue-300', title: 'Dibujar polígono / estrato recto' },
                            { id: 'draw_freehand', icon: 'pencil', label: 'Libre', activeBg: 'bg-blue-100 text-blue-700 border-blue-300', title: 'Dibujar estrato a mano alzada' },
                            { id: 'draw_channel', icon: 'channel', label: 'Canales', activeBg: 'bg-amber-100 text-amber-800 border-amber-300', title: 'Dibujar canales, barras, lóbulos y biohermas (3 clics)' },
                            { id: 'draw_line', icon: 'line', label: 'Fallas', activeBg: 'bg-rose-100 text-rose-700 border-rose-300', title: 'Trazar falla, eje de pliegue, diaclasa o dique' },
                            { id: 'add_symbol', icon: 'stamp', label: 'Símbolos', activeBg: 'bg-purple-100 text-purple-700 border-purple-300', title: 'Estampar estructuras sedimentarias, deformación y fósiles' },
                            { id: 'add_text', icon: 'text', label: 'Texto', activeBg: 'bg-sky-100 text-sky-700 border-sky-300', title: 'Insertar etiqueta de texto' }
                        ].map(tool => (
                            <button
                                key={tool.id}
                                onClick={() => {
                                    setMode(tool.id);
                                    setChannelPoints([]);
                                    setCutPoints([]);
                                    setCutSession(null);
                                    if (tool.id === 'draw_channel') { setRightTab('catalog'); setActiveCatalogTab('cuerpos'); }
                                    if (tool.id === 'draw_line') { setRightTab('catalog'); setActiveCatalogTab('fallas'); }
                                    if (tool.id === 'add_symbol') { setRightTab('catalog'); setActiveCatalogTab('simbolos'); }
                                }}
                                className={`w-full py-1.5 px-1 rounded-xl border flex flex-col items-center gap-0.5 transition ${

                                                                            className={`w-3.5 h-3.5 rounded-sm border ${secCol === hex ? 'ring-1 ring-blue-600 border-black' : 'border-gray-300'}`}
                                                                            style={{ backgroundColor: hex }}
                                                                            title="Color rápido de sección"
                                                                        />
                                                                    ))}
                                                                    <input
                                                                        type="color"
                                                                        value={secCol || selectedPoly.color}
                                                                        onChange={(e) => updateSelectedPoly({ [`sectionColor${num}`]: e.target.value })}
                                                                        className="w-5 h-4 border rounded cursor-pointer p-0 bg-transparent"
                                                                        title="Elegir color propio de esta sección"
                                                                    />
                                                                    {secCol && (
                                                                        <>
                                                                            <button
                                                                                onClick={() => addCustomColor(secCol)}
                                                                                className="text-[9px] text-blue-600 hover:text-blue-800 font-bold px-0.5"
                                                                                title="Guardar este color en Mis Colores"
                                                                            >
                                                                                +
                                                                            </button>
                                                                            <button
                                                                                onClick={() => updateSelectedPoly({ [`sectionColor${num}`]: '' })}
                                                                                className="text-[9px] text-gray-400 hover:text-red-500 font-bold px-0.5"
                                                                                title="Volver al color base del polígono"
                                                                            >
                                                                                ×
                                                                            </button>
                                                                        </>
                                                                    )}
                                                                </div>
                                                            </div>

                                                            {customColors.length > 0 && (
                                                                <div className="flex items-center gap-1 flex-wrap">
                                                                    <span className="text-[8px] font-bold text-gray-400 uppercase mr-0.5">Míos:</span>
                                                                    {customColors.map(hex => (
                                                                        <button
                                                                            key={hex}
                                                                            onClick={() => updateSelectedPoly({ [`sectionColor${num}`]: hex })}
                                                                            className={`w-3.5 h-3.5 rounded-sm border ${secCol.toLowerCase() === hex ? 'ring-1 ring-blue-600 border-black' : 'border-gray-400'}`}
                                                                            style={{ backgroundColor: hex }}
                                                                            title={`Aplicar color guardado ${hex}`}
                                                                        />
                                                                    ))}
                                                                </div>
                                                            )}

                                                            <select
                                                                value={secPat}
                                                                onChange={(e) => updateSelectedPoly({ [`pattern${num}`]: e.target.value })}
                                                                className="w-full px-2 py-1 border rounded text-xs bg-white"
                                                            >
                                                                {Object.entries(PATTERNS).map(([k, d]) => (
                                                                    <option key={k} value={k}>{d.name}</option>
                                                                ))}
                                                            </select>

                                                            <div className="grid grid-cols-3 gap-1 items-center">
                                                                <select
                                                                    value={secGeo}
                                                                    onChange={(e) => updateSelectedPoly({ [`sectionGeo${num}`]: e.target.value })}
                                                                    className="col-span-2 px-1.5 py-1 border rounded text-[11px] bg-white"
                                                                    title="Geometría / acuñamiento de esta sección"
                                                                >
                                                                    {Object.entries(SECTION_GEOMETRIES).map(([k, d]) => (
                                                                        <option key={k} value={k}>{d.name}</option>
                                                                    ))}
                                                                </select>
                                                                <div className="flex items-center justify-end gap-1 bg-white border rounded px-1.5 py-0.5">
                                                                    <span className="text-[9px] font-bold text-gray-400">Esp</span>
                                                                    <input
                                                                        type="number"
                                                                        min="1"
                                                                        max="5"
                                                                        value={secW}
                                                                        onChange={(e) => updateSelectedPoly({ [`sectionWeight${num}`]: Math.max(1, Math.min(5, parseInt(e.target.value, 10) || 1)) })}
                                                                        className="w-7 text-[11px] font-bold text-center focus:outline-none"
                                                                    />
                                                                </div>
                                                            </div>

                                                            {/* Selector de trama continua de estructura sedimentaria para todo S1/S2/S3 */}
                                                            <div className="flex items-center gap-1.5">
                                                                <select
                                                                    value={STRUCTURE_PATTERNS[secStruct] ? secStruct : 'none'}
                                                                    onChange={(e) => updateSelectedPoly({ [`sectionStruct${num}`]: e.target.value })}
                                                                    className="flex-1 min-w-0 px-1.5 py-1 border rounded text-[11px] bg-white"
                                                                    title="Trama continua de estructura sedimentaria dentro de esta sección"
                                                                >
                                                                    {Object.entries(STRUCTURE_PATTERNS).map(([k, d]) => (
                                                                        <option key={k} value={k}>{d.name}</option>
                                                                    ))}
                                                                </select>
                                                                {STRUCTURE_PATTERNS[secStruct] && secStruct !== 'none' && (
                                                                    <img
                                                                        src={createStructurePatternDataURL(getStructurePattern, secStruct)}
                                                                        alt="Vista previa trama"
                                                                        className="w-9 h-6 border rounded bg-white shrink-0 object-cover"
                                                                    />
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            <div className="pt-2 border-t space-y-2">
                                                <label className="text-[10px] font-bold text-gray-500 uppercase">Contacto</label>
                                                <select
                                                    value={selectedPoly.contactType}
                                                    onChange={(e) => updateSelectedPoly({ contactType: e.target.value })}
                                                    className="w-full px-2 py-1.5 border rounded text-xs bg-gray-50"
                                                >
                                                    {Object.entries(CONTACT_TYPES).map(([k, d]) => (
                                                        <option key={k} value={k}>{d.name}</option>
                                                    ))}
                                                </select>
                                                <select
                                                    value={selectedPoly.contactPosition || 'base'}
                                                    onChange={(e) => updateSelectedPoly({ contactPosition: e.target.value })}
                                                    className="w-full px-2 py-1.5 border rounded text-xs bg-gray-50"
                                                >
                                                    {Object.entries(CONTACT_POSITIONS).map(([k, d]) => (
                                                        <option key={k} value={k}>{d.name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </>
                                    ) : (
                                        <div className="space-y-3 pt-2 border-t">
                                            <label className="text-[10px] font-bold text-gray-500 uppercase">Tipo de Estructura / Falla</label>
                                            <select
                                                value={selectedPoly.lineType}
                                                onChange={(e) => {
                                                    const newType = e.target.value;
                                                    updateSelectedPoly({
                                                        lineType: newType,
                                                        name: (!selectedPoly.name || LINE_TYPES[selectedPoly.lineType]?.name === selectedPoly.name || selectedPoly.name === 'Estructura')
                                                            ? LINE_TYPES[newType].name
                                                            : selectedPoly.name
                                                    });
                                                }}
                                                className="w-full px-2 py-1.5 border rounded text-xs bg-gray-50"
                                            >
                                                {Object.entries(LINE_TYPES).map(([k, d]) => (
                                                    <option key={k} value={k}>{d.name}</option>
                                                ))}
                                            </select>
                                            <div className="flex items-center gap-2 p-2 bg-gray-50 rounded border">
                                                <img src={createLinePreviewDataURL(selectedPoly.lineType, selectedPoly.color, Boolean(selectedPoly.flipArrows))} className="w-14 h-6 border bg-white rounded px-1" />
                                                <span className="text-[11px] text-gray-600 font-medium">{LINE_TYPES[selectedPoly.lineType]?.name}</span>
                                            </div>
                                            {(selectedPoly.lineType === 'fault_normal' || selectedPoly.lineType === 'fault_reverse') && (
                                                <button
                                                    onClick={() => { saveHistory(); updateSelectedPoly({ flipArrows: !selectedPoly.flipArrows }); }}
                                                    className="w-full py-1.5 px-2 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg text-[11px] font-bold text-slate-700 transition"
                                                    title="Invertir qué bloque sube y cuál baja"
                                                >
                                                    ⇄ Invertir sentido de flechas (Sube / Baja)
                                                </button>
                                            )}
                                        </div>
                                    )}

                                    <button
                                        onClick={() => { saveHistory(); setPolygons(polygons.filter(p => p.id !== selectedId)); setSelectedId(null); }}
                                        className="w-full py-2 bg-red-50 text-red-600 font-bold rounded-lg flex items-center justify-center gap-2 hover:bg-red-100 transition text-sm"
                                    >
                                        <Icon name="trash" size={16} /> Eliminar
                                    </button>
                                </div>
                            ) : selectedSymbol ? (
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Nombre en Referencias</label>
                                        <input
                                            type="text"
                                            value={selectedSymbol.name}
                                            onChange={(e) => setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, name: e.target.value } : s))}
                                            className="w-full px-3 py-2 border rounded text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Tipo de Símbolo</label>
                                        <select
                                            value={selectedSymbol.symbolType}
                                            onChange={(e) => {
                                                const newT = e.target.value;
                                                setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? {
                                                    ...s,
                                                    symbolType: newT,
                                                    name: GEO_SYMBOLS[newT]?.name || s.name
                                                } : s));
                                            }}
                                            className="w-full px-2 py-1.5 border rounded text-xs bg-gray-50 mt-1"
                                        >
                                            {Object.entries(GEO_SYMBOLS).map(([k, d]) => (
                                                <option key={k} value={k}>{d.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Tamaño: {selectedSymbol.size}px</label>
                                        <input
                                            type="range"
                                            min="10"
                                            max="56"
                                            value={selectedSymbol.size}
                                            onChange={(e) => {
                                                const newSize = parseInt(e.target.value, 10);
                                                setDefaultSymbolSize(newSize);
                                                setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, size: newSize } : s));
                                            }}
                                            className="w-full h-2 bg-gray-200 rounded-lg cursor-pointer mt-1"
                                        />
                                    </div>
                                    <div>
                                        <div className="flex items-center justify-between">
                                            <label className="text-[10px] font-bold text-gray-500 uppercase">Inclinación / Rotación: {selectedSymbol.rotation || 0}°</label>
                                            <button
                                                onClick={() => setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, rotation: 0 } : s))}
                                                className="text-[10px] text-blue-600 font-bold hover:underline"
                                            >0°</button>
                                        </div>
                                        <input
                                            type="range"
                                            min="-180"
                                            max="180"
                                            value={selectedSymbol.rotation || 0}
                                            onChange={(e) => setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, rotation: parseInt(e.target.value) } : s))}
                                            className="w-full h-2 bg-gray-200 rounded-lg cursor-pointer mt-1"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Color</label>
                                        <input
                                            type="color"
                                            value={selectedSymbol.color}
                                            onChange={(e) => {
                                                const newCol = e.target.value;
                                                setDefaultSymbolColor(newCol);
                                                setGeoSymbols(geoSymbols.map(s => s.id === selectedSymbolId ? { ...s, color: newCol } : s));
                                            }}
                                            className="w-full h-8 border rounded cursor-pointer mt-1"
                                        />
                                    </div>
                                    <button
                                        onClick={() => { saveHistory(); setGeoSymbols(geoSymbols.filter(s => s.id !== selectedSymbolId)); setSelectedSymbolId(null); }}
                                        className="w-full py-2 bg-red-50 text-red-600 font-bold rounded-lg hover:bg-red-100 transition text-sm"
                                    >
                                        Eliminar Símbolo
                                    </button>
                                </div>
                            ) : selectedText ? (
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Contenido</label>
                                        <input
                                            type="text"
                                            value={selectedText.text}
                                            onChange={(e) => setFloatingTexts(floatingTexts.map(t => t.id === selectedTextId ? { ...t, text: e.target.value } : t))}
                                            className="w-full px-3 py-2 border rounded text-sm mt-1 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Tamaño: {selectedText.size}px</label>
                                        <input
                                            type="range"
                                            min="8"
                                            max="60"
                                            value={selectedText.size}
                                            onChange={(e) => setFloatingTexts(floatingTexts.map(t => t.id === selectedTextId ? { ...t, size: parseInt(e.target.value) } : t))}
                                            className="w-full h-2 bg-gray-200 rounded-lg cursor-pointer mt-1"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-gray-500 uppercase">Color</label>
                                        <input
                                            type="color"
                                            value={selectedText.color}
                                            onChange={(e) => setFloatingTexts(floatingTexts.map(t => t.id === selectedTextId ? { ...t, color: e.target.value } : t))}
                                            className="w-full h-8 border rounded cursor-pointer mt-1"
                                        />
                                    </div>
                                    <button
                                        onClick={() => { saveHistory(); setFloatingTexts(floatingTexts.filter(t => t.id !== selectedTextId)); setSelectedTextId(null); }}
                                        className="w-full py-2 bg-red-50 text-red-600 font-bold rounded-lg hover:bg-red-100 transition text-sm"
                                    >
                                        Borrar Texto
                                    </button>
                                </div>
                            ) : (
                                <div className="text-center opacity-60 text-xs py-14 space-y-2">
                                    <div className="italic font-medium">Selecciona un estrato, canal, falla, símbolo o texto para editar</div>
                                    <div className="text-[10px] text-gray-400">
                                        Atajos: Ctrl+Z (Deshacer) · Ctrl+Y (Rehacer) · Supr (Eliminar) · Enter (Cerrar)
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
