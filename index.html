        // =========================================================================
        // UTILIDADES GEOMÉTRICAS (SNAP, CUERPOS ARQUITECTURALES, RECORTE DE FALLAS)
        // =========================================================================
        const getDistToSegment = (p, v, w) => {
            const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return { dist: Math.hypot(p.x - v.x, p.y - v.y), proj: v };
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            const proj = { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
            return { dist: Math.hypot(p.x - proj.x, p.y - proj.y), proj };
        };

        const isPointOnPolyBoundary = (pt, polyPoints) => {
            for (let j = 0; j < polyPoints.length; j++) {
                if (getDistToSegment(pt, polyPoints[j], polyPoints[(j + 1) % polyPoints.length]).dist < 5) return true;
            }
            return false;
        };

        // Área con signo para determinar orientación horaria/antihoraria y normales externas exactas
        const signedPolyArea = (pts) => {
            if (!pts || pts.length < 3) return 0;
            let area2 = 0;
            for (let i = 0; i < pts.length; i++) {
                const j = (i + 1) % pts.length;
                area2 += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
            }
            return area2 / 2;
        };

        // Determina si un segmento de un polígono corresponde a la base, techo o flanco lateral
        const getSegmentRole = (p1, p2, polyPoints) => {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len < 1e-4) return 'side';
            const area = signedPolyArea(polyPoints);
            // En canvas (Y hacia abajo): si area > 0 (horario), normal externa = (dy, -dx)
            const ny = (area >= 0 ? -dx : dx) / len;
            if (ny > 0.2) return 'base';
            if (ny < -0.2) return 'top';
            return 'side';
        };

        // Verifica si un segmento (p1, p2) coincide con un borde real de otro polígono y devuelve su rol en ese polígono
        const findSharedEdgeRole = (p1, p2, otherPoints) => {
            if (!otherPoints || otherPoints.length < 3) return null;
            const sampleTs = [0.25, 0.5, 0.75];
            for (let t of sampleTs) {
                const pt = { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
                if (!isPointOnPolyBoundary(pt, otherPoints)) return null;
            }
            const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
            let bestDist = 6;
            let bestIdx = -1;
            for (let j = 0; j < otherPoints.length; j++) {
                const d = getDistToSegment(mid, otherPoints[j], otherPoints[(j + 1) % otherPoints.length]).dist;
                if (d < bestDist) {
                    bestDist = d;
                    bestIdx = j;
                }
            }
            if (bestIdx === -1) return null;
            return getSegmentRole(otherPoints[bestIdx], otherPoints[(bestIdx + 1) % otherPoints.length], otherPoints);
        };

        const translatePoly = (poly, dx, dy) => {
            const next = {
                ...poly,
                points: poly.points.map(pt => ({ x: pt.x + dx, y: pt.y + dy }))
            };
            if (poly.architecturalMeta?.controls) {
                next.architecturalMeta = {
                    ...poly.architecturalMeta,
                    controls: poly.architecturalMeta.controls.map(c => ({ x: c.x + dx, y: c.y + dy }))
                };
            }
            if (poly.internalLines) {
                next.internalLines = poly.internalLines.map(line => ({
                    ...line,
                    points: line.points.map(pt => ({ x: pt.x + dx, y: pt.y + dy }))
                }));
            }
            return next;
        };

        const sampleQuadratic = (p0, p1, p2, steps = 16) => {
            const pts = [];
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const inv = 1 - t;
                pts.push({
                    x: inv * inv * p0.x + 2 * inv * t * p1.x + t * t * p2.x,
                    y: inv * inv * p0.y + 2 * inv * t * p1.y + t * t * p2.y
                });
            }
            return pts;
        };

        // Genera polígonos y líneas internas de cuerpos sedimentarios a partir de 3 puntos de control [p1, p2, p3]
        const buildArchitecturalBody = (bodyType, p1, p2, p3) => {
            const left = p1.x <= p2.x ? p1 : p2;
            const right = p1.x <= p2.x ? p2 : p1;
            const midTop = { x: (left.x + right.x) / 2, y: (left.y + right.y) / 2 };
            const dx = right.x - left.x;
            const dy = right.y - left.y;
            const span = Math.hypot(dx, dy) || 1;
            const ux = dx / span;
            const uy = dy / span;
            const nx = -uy;
            const ny = ux;
            const depthVecX = p3.x - midTop.x;
            const depthVecY = p3.y - midTop.y;
            const signedDepth = depthVecX * nx + depthVecY * ny;
            const ctrl = {
                x: 2 * p3.x - 0.5 * (left.x + right.x),
                y: 2 * p3.y - 0.5 * (left.y + right.y)
            };

            const internalLines = [];
            let points = [];

            if (bodyType === 'channel_simple') {
                const curve = sampleQuadratic(right, ctrl, left, 16);
                points = [left, right, ...curve.slice(1, -1)];
            } else if (bodyType === 'channel_amalgamated') {
                const lobes = 3;
                const basePts = [];
                for (let l = 0; l < lobes; l++) {
                    const t0 = l / lobes;
                    const t1 = (l + 1) / lobes;
                    const a = { x: left.x + dx * t0, y: left.y + dy * t0 };
                    const b = { x: left.x + dx * t1, y: left.y + dy * t1 };
                    const localScale = l === 1 ? 1.12 : 0.92;
                    const midLobe = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
                    const localApex = {
                        x: midLobe.x + depthVecX * localScale,
                        y: midLobe.y + depthVecY * localScale
                    };
                    const localCtrl = {
                        x: 2 * localApex.x - 0.5 * (a.x + b.x),
                        y: 2 * localApex.y - 0.5 * (a.y + b.y)
                    };
                    const seg = sampleQuadratic(a, localCtrl, b, 10);
                    if (l === 0) basePts.push(...seg);
                    else basePts.push(...seg.slice(1));
                    if (l > 0) {
                        const scStart = { x: left.x + dx * (t0 - 0.08), y: left.y + dy * (t0 - 0.08) };
                        const scEnd = { x: left.x + dx * (t0 + 0.14), y: left.y + dy * (t0 + 0.14) };
                        const scCtrl = {
                            x: (scStart.x + scEnd.x) / 2 + depthVecX * 0.85,
                            y: (scStart.y + scEnd.y) / 2 + depthVecY * 0.85
                        };
                        internalLines.push({ style: 'erosive', points: sampleQuadratic(scStart, scCtrl, scEnd, 8) });
                    }
                }
                points = [...basePts.reverse()];
            } else if (bodyType === 'point_bar') {
                const curve = sampleQuadratic(right, ctrl, left, 16);
                points = [left, right, ...curve.slice(1, -1)];
                const count = 4;
                for (let i = 1; i <= count; i++) {
                    const tTop = 0.18 + (i / (count + 1)) * 0.68;
                    const tBot = Math.max(0.08, tTop - 0.16);
                    const topPt = { x: left.x + dx * tTop, y: left.y + dy * tTop };
                    const invB = 1 - tBot;
                    const botPt = {
                        x: invB * invB * left.x + 2 * invB * tBot * ctrl.x + tBot * tBot * right.x,
                        y: invB * invB * left.y + 2 * invB * tBot * ctrl.y + tBot * tBot * right.y
                    };
                    const midCtrl = {
                        x: (topPt.x + botPt.x) / 2 - ux * (span * 0.04),
                        y: (topPt.y + botPt.y) / 2 + ny * (signedDepth * 0.12)
                    };
                    internalLines.push({ style: 'concordant', points: sampleQuadratic(topPt, midCtrl, botPt, 8) });
                }
            } else if (bodyType === 'longitudinal_bar') {
                const topCtrl = {
                    x: midTop.x - depthVecX * 0.75,
                    y: midTop.y - depthVecY * 0.75
                };
                const botCtrl = {
                    x: midTop.x + depthVecX * 0.95,
                    y: midTop.y + depthVecY * 0.95
                };
                const topCurve = sampleQuadratic(left, topCtrl, right, 14);
                const botCurve = sampleQuadratic(right, botCtrl, left, 14);
                points = [...topCurve, ...botCurve.slice(1, -1)];
                const midLine = sampleQuadratic(
                    { x: left.x + dx * 0.15, y: left.y + dy * 0.15 },
                    { x: midTop.x + depthVecX * 0.1, y: midTop.y + depthVecY * 0.1 },
                    { x: left.x + dx * 0.85, y: left.y + dy * 0.85 },
                    10
                );
                internalLines.push({ style: 'transitional', points: midLine });
            } else if (bodyType === 'crevasse_splay') {
                const apexCtrl = {
                    x: left.x + dx * 0.35 + depthVecX * 1.4,
                    y: left.y + dy * 0.35 + depthVecY * 1.4
                };
                const topCurve = sampleQuadratic(left, apexCtrl, right, 16);
                points = [...topCurve, { x: left.x + dx * 0.5, y: left.y + dy * 0.5 }];
            } else if (bodyType === 'levee') {
                const peak = {
                    x: left.x + dx * 0.18 + depthVecX * 1.25,
                    y: left.y + dy * 0.18 + depthVecY * 1.25
                };
                const slopeCtrl = {
                    x: left.x + dx * 0.52 + depthVecX * 0.55,
                    y: left.y + dy * 0.52 + depthVecY * 0.55
                };
                const slopeCurve = sampleQuadratic(peak, slopeCtrl, right, 14);
                points = [left, peak, ...slopeCurve.slice(1)];
            } else if (bodyType === 'bioherm') {
                const domeCtrl = {
                    x: midTop.x + depthVecX * 1.6,
                    y: midTop.y + depthVecY * 1.6
                };
                const domeCurve = sampleQuadratic(left, domeCtrl, right, 18);
                points = [...domeCurve];
            } else {
                const curve = sampleQuadratic(right, ctrl, left, 16);
                points = [left, right, ...curve.slice(1, -1)];
            }

            return {
                points,
                internalLines,
                architecturalMeta: { bodyType, controls: [{ ...left }, { ...right }, { ...p3 }] }
            };
        };

        // Utilidades geométricas para la herramienta de Recorte / Bloques de Falla
        const segmentsIntersect = (p1, p2, p3, p4) => {
            const ccw = (A, B, C) => (C.y - A.y) * (B.x - A.x) - (B.y - A.y) * (C.x - A.x);
            const d1 = ccw(p3, p4, p1);
            const d2 = ccw(p3, p4, p2);
            const d3 = ccw(p1, p2, p3);
            const d4 = ccw(p1, p2, p4);
            return (((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0)));
        };

        const isPointInPoly = (pt, polyPoints) => {
            let inside = false;
            for (let i = 0, j = polyPoints.length - 1; i < polyPoints.length; j = i++) {
                const xi = polyPoints[i].x, yi = polyPoints[i].y;
                const xj = polyPoints[j].x, yj = polyPoints[j].y;
                const intersect = ((yi > pt.y) !== (yj > pt.y)) &&
                    (pt.x < (xj - xi) * (pt.y - yi) / ((yj - yi) || 1e-9) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        };

        const polyArea = (pts) => {
            if (!pts || pts.length < 3) return 0;
            let area = 0;
            for (let i = 0; i < pts.length; i++) {
                const j = (i + 1) % pts.length;
                area += pts[i].x * pts[j].y - pts[j].x * pts[i].y;
            }
            return Math.abs(area) / 2;
        };

        const doesSegmentCrossPoly = (a, b, polyPoints) => {
            if (!polyPoints || polyPoints.length < 3) return false;
            for (let i = 0; i < polyPoints.length; i++) {
                const p1 = polyPoints[i];
                const p2 = polyPoints[(i + 1) % polyPoints.length];
                if (segmentsIntersect(a, b, p1, p2)) return true;
            }
            return isPointInPoly(a, polyPoints) || isPointInPoly(b, polyPoints);
        };

        const clipPolyHalfPlane = (points, a, b, keepPositive) => {
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const sign = keepPositive ? 1 : -1;
            const EPS = 1e-6;
            const inside = (p) => sign * ((p.x - a.x) * dy - (p.y - a.y) * dx) >= -EPS;
            const intersect = (p1, p2) => {
                const d1 = (p1.x - a.x) * dy - (p1.y - a.y) * dx;
                const d2 = (p2.x - a.x) * dy - (p2.y - a.y) * dx;
                const denom = d1 - d2;
                if (Math.abs(denom) < 1e-9) return { ...p1 };
                const t = Math.max(0, Math.min(1, d1 / denom));
                return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
            };

            const output = [];
            for (let i = 0; i < points.length; i++) {
                const curr = points[i];
                const prev = points[(i + points.length - 1) % points.length];
                const currIn = inside(curr);
                const prevIn = inside(prev);
                if (currIn) {
                    if (!prevIn) output.push(intersect(prev, curr));
                    output.push({ x: curr.x, y: curr.y });
                } else if (prevIn) {
                    output.push(intersect(prev, curr));
                }
            }
            const cleaned = [];
            for (let pt of output) {
                const last = cleaned[cleaned.length - 1];
                if (!last || Math.hypot(pt.x - last.x, pt.y - last.y) > 0.5) {
                    cleaned.push(pt);
                }
            }
            if (cleaned.length > 1 && Math.hypot(cleaned[0].x - cleaned[cleaned.length - 1].x, cleaned[0].y - cleaned[cleaned.length - 1].y) < 0.5) {
                cleaned.pop();
            }
            return cleaned.length >= 3 && polyArea(cleaned) > 15 ? cleaned : null;
        };

        const clipInternalLinesHalfPlane = (internalLines, a, b, keepPositive) => {
            if (!internalLines || internalLines.length === 0) return undefined;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const sign = keepPositive ? 1 : -1;
            const inside = (p) => sign * ((p.x - a.x) * dy - (p.y - a.y) * dx) >= -1e-6;
            const intersect = (p1, p2) => {
                const d1 = (p1.x - a.x) * dy - (p1.y - a.y) * dx;
                const d2 = (p2.x - a.x) * dy - (p2.y - a.y) * dx;
                const denom = d1 - d2;
                if (Math.abs(denom) < 1e-9) return { ...p1 };
                const t = Math.max(0, Math.min(1, d1 / denom));
                return { x: p1.x + t * (p2.x - p1.x), y: p1.y + t * (p2.y - p1.y) };
            };
            const result = [];
            internalLines.forEach(line => {
                if (!line.points || line.points.length < 2) return;
                let currentRun = [];
                for (let i = 0; i < line.points.length - 1; i++) {
                    const p1 = line.points[i];
                    const p2 = line.points[i + 1];
                    const in1 = inside(p1);
                    const in2 = inside(p2);
                    if (in1 && in2) {
                        if (currentRun.length === 0) currentRun.push({ ...p1 });
                        currentRun.push({ ...p2 });
                    } else if (in1 && !in2) {
                        if (currentRun.length === 0) currentRun.push({ ...p1 });
                        currentRun.push(intersect(p1, p2));
                        if (currentRun.length >= 2) result.push({ style: line.style, points: currentRun });
                        currentRun = [];
                    } else if (!in1 && in2) {
                        currentRun = [intersect(p1, p2), { ...p2 }];
                    }
                }
                if (currentRun.length >= 2) result.push({ style: line.style, points: currentRun });
            });
            return result.length > 0 ? result : undefined;
        };

        // =========================================================================
        // FUNCIONES DE DIBUJO EN CANVAS (CONTACTOS, FALLAS, SÍMBOLOS, PREVIEWS)
        // =========================================================================
        const traceErosiveSegment = (ctx, p1, p2) => {
            let start = p1, end = p2, reversed = false;
            if (p1.x > p2.x || (Math.abs(p1.x - p2.x) < 1 && p1.y > p2.y)) {
                start = p2; end = p1; reversed = true;
            }
            const dx = end.x - start.x, dy = end.y - start.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);
            const steps = Math.max(2, Math.floor(dist / 6));
            const pts = [];
            for (let j = 0; j <= steps; j++) {
                const d = (j / steps) * dist;
                const waveY = Math.sin(d * 0.3) * 4;
                pts.push({
                    x: start.x + Math.cos(angle) * d - Math.sin(angle) * waveY,
                    y: start.y + Math.sin(angle) * d + Math.cos(angle) * waveY
                });
            }
            if (reversed) pts.reverse();
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        };

        const drawDecoratedSegment = (ctx, p1, p2, styleType, color = '#000', isSelected = false, flipArrows = false) => {
            const strokeColor = isSelected ? '#3b82f6' : color;
            ctx.save();
            ctx.strokeStyle = strokeColor;
            ctx.fillStyle = strokeColor;
            ctx.setLineDash([]);
            ctx.lineWidth = 2;

            if (styleType === 'erosive') {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                traceErosiveSegment(ctx, p1, p2);
                ctx.stroke();
                ctx.restore();
                return;
            }

            if (styleType === 'fault' || styleType === 'faulted') ctx.lineWidth = 3.5;
            else if (styleType === 'inferred') { ctx.lineWidth = 3; ctx.setLineDash([12, 8]); }
            else if (styleType === 'discordant') ctx.setLineDash([12, 6]);
            else if (styleType === 'paraconcordant') ctx.setLineDash([15, 6, 2, 6]);
            else if (styleType === 'transitional') ctx.setLineDash([3, 5]);
            else if (styleType === 'joint') { ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); }
            else if (styleType === 'foliation') { ctx.lineWidth = 1.5; ctx.setLineDash([8, 4, 2, 4]); }
            else if (styleType === 'dike') { ctx.lineWidth = 5; }
            else if (styleType === 'fault_normal' || styleType === 'fault_reverse' || styleType === 'fault_strike') {
                ctx.lineWidth = 3;
            }

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.setLineDash([]);

            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);
            const nx = -Math.sin(angle), ny = Math.cos(angle);

            if (styleType === 'intrusive') {
                const step = 12;
                for (let d = step / 2; d < dist - 4; d += step) {
                    const bx = p1.x + Math.cos(angle) * d;
                    const by = p1.y + Math.sin(angle) * d;
                    ctx.beginPath();
                    ctx.moveTo(bx, by);
                    ctx.lineTo(bx + nx * 6, by + ny * 6);
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            } else if (styleType === 'fault_normal' || styleType === 'fault_reverse') {
                if (dist > 22) {
                    // Vector unitario buzamiento abajo (uy >= 0)
                    let ux = dx / dist;
                    let uy = dy / dist;
                    if (uy < 0 || (Math.abs(uy) < 1e-4 && ux < 0)) {
                        ux = -ux;
                        uy = -uy;
                    }
                    // Normal hacia el bloque techo (arriba del plano: hy < 0)
                    let hx = uy, hy = -ux;
                    if (hy > 0 || (Math.abs(hy) < 1e-4 && hx < 0)) {
                        hx = -hx;
                        hy = -hy;
                    }
                    // Normal hacia el bloque piso (abajo del plano)
                    const fx = -hx, fy = -hy;

                    // Normal: techo baja (+u), piso sube (-u). Inversa: techo sube (-u), piso baja (+u)
                    let hangingDir = styleType === 'fault_normal' ? 1 : -1;
                    if (flipArrows) hangingDir *= -1;
                    const footDir = -hangingDir;

                    const drawProfileHalfArrow = (cx, cy, sx, sy, dir) => {
                        const offset = 7;
                        const halfLen = Math.min(13, dist * 0.28);
                        const ox = cx + sx * offset;
                        const oy = cy + sy * offset;
                        const adx = ux * dir;
                        const ady = uy * dir;
                        const tailX = ox - adx * halfLen;
                        const tailY = oy - ady * halfLen;
                        const tipX = ox + adx * halfLen;
                        const tipY = oy + ady * halfLen;

                        ctx.beginPath();
                        ctx.moveTo(tailX, tailY);
                        ctx.lineTo(tipX, tipY);
                        ctx.lineWidth = 2;
                        ctx.stroke();

                        // Media punta (arpón geológico de perfil) apuntando hacia afuera del plano
                        const headLen = 7.5;
                        const wingW = 5.5;
                        ctx.beginPath();
                        ctx.moveTo(tipX, tipY);
                        ctx.lineTo(tipX - adx * headLen, tipY - ady * headLen);
                        ctx.lineTo(tipX - adx * headLen + sx * wingW, tipY - ady * headLen + sy * wingW);
                        ctx.closePath();
                        ctx.fill();
                    };

                    const anchors = dist > 220 ? [0.33, 0.67] : [0.5];
                    anchors.forEach(t => {
                        const cx = p1.x + dx * t;
                        const cy = p1.y + dy * t;
                        drawProfileHalfArrow(cx, cy, hx, hy, hangingDir);
                        drawProfileHalfArrow(cx, cy, fx, fy, footDir);
                    });
                }
            } else if (styleType === 'fault_strike') {
                const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
                const drawHalfArrow = (dir, side) => {
                    const ox = midX + nx * (side * 5);
                    const oy = midY + ny * (side * 5);
                    const ex = ox + Math.cos(angle) * (dir * 12);
                    const ey = oy + Math.sin(angle) * (dir * 12);
                    ctx.beginPath();
                    ctx.moveTo(ox - Math.cos(angle) * (dir * 10), oy - Math.sin(angle) * (dir * 10));
                    ctx.lineTo(ex, ey);
                    ctx.lineTo(ex - Math.cos(angle) * (dir * 5) + nx * (side * 4), ey - Math.sin(angle) * (dir * 5) + ny * (side * 4));
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                };
                if (dist > 25) {
                    drawHalfArrow(1, 1);
                    drawHalfArrow(-1, -1);
                }
            } else if (styleType === 'anticline' || styleType === 'syncline') {
                const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
                if (dist > 25) {
                    [-1, 1].forEach(side => {
                        const tx = midX + nx * (side * 12);
                        const ty = midY + ny * (side * 12);
                        ctx.beginPath();
                        ctx.moveTo(midX, midY);
                        ctx.lineTo(tx, ty);
                        ctx.lineWidth = 1.8;
                        ctx.stroke();
                        ctx.beginPath();
                        if (styleType === 'anticline') {
                            ctx.moveTo(tx, ty);
                            ctx.lineTo(tx - nx * (side * 5) - Math.cos(angle) * 4, ty - ny * (side * 5) - Math.sin(angle) * 4);
                            ctx.lineTo(tx - nx * (side * 5) + Math.cos(angle) * 4, ty - ny * (side * 5) + Math.sin(angle) * 4);
                        } else {
                            ctx.moveTo(midX + nx * (side * 3), midY + ny * (side * 3));
                            ctx.lineTo(midX + nx * (side * 8) - Math.cos(angle) * 4, midY + ny * (side * 8) - Math.sin(angle) * 4);
                            ctx.lineTo(midX + nx * (side * 8) + Math.cos(angle) * 4, midY + ny * (side * 8) + Math.sin(angle) * 4);
                        }
                        ctx.closePath();
                        ctx.fill();
                    });
                }
            }
            ctx.restore();
        };

        const drawGeoSymbol = (ctx, sym) => {
            ctx.save();
            ctx.translate(sym.x, sym.y);
            if (sym.rotation) {
                ctx.rotate((sym.rotation * Math.PI) / 180);
            }
            const s = (sym.size || 24) / 24;
            ctx.scale(s, s);
            ctx.strokeStyle = sym.color || '#000';
            ctx.fillStyle = sym.color || '#000';
            ctx.lineWidth = 2;

            switch (sym.symbolType) {
                // Deformación sinsedimentaria
                case 'ball_pillow':
                    ctx.beginPath();
                    ctx.ellipse(-6, 1, 5.5, 3.8, 0.1, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(-6, 0.5, 2.5, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.ellipse(6, -1, 5.5, 3.5, -0.1, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(6, -1.5, 2.5, 0.2, Math.PI - 0.2);
                    ctx.stroke();
                    break;
                case 'load_casts':
                    ctx.beginPath();
                    ctx.moveTo(-12, -4);
                    ctx.quadraticCurveTo(-8, 8, -4, -3);
                    ctx.quadraticCurveTo(0, 9, 5, -3);
                    ctx.quadraticCurveTo(9, 7, 12, -4);
                    ctx.stroke();
                    break;
                case 'flame_structure':
                    ctx.beginPath();
                    ctx.moveTo(-12, 6);
                    ctx.quadraticCurveTo(-8, 6, -6, -6);
                    ctx.quadraticCurveTo(-4, 6, 0, 6);
                    ctx.quadraticCurveTo(4, 6, 6, -7);
                    ctx.quadraticCurveTo(8, 6, 12, 6);
                    ctx.stroke();
                    break;
                case 'convolute':
                    ctx.beginPath();
                    ctx.moveTo(-12, 3);
                    ctx.bezierCurveTo(-8, -9, -4, 9, 0, -5);
                    ctx.bezierCurveTo(4, 9, 8, -9, 12, 3);
                    ctx.moveTo(-12, 8);
                    ctx.bezierCurveTo(-7, -3, -3, 10, 1, 0);
                    ctx.bezierCurveTo(5, 10, 9, -3, 12, 7);
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                    break;
                case 'slump_fold':
                    ctx.beginPath();
                    ctx.moveTo(-11, -7);
                    ctx.lineTo(5, -7);
                    ctx.quadraticCurveTo(12, -4, 5, 0);
                    ctx.lineTo(-5, 0);
                    ctx.quadraticCurveTo(-12, 3, -5, 7);
                    ctx.lineTo(11, 7);
                    ctx.stroke();
                    break;
                case 'clastic_dike':
                    ctx.beginPath();
                    ctx.moveTo(-4, 11);
                    ctx.lineTo(-1, -10);
                    ctx.lineTo(3, 11);
                    ctx.moveTo(-12, 3); ctx.lineTo(-3, 3);
                    ctx.moveTo(2, 3); ctx.lineTo(12, 3);
                    ctx.stroke();
                    break;
                case 'mud_cracks':
                    ctx.beginPath();
                    ctx.moveTo(-12, -6); ctx.lineTo(12, -6);
                    ctx.moveTo(-7, -6); ctx.lineTo(-5, 7); ctx.lineTo(-3, -6);
                    ctx.moveTo(3, -6); ctx.lineTo(5, 8); ctx.lineTo(7, -6);
                    ctx.stroke();
                    break;

                // Estructural
                case 'block_arrow_up':
                    ctx.beginPath();
                    ctx.moveTo(0, 11); ctx.lineTo(0, -10);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, -12); ctx.lineTo(-5, -4); ctx.lineTo(5, -4);
                    ctx.closePath(); ctx.fill();
                    break;
                case 'block_arrow_down':
                    ctx.beginPath();
                    ctx.moveTo(0, -11); ctx.lineTo(0, 10);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, 12); ctx.lineTo(-5, 4); ctx.lineTo(5, 4);
                    ctx.closePath(); ctx.fill();
                    break;
                case 'fault_pair_normal':
                    ctx.beginPath(); ctx.moveTo(-7, -11); ctx.lineTo(7, 11); ctx.lineWidth = 2.2; ctx.stroke();
                    // Techo (derecha) baja
                    ctx.beginPath(); ctx.moveTo(2, -7); ctx.lineTo(10, 6); ctx.lineWidth = 1.7; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(11, 7); ctx.lineTo(6, 3); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
                    // Piso (izquierda) sube
                    ctx.beginPath(); ctx.moveTo(-2, 7); ctx.lineTo(-10, -6); ctx.lineWidth = 1.7; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-11, -7); ctx.lineTo(-6, -3); ctx.lineTo(-10, 0); ctx.closePath(); ctx.fill();
                    break;
                case 'fault_pair_reverse':
                    ctx.beginPath(); ctx.moveTo(-7, -11); ctx.lineTo(7, 11); ctx.lineWidth = 2.2; ctx.stroke();
                    // Techo (derecha) sube
                    ctx.beginPath(); ctx.moveTo(10, 6); ctx.lineTo(2, -7); ctx.lineWidth = 1.7; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(1, -8); ctx.lineTo(6, -4); ctx.lineTo(2, -1); ctx.closePath(); ctx.fill();
                    // Piso (izquierda) baja
                    ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(-2, 7); ctx.lineWidth = 1.7; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-1, 8); ctx.lineTo(-6, 4); ctx.lineTo(-2, 1); ctx.closePath(); ctx.fill();
                    break;
                case 'dip_right':
                    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(0, 0); ctx.lineTo(10, 0); ctx.stroke();
                    break;
                case 'dip_left':
                    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(0, 0); ctx.lineTo(-10, 0); ctx.stroke();
                    break;
                case 'horizontal_strata':
                    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.moveTo(0, -9); ctx.lineTo(0, 9); ctx.stroke();
                    break;
                case 'vertical_strata':
                    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.moveTo(-4, -7); ctx.lineTo(4, 7); ctx.moveTo(4, -7); ctx.lineTo(-4, 7); ctx.stroke();
                    break;
                case 'anticline_sym':
                    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-7, -4); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(7, -4); ctx.lineTo(7, 4); ctx.closePath(); ctx.fill();
                    break;
                case 'syncline_sym':
                    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(8, -4); ctx.lineTo(8, 4); ctx.closePath(); ctx.fill();
                    break;

                // Sedimentario / Facies
                case 'horizontal_laminations':
                    ctx.beginPath();
                    ctx.moveTo(-12, -7); ctx.lineTo(12, -7);
                    ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
                    ctx.moveTo(-12, 7); ctx.lineTo(12, 7);
                    ctx.stroke();
                    break;
                case 'massive_bedding':
                    ctx.strokeRect(-12, -8, 24, 16);
                    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('Sm', 0, 0);
                    break;
                case 'cross_planar':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-8, -10); ctx.lineTo(4, 10);
                    ctx.moveTo(0, -10); ctx.lineTo(10, 5);
                    ctx.stroke();
                    break;
                case 'cross_trough':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-10, -10); ctx.quadraticCurveTo(-3, 6, 4, 10);
                    ctx.moveTo(-2, -10); ctx.quadraticCurveTo(5, 6, 11, 10);
                    ctx.stroke();
                    break;
                case 'cross_parallel':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-10, -10); ctx.lineTo(0, 10);
                    ctx.moveTo(-3, -10); ctx.lineTo(7, 10);
                    ctx.moveTo(4, -10); ctx.lineTo(12, 2);
                    ctx.stroke();
                    break;
                case 'cross_low_angle':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-12, -6); ctx.quadraticCurveTo(0, -2, 12, -8);
                    ctx.moveTo(-12, 2); ctx.quadraticCurveTo(0, 6, 12, 0);
                    ctx.stroke();
                    break;
                case 'herringbone':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-8, -10); ctx.lineTo(-2, 0);
                    ctx.moveTo(0, -10); ctx.lineTo(6, 0);
                    ctx.moveTo(-2, 0); ctx.lineTo(-8, 10);
                    ctx.moveTo(6, 0); ctx.lineTo(0, 10);
                    ctx.stroke();
                    break;
                case 'flaser_bedding':
                    ctx.beginPath();
                    ctx.moveTo(-12, -4); ctx.quadraticCurveTo(-6, 3, 0, -4); ctx.quadraticCurveTo(6, 3, 12, -4);
                    ctx.moveTo(-10, 4); ctx.quadraticCurveTo(-4, 9, 2, 4); ctx.quadraticCurveTo(7, 9, 12, 4);
                    ctx.stroke();
                    break;
                case 'ripples_current':
                    ctx.beginPath();
                    ctx.moveTo(-12, 4); ctx.lineTo(-4, -4); ctx.lineTo(2, 4); ctx.lineTo(10, -4); ctx.stroke();
                    break;
                case 'ripples_wave':
                    ctx.beginPath();
                    ctx.moveTo(-12, 2); ctx.quadraticCurveTo(-6, -6, 0, 2); ctx.quadraticCurveTo(6, -6, 12, 2);
                    ctx.stroke();
                    break;
                case 'graded_bedding':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.stroke();
                    for (let px = -8; px <= 8; px += 4) {
                        ctx.beginPath(); ctx.arc(px, 6, 1.8, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(px, -2, 1.0, 0, Math.PI * 2); ctx.fill();
                    }
                    break;
                case 'basal_lag':
                    ctx.beginPath();
                    ctx.moveTo(-12, 6); ctx.quadraticCurveTo(-6, 9, 0, 6); ctx.quadraticCurveTo(6, 9, 12, 6);
                    ctx.stroke();
                    [[-7, 2, 3.2, 2], [0, 2, 3.6, 2.2], [7, 2, 3, 2]].forEach(([cx, cy, rx, ry]) => {
                        ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
                    });
                    break;
                case 'imbrication':
                    [-7, 0, 7].forEach(cx => {
                        ctx.beginPath();
                        ctx.ellipse(cx, 0, 4.5, 2.2, -0.5, 0, Math.PI * 2);
                        ctx.stroke();
                    });
                    break;
                case 'paleocurrent':
                    ctx.beginPath();
                    ctx.moveTo(-11, 0); ctx.lineTo(9, 0);
                    ctx.moveTo(4, -5); ctx.lineTo(10, 0); ctx.lineTo(4, 5);
                    ctx.stroke();
                    break;
                case 'paleosol':
                    ctx.beginPath();
                    ctx.moveTo(-12, -7); ctx.lineTo(12, -7);
                    ctx.moveTo(-5, -7); ctx.lineTo(-5, 6); ctx.moveTo(-5, 0); ctx.lineTo(-9, 5); ctx.moveTo(-5, 2); ctx.lineTo(-1, 7);
                    ctx.moveTo(5, -7); ctx.lineTo(5, 7); ctx.moveTo(5, -1); ctx.lineTo(9, 4);
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                    break;
                case 'bioturbation':
                    ctx.beginPath();
                    ctx.moveTo(-10, -8); ctx.bezierCurveTo(-4, 8, 4, -8, 10, 8);
                    ctx.moveTo(-6, 2); ctx.bezierCurveTo(-2, -6, 2, 6, 6, -2);
                    ctx.lineWidth = 1.5; ctx.stroke();
                    break;
                case 'nodules':
                    ctx.beginPath(); ctx.ellipse(-5, -2, 5, 3, 0, 0, Math.PI * 2); ctx.stroke();
                    ctx.beginPath(); ctx.ellipse(6, 3, 4, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
                    break;

                // Paleontología
                case 'fossil_ammonite':
                    ctx.beginPath();
                    for (let a = 0; a < Math.PI * 3.5; a += 0.2) {
                        const r = a * 1.1;
                        const x = Math.cos(a) * r, y = Math.sin(a) * r;
                        if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    break;
                case 'fossil_shell':
                    ctx.beginPath(); ctx.arc(0, 4, 9, Math.PI, 0); ctx.closePath(); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(-5, -3); ctx.moveTo(0, 4); ctx.lineTo(0, -5); ctx.moveTo(0, 4); ctx.lineTo(5, -3); ctx.stroke();
                    break;
                case 'fossil_plant':
                    ctx.beginPath(); ctx.moveTo(0, 10); ctx.quadraticCurveTo(2, 0, 0, -10);
                    ctx.moveTo(0, 4); ctx.lineTo(-6, 0); ctx.moveTo(0, 0); ctx.lineTo(6, -4); ctx.moveTo(0, -4); ctx.lineTo(-5, -8);
                    ctx.stroke();
                    break;
                case 'trace_fossil':
                    ctx.beginPath();
                    ctx.moveTo(-8, -9); ctx.lineTo(-8, 4); ctx.arc(-2, 4, 6, Math.PI, 0, true); ctx.lineTo(4, -9);
                    ctx.moveTo(-6, 1); ctx.lineTo(2, 1);
                    ctx.moveTo(-6, 4); ctx.lineTo(2, 4);
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                    break;
                default:
                    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        };

        const createPatternDataURL = (getPatternFn, patternKey, bgColor) => {
            const c = document.createElement('canvas');
            c.width = 48; c.height = 28;
            const ctx = c.getContext('2d');
            ctx.fillStyle = bgColor || '#ffffff';
            ctx.fillRect(0, 0, 48, 28);
            const pat = getPatternFn(ctx, patternKey, 'transparent');
            if (pat) {
                ctx.fillStyle = pat;
                ctx.fillRect(0, 0, 48, 28);
            }
            return c.toDataURL();
        };

        const createStructurePatternDataURL = (getStructPatternFn, patternKey) => {
            const c = document.createElement('canvas');
            c.width = 48; c.height = 28;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 48, 28);
            const pat = getStructPatternFn(ctx, patternKey);
            if (pat) {
                ctx.fillStyle = pat;
                ctx.fillRect(0, 0, 48, 28);
            }
            return c.toDataURL();
        };

        const createLinePreviewDataURL = (styleType, color = '#000', flipArrows = false) => {
            const c = document.createElement('canvas');
            c.width = 56; c.height = 24;
            const ctx = c.getContext('2d');
            if (styleType === 'fault_normal' || styleType === 'fault_reverse') {
                drawDecoratedSegment(ctx, { x: 10, y: 4 }, { x: 46, y: 20 }, styleType, color, false, flipArrows);
            } else {
                drawDecoratedSegment(ctx, { x: 4, y: 12 }, { x: 52, y: 12 }, styleType, color, false, flipArrows);
            }
            return c.toDataURL();
        };

        const createSymbolPreviewDataURL = (symbolType, color = '#000') => {
            const c = document.createElement('canvas');
            c.width = 36; c.height = 28;
            const ctx = c.getContext('2d');
            drawGeoSymbol(ctx, { x: 18, y: 14, size: 20, symbolType, color });
            return c.toDataURL();
        };

        // =========================================================================
        // APLICACIÓN PRINCIPAL
        // =========================================================================
        function App() {
            const [bgColor, setBgColor] = useState('#fdf8c2');
            const [mode, setMode] = useState('select');
