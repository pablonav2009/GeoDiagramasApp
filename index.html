    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Componente de íconos vectoriales SVG
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {

                        <path d="M5 22h14" />

                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,

                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </>
                ),
                save: (
                    <>
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </>
                ),
                grid: (
                    <>
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
                    </>
                ),
                copy: (
                    <>
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                    </>
                ),
                layersUp: <path d="m18 15-6-6-6 6" />,
                layersDown: <path d="m6 9 6 6 6-6" />,
                compress: <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7" />,
                fileJson: (
                    <>
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                        <polyline points="14 2 14 8 20 8" />
                    </>
                )
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        // Formatos predefinidos de ancho para perfiles estándar y panorámicos
        const SHEET_PRESETS = [
            { label: 'Estándar', width: 900, desc: '900px' },
            { label: 'Horizontal', width: 1300, desc: '1300px' },
            { label: 'Panorámico', width: 1700, desc: '1700px' },
            { label: 'Ultra', width: 2200, desc: '2200px' }
        ];

        const PATTERNS = {
            none: { name: 'Sólido' },
            diagonal: { name: 'Basamento' },
            metamorphic: { name: 'Metamórfica' },
            volcanic: { name: 'Volcánica' },
            igneous: { name: 'Ígnea Plutónica' },
            sandstone: { name: 'Arenisca' },
            limestone: { name: 'Caliza' },
            limestone_fossil: { name: 'Caliza Fosilífera' },
            shale: { name: 'Lutita' },
            conglomerate: { name: 'Conglomerado' },
            arcillita: { name: 'Arcillita' },
            limolita: { name: 'Limolita' },
            fangolita: { name: 'Fangolita' },
            margas: { name: 'Margas' },
            arenisca_carbonatica: { name: 'Arenisca Carbonática' }
        };

        const CONTACT_TYPES = {
            concordant: { name: 'Contacto Concordante' },
            discordant: { name: 'Contacto Discordante' },
            erosive: { name: 'Contacto Erosivo' },
            paraconcordant: { name: 'Contacto Paraconcordante' },
            transitional: { name: 'Contacto Transicional / Gradacional' },
            intrusive: { name: 'Contacto Intrusivo' },
            faulted: { name: 'Contacto por Falla' },
            none: { name: 'Sin Contacto (Invisible)' }
        };

        const LINE_TYPES = {
            normal: { name: 'Línea de Dibujo', category: 'General' },
            fault: { name: 'Falla Indiferenciada', category: 'Fallas' },
            fault_normal: { name: 'Falla Normal', category: 'Fallas' },
            fault_reverse: { name: 'Falla Inversa / Cabalgamiento', category: 'Fallas' },
            fault_strike: { name: 'Falla Transcurrente / Rumbo', category: 'Fallas' },
            inferred: { name: 'Falla Inferida', category: 'Fallas' },
            anticline: { name: 'Eje de Pliegue Anticlinal', category: 'Pliegues' },
            syncline: { name: 'Eje de Pliegue Sinclinal', category: 'Pliegues' },
            joint: { name: 'Diaclasa / Fractura', category: 'Diaclasas y Planos' },
            foliation: { name: 'Foliación / Esquistosidad', category: 'Diaclasas y Planos' },
            dike: { name: 'Dique / Veta Mineral', category: 'Intrusivos' }
        };

        const GEO_SYMBOLS = {
            dip_right: { name: 'Rumbo y Buzamiento (Der)', category: 'Estructural' },
            dip_left: { name: 'Rumbo y Buzamiento (Izq)', category: 'Estructural' },
            horizontal_strata: { name: 'Estratos Horizontales', category: 'Estructural' },
            vertical_strata: { name: 'Estratos Verticales', category: 'Estructural' },
            anticline_sym: { name: 'Pliegue Anticlinal', category: 'Estructural' },
            syncline_sym: { name: 'Pliegue Sinclinal', category: 'Estructural' },

            horizontal_laminations: { name: 'Laminación Horizontal (Sli)', category: 'Sedimentario / Facies' },
            massive_bedding: { name: 'Estratificación Masiva (Sm)', category: 'Sedimentario / Facies' },
            cross_planar: { name: 'Cruzada Planar (Sp)', category: 'Sedimentario / Facies' },
            cross_trough: { name: 'Cruzada en Artesa / Trough (St)', category: 'Sedimentario / Facies' },
            cross_parallel: { name: 'Cruzada Paralela / Tabular', category: 'Sedimentario / Facies' },
            cross_low_angle: { name: 'Cruzada de Bajo Ángulo / HCS', category: 'Sedimentario / Facies' },
            ripples_current: { name: 'Ondulitas de Corriente (Sr)', category: 'Sedimentario / Facies' },
            ripples_wave: { name: 'Ondulitas de Oleaje (Simétricas)', category: 'Sedimentario / Facies' },
            graded_bedding: { name: 'Granoclasificación Normal', category: 'Sedimentario / Facies' },
            bioturbation: { name: 'Bioturbación / Skolithos', category: 'Sedimentario / Facies' },

            nodules: { name: 'Concreciones / Nódulos', category: 'Sedimentario / Facies' },
            fossil_ammonite: { name: 'Fósil Invertebrado (Amonite)', category: 'Paleontología' },
            fossil_shell: { name: 'Fósil Bivalvo / Braquiópodo', category: 'Paleontología' },
            fossil_plant: { name: 'Restos Vegetales / Flora', category: 'Paleontología' }
        };

        const CONTACT_POSITIONS = {
            base: { name: 'Solo en la Base' },
            top: { name: 'Solo en el Techo' },
            both: { name: 'Base y Techo' }
        };

        // Utilidades geométricas
        const getDistToSegment = (p, v, w) => {
            const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 === 0) return { dist: Math.hypot(p.x - v.x, p.y - v.y), proj: v };
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            const proj = { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
            return { dist: Math.hypot(p.x - proj.x, p.y - proj.y), proj };
        };

        const isPointOnPolyBoundary = (pt, polyPoints) => {
            for (let j = 0; j < polyPoints.length; j++) {
                if (getDistToSegment(pt, polyPoints[j], polyPoints[(j + 1) % polyPoints.length]).dist < 5) return true;
            }
            return false;
        };

        const traceErosiveSegment = (ctx, p1, p2) => {
            let start = p1, end = p2, reversed = false;
            if (p1.x > p2.x || (Math.abs(p1.x - p2.x) < 1 && p1.y > p2.y)) {
                start = p2; end = p1; reversed = true;
            }
            const dx = end.x - start.x, dy = end.y - start.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);
            const steps = Math.max(2, Math.floor(dist / 6));
            const pts = [];
            for (let j = 0; j <= steps; j++) {
                const d = (j / steps) * dist;
                const waveY = Math.sin(d * 0.3) * 4;
                pts.push({
                    x: start.x + Math.cos(angle) * d - Math.sin(angle) * waveY,
                    y: start.y + Math.sin(angle) * d + Math.cos(angle) * waveY
                });
            }
            if (reversed) pts.reverse();
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        };

        const drawDecoratedSegment = (ctx, p1, p2, styleType, color = '#000', isSelected = false) => {
            const strokeColor = isSelected ? '#3b82f6' : color;
            ctx.save();
            ctx.strokeStyle = strokeColor;
            ctx.fillStyle = strokeColor;
            ctx.setLineDash([]);
            ctx.lineWidth = 2;

            if (styleType === 'erosive') {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                traceErosiveSegment(ctx, p1, p2);
                ctx.stroke();
                ctx.restore();
                return;
            }

            if (styleType === 'fault' || styleType === 'faulted') ctx.lineWidth = 3.5;
            else if (styleType === 'inferred') { ctx.lineWidth = 3; ctx.setLineDash([12, 8]); }
            else if (styleType === 'discordant') ctx.setLineDash([12, 6]);
            else if (styleType === 'paraconcordant') ctx.setLineDash([15, 6, 2, 6]);
            else if (styleType === 'transitional') ctx.setLineDash([3, 5]);
            else if (styleType === 'joint') { ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); }
            else if (styleType === 'foliation') { ctx.lineWidth = 1.5; ctx.setLineDash([8, 4, 2, 4]); }
            else if (styleType === 'dike') { ctx.lineWidth = 5; }
            else if (styleType === 'fault_normal' || styleType === 'fault_reverse' || styleType === 'fault_strike') {
                ctx.lineWidth = 3;
            }

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
            ctx.setLineDash([]);

            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const dist = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx);
            const nx = -Math.sin(angle), ny = Math.cos(angle);

            if (styleType === 'intrusive') {
                const step = 12;
                for (let d = step / 2; d < dist - 4; d += step) {
                    const bx = p1.x + Math.cos(angle) * d;
                    const by = p1.y + Math.sin(angle) * d;
                    ctx.beginPath();
                    ctx.moveTo(bx, by);
                    ctx.lineTo(bx + nx * 6, by + ny * 6);
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            } else if (styleType === 'fault_normal') {
                const step = 28;
                for (let d = step / 2; d < dist - 6; d += step) {
                    const bx = p1.x + Math.cos(angle) * d;
                    const by = p1.y + Math.sin(angle) * d;
                    ctx.beginPath();
                    ctx.moveTo(bx, by);
                    ctx.lineTo(bx + nx * 8, by + ny * 8);
                    ctx.arc(bx + nx * 8, by + ny * 8, 1.5, 0, Math.PI * 2);
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            } else if (styleType === 'fault_reverse') {
                const step = 26;
                for (let d = step / 2; d < dist - 8; d += step) {
                    const bx = p1.x + Math.cos(angle) * d;
                    const by = p1.y + Math.sin(angle) * d;
                    ctx.beginPath();
                    ctx.moveTo(bx - Math.cos(angle) * 6, by - Math.sin(angle) * 6);
                    ctx.lineTo(bx + nx * 8, by + ny * 8);
                    ctx.lineTo(bx + Math.cos(angle) * 6, by + Math.sin(angle) * 6);
                    ctx.closePath();
                    ctx.fill();
                }
            } else if (styleType === 'fault_strike') {
                const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
                const drawHalfArrow = (dir, side) => {
                    const ox = midX + nx * (side * 5);
                    const oy = midY + ny * (side * 5);
                    const ex = ox + Math.cos(angle) * (dir * 12);
                    const ey = oy + Math.sin(angle) * (dir * 12);
                    ctx.beginPath();
                    ctx.moveTo(ox - Math.cos(angle) * (dir * 10), oy - Math.sin(angle) * (dir * 10));
                    ctx.lineTo(ex, ey);
                    ctx.lineTo(ex - Math.cos(angle) * (dir * 5) + nx * (side * 4), ey - Math.sin(angle) * (dir * 5) + ny * (side * 4));
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                };
                if (dist > 25) {
                    drawHalfArrow(1, 1);
                    drawHalfArrow(-1, -1);
                }
            } else if (styleType === 'anticline' || styleType === 'syncline') {
                const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
                if (dist > 25) {
                    [-1, 1].forEach(side => {
                        const tx = midX + nx * (side * 12);
                        const ty = midY + ny * (side * 12);
                        ctx.beginPath();
                        ctx.moveTo(midX, midY);
                        ctx.lineTo(tx, ty);
                        ctx.lineWidth = 1.8;
                        ctx.stroke();
                        ctx.beginPath();
                        if (styleType === 'anticline') {
                            ctx.moveTo(tx, ty);
                            ctx.lineTo(tx - nx * (side * 5) - Math.cos(angle) * 4, ty - ny * (side * 5) - Math.sin(angle) * 4);
                            ctx.lineTo(tx - nx * (side * 5) + Math.cos(angle) * 4, ty - ny * (side * 5) + Math.sin(angle) * 4);
                        } else {
                            ctx.moveTo(midX + nx * (side * 3), midY + ny * (side * 3));
                            ctx.lineTo(midX + nx * (side * 8) - Math.cos(angle) * 4, midY + ny * (side * 8) - Math.sin(angle) * 4);
                            ctx.lineTo(midX + nx * (side * 8) + Math.cos(angle) * 4, midY + ny * (side * 8) + Math.sin(angle) * 4);
                        }
                        ctx.closePath();
                        ctx.fill();
                    });
                }
            }
            ctx.restore();
        };

        const drawGeoSymbol = (ctx, sym) => {
            ctx.save();
            ctx.translate(sym.x, sym.y);
            if (sym.rotation) {
                ctx.rotate((sym.rotation * Math.PI) / 180);
            }
            const s = (sym.size || 24) / 24;
            ctx.scale(s, s);
            ctx.strokeStyle = sym.color || '#000';
            ctx.fillStyle = sym.color || '#000';
            ctx.lineWidth = 2;

            switch (sym.symbolType) {
                case 'dip_right':
                    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(0, 0); ctx.lineTo(10, 0); ctx.stroke();
                    break;
                case 'dip_left':
                    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(0, 0); ctx.lineTo(-10, 0); ctx.stroke();
                    break;
                case 'horizontal_strata':
                    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.moveTo(-9, 0); ctx.lineTo(9, 0); ctx.moveTo(0, -9); ctx.lineTo(0, 9); ctx.stroke();
                    break;
                case 'vertical_strata':
                    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.moveTo(-4, -7); ctx.lineTo(4, 7); ctx.moveTo(4, -7); ctx.lineTo(-4, 7); ctx.stroke();
                    break;
                case 'anticline_sym':
                    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-7, -4); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(7, -4); ctx.lineTo(7, 4); ctx.closePath(); ctx.fill();
                    break;
                case 'syncline_sym':
                    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 12); ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(8, -4); ctx.lineTo(8, 4); ctx.closePath(); ctx.fill();
                    break;
                case 'horizontal_laminations':
                    ctx.beginPath();
                    ctx.moveTo(-12, -7); ctx.lineTo(12, -7);
                    ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
                    ctx.moveTo(-12, 7); ctx.lineTo(12, 7);
                    ctx.stroke();
                    break;
                case 'massive_bedding':
                    ctx.strokeRect(-12, -8, 24, 16);
                    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('Sm', 0, 0);
                    break;
                case 'cross_planar':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-8, -10); ctx.lineTo(4, 10);
                    ctx.moveTo(0, -10); ctx.lineTo(10, 5);
                    ctx.stroke();
                    break;
                case 'cross_trough':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-10, -10); ctx.quadraticCurveTo(-3, 6, 4, 10);
                    ctx.moveTo(-2, -10); ctx.quadraticCurveTo(5, 6, 11, 10);
                    ctx.stroke();
                    break;
                case 'cross_parallel':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-10, -10); ctx.lineTo(0, 10);
                    ctx.moveTo(-3, -10); ctx.lineTo(7, 10);
                    ctx.moveTo(4, -10); ctx.lineTo(12, 2);
                    ctx.stroke();
                    break;
                case 'cross_low_angle':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.moveTo(-12, -6); ctx.quadraticCurveTo(0, -2, 12, -8);
                    ctx.moveTo(-12, 2); ctx.quadraticCurveTo(0, 6, 12, 0);
                    ctx.stroke();
                    break;
                case 'ripples_current':
                    ctx.beginPath();
                    ctx.moveTo(-12, 4); ctx.lineTo(-4, -4); ctx.lineTo(2, 4); ctx.lineTo(10, -4); ctx.stroke();
                    break;
                case 'ripples_wave':
                    ctx.beginPath();
                    ctx.moveTo(-12, 2); ctx.quadraticCurveTo(-6, -6, 0, 2); ctx.quadraticCurveTo(6, -6, 12, 2);
                    ctx.stroke();
                    break;
                case 'graded_bedding':
                    ctx.beginPath();
                    ctx.moveTo(-12, -10); ctx.lineTo(12, -10);
                    ctx.moveTo(-12, 10); ctx.lineTo(12, 10);
                    ctx.stroke();
                    for(let px = -8; px <= 8; px += 4) {
                        ctx.beginPath(); ctx.arc(px, 6, 1.8, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(px, -2, 1.0, 0, Math.PI*2); ctx.fill();
                    }
                    break;
                case 'bioturbation':
                    ctx.beginPath();
                    ctx.moveTo(-10, -8); ctx.bezierCurveTo(-4, 8, 4, -8, 10, 8);
                    ctx.moveTo(-6, 2); ctx.bezierCurveTo(-2, -6, 2, 6, 6, -2);
                    ctx.lineWidth = 1.5; ctx.stroke();
                    break;
                case 'nodules':
                    ctx.beginPath(); ctx.ellipse(-5, -2, 5, 3, 0, 0, Math.PI * 2); ctx.stroke();
                    ctx.beginPath(); ctx.ellipse(6, 3, 4, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
                    break;
                case 'fossil_ammonite':
                    ctx.beginPath();
                    for (let a = 0; a < Math.PI * 3.5; a += 0.2) {
                        const r = a * 1.1;
                        const x = Math.cos(a) * r, y = Math.sin(a) * r;
                        if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    break;
                case 'fossil_shell':
                    ctx.beginPath(); ctx.arc(0, 4, 9, Math.PI, 0); ctx.closePath(); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(-5, -3); ctx.moveTo(0, 4); ctx.lineTo(0, -5); ctx.moveTo(0, 4); ctx.lineTo(5, -3); ctx.stroke();
                    break;
                case 'fossil_plant':
                    ctx.beginPath(); ctx.moveTo(0, 10); ctx.quadraticCurveTo(2, 0, 0, -10);
                    ctx.moveTo(0, 4); ctx.lineTo(-6, 0); ctx.moveTo(0, 0); ctx.lineTo(6, -4); ctx.moveTo(0, -4); ctx.lineTo(-5, -8);
                    ctx.stroke();
                    break;
                default:
                    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        };

        const createPatternDataURL = (getPatternFn, patternKey, bgColor) => {
            const c = document.createElement('canvas');
            c.width = 48; c.height = 28;
            const ctx = c.getContext('2d');
            ctx.fillStyle = bgColor || '#ffffff';
            ctx.fillRect(0, 0, 48, 28);
            const pat = getPatternFn(ctx, patternKey, 'transparent');
            if (pat) {
                ctx.fillStyle = pat;
                ctx.fillRect(0, 0, 48, 28);
            }
            return c.toDataURL();
        };

        const createLinePreviewDataURL = (styleType, color = '#000') => {
            const c = document.createElement('canvas');
            c.width = 56; c.height = 24;
            const ctx = c.getContext('2d');
            drawDecoratedSegment(ctx, { x: 4, y: 12 }, { x: 52, y: 12 }, styleType, color, false);
            return c.toDataURL();
        };

        const createSymbolPreviewDataURL = (symbolType, color = '#000') => {
            const c = document.createElement('canvas');
            c.width = 36; c.height = 28;
            const ctx = c.getContext('2d');
            drawGeoSymbol(ctx, { x: 18, y: 14, size: 20, symbolType, color });
            return c.toDataURL();
        };

        function App() {
            const [bgColor, setBgColor] = useState('#fdf8c2');
            const [mode, setMode] = useState('select');
            const [polygons, setPolygons] = useState([]);
            const [floatingTexts, setFloatingTexts] = useState([]);
            const [geoSymbols, setGeoSymbols] = useState([]);
            const [currentPoints, setCurrentPoints] = useState([]);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [snapPoint, setSnapPoint] = useState(null);
            const [isClosingSnap, setIsClosingSnap] = useState(false);
            const [autoSave, setAutoSave] = useState(true);
            const [history, setHistory] = useState([]);
            const [showResetModal, setShowResetModal] = useState(false);
            const [toastMsg, setToastMsg] = useState(null);

            const [activeLineType, setActiveLineType] = useState('fault_normal');
            const [activeSymbolType, setActiveSymbolType] = useState('horizontal_laminations');
            const [activeCatalogTab, setActiveCatalogTab] = useState('fallas');

            const [dimensions, setDimensions] = useState({ width: 900, height: 600 });
            const [extraTopSpace, setExtraTopSpace] = useState(0);
            const [zoom, setZoom] = useState(1);
            const [showGrid, setShowGrid] = useState(false);
            const [snapToGrid, setSnapToGrid] = useState(false);
            const [orientationLeft, setOrientationLeft] = useState('');
            const [orientationRight, setOrientationRight] = useState('');
            const [showSheetSettings, setShowSheetSettings] = useState(false);

            const [selectedId, setSelectedId] = useState(null);
            const [selectedTextId, setSelectedTextId] = useState(null);
            const [selectedSymbolId, setSelectedSymbolId] = useState(null);
            const [draggingVertex, setDraggingVertex] = useState(null);
            const [draggingPoly, setDraggingPoly] = useState(null);
            const [draggingTextId, setDraggingTextId] = useState(null);
            const [draggingSymbolId, setDraggingSymbolId] = useState(null);
            const [isDrawingFreehand, setIsDrawingFreehand] = useState(false);

            const canvasRef = useRef(null);
            const containerRef = useRef(null);
            const fileInputRef = useRef(null);

            const colAgeWidth = 140;
            const colDescWidth = 200;
            const titleHeight = 60;
            const gridSize = 25;
            const TOP_MARGIN = 35;

            const isInteracting = Boolean(draggingPoly || draggingVertex || draggingTextId || draggingSymbolId || isDrawingFreehand);

            const showToast = (text, type = 'info') => {
                setToastMsg({ text, type });
                setTimeout(() => setToastMsg(null), 3200);
            };

            const saveHistory = () => {
                setHistory(prev => [...prev.slice(-39), {
                    polygons: JSON.parse(JSON.stringify(polygons)),
                    floatingTexts: JSON.parse(JSON.stringify(floatingTexts)),
                    geoSymbols: JSON.parse(JSON.stringify(geoSymbols)),
                    extraTopSpace
                }]);
            };

            const handleUndo = () => {
                if (currentPoints.length > 0) {
                    setCurrentPoints(currentPoints.slice(0, -1));
                } else if (history.length > 0) {
                    const lastState = history[history.length - 1];
                    setPolygons(lastState.polygons);
                    setFloatingTexts(lastState.floatingTexts);
                    setGeoSymbols(lastState.geoSymbols || []);
                    if (typeof lastState.extraTopSpace === 'number') {
                        setExtraTopSpace(lastState.extraTopSpace);
                    }
                    setHistory(history.slice(0, -1));
                    setSelectedId(null);
                    setSelectedTextId(null);
                    setSelectedSymbolId(null);
                }
            };

            // Cargar desde localStorage (compatible con versiones anteriores)
            useEffect(() => {
                try {
                    const savedAutoSave = localStorage.getItem('geo_v15_autosave');
                    if (savedAutoSave !== null) setAutoSave(savedAutoSave === 'true');
                    const savedPolys = localStorage.getItem('geo_v15_polys');
                    const savedTexts = localStorage.getItem('geo_v15_texts');
                    const savedSyms = localStorage.getItem('geo_v15_syms');
                    const savedBg = localStorage.getItem('geo_v15_bg');
                    const savedWidth = localStorage.getItem('geo_v15_width');
                    const savedExtraTop = localStorage.getItem('geo_v15_extra_top');
                    const savedOriL = localStorage.getItem('geo_v15_ori_l');
                    const savedOriR = localStorage.getItem('geo_v15_ori_r');

                    if (savedPolys) { setPolygons(JSON.parse(savedPolys)); }
                    if (savedTexts) { setFloatingTexts(JSON.parse(savedTexts)); }
                    if (savedSyms) { setGeoSymbols(JSON.parse(savedSyms)); }
                    if (savedBg) setBgColor(savedBg);
                    if (savedWidth) {
                        const w = parseInt(savedWidth, 10);
                        if (!isNaN(w) && w >= 750 && w <= 3000) {
                            setDimensions(prev => ({ ...prev, width: w }));
                        }
                    }
                    if (savedExtraTop) {
                        const et = parseFloat(savedExtraTop);
                        if (!isNaN(et) && et >= 0) setExtraTopSpace(et);
                    }
                    if (savedOriL !== null) setOrientationLeft(savedOriL);
                    if (savedOriR !== null) setOrientationRight(savedOriR);
                } catch (e) {}
            }, []);

            // Auto-guardado y ajuste vertical bidireccional inteligente (expande y contrae al volver a bajar)
            useEffect(() => {
                try {
                    localStorage.setItem('geo_v15_autosave', autoSave);
                    if (autoSave) {
                        localStorage.setItem('geo_v15_polys', JSON.stringify(polygons));
                        localStorage.setItem('geo_v15_texts', JSON.stringify(floatingTexts));
                        localStorage.setItem('geo_v15_syms', JSON.stringify(geoSymbols));
                        localStorage.setItem('geo_v15_bg', bgColor);
                        localStorage.setItem('geo_v15_width', String(dimensions.width));
                        localStorage.setItem('geo_v15_extra_top', String(extraTopSpace));
                        localStorage.setItem('geo_v15_ori_l', orientationLeft);
                        localStorage.setItem('geo_v15_ori_r', orientationRight);
                    }
                } catch (e) {}

                // Esperamos a que el usuario suelte el mouse para evitar saltos durante el arrastre
                if (isInteracting) return;

                if (polygons.length === 0 && floatingTexts.length === 0 && geoSymbols.length === 0) {
                    if (extraTopSpace !== 0) setExtraTopSpace(0);
                    if (dimensions.height !== 600) {
                        setDimensions(prev => ({ ...prev, height: 600 }));
                    }
                    return;
                }

                let maxY = 400;
                let minY = Infinity;
                polygons.forEach(p => p.points.forEach(pt => {
                    if (pt.y > maxY) maxY = pt.y;
                    if (pt.y < minY) minY = pt.y;
                }));
                floatingTexts.forEach(t => {
                    if (t.y > maxY) maxY = t.y;
                    if (t.y < minY) minY = t.y;
                });
                geoSymbols.forEach(s => {
                    if (s.y > maxY) maxY = s.y;
                    if (s.y < minY) minY = s.y;
                });

                const safeTop = titleHeight + TOP_MARGIN;

                // 1) Si un elemento sube demasiado cerca del encabezado, expandimos hacia arriba empujando todo hacia abajo
                if (minY < titleHeight + 20) {
                    const shiftDown = Math.ceil(safeTop - minY);
                    if (shiftDown > 0) {
                        setPolygons(prev => prev.map(p => ({
                            ...p,
                            points: p.points.map(pt => ({ ...pt, y: pt.y + shiftDown }))
                        })));
                        setFloatingTexts(prev => prev.map(t => ({ ...t, y: t.y + shiftDown })));
                        setGeoSymbols(prev => prev.map(s => ({ ...s, y: s.y + shiftDown })));
                        setExtraTopSpace(prev => prev + shiftDown);
                        setDimensions(prev => ({ ...prev, height: Math.max(600, Math.ceil(maxY + shiftDown + 60)) }));
                        return;
                    }
                }

                // 2) Si previamente se estiró hacia arriba y ahora se bajó el objeto, devolvemos el espacio y los títulos vuelven a su posición
                if (extraTopSpace > 0 && minY > safeTop + 2) {
                    const availableSlack = Math.floor(minY - safeTop);
                    const reclaim = Math.min(extraTopSpace, availableSlack);
                    if (reclaim > 1) {
                        setPolygons(prev => prev.map(p => ({
                            ...p,
                            points: p.points.map(pt => ({ ...pt, y: pt.y - reclaim }))
                        })));
                        setFloatingTexts(prev => prev.map(t => ({ ...t, y: t.y - reclaim })));
                        setGeoSymbols(prev => prev.map(s => ({ ...s, y: s.y - reclaim })));
                        setExtraTopSpace(prev => Math.max(0, prev - reclaim));
                        setDimensions(prev => ({ ...prev, height: Math.max(600, Math.ceil(maxY - reclaim + 60)) }));
                        return;
                    }
                }

                // 3) Ajuste limpio de altura inferior
                const calculatedHeight = Math.max(600, Math.ceil(maxY + 60));
                if (dimensions.height !== calculatedHeight) {
                    setDimensions(prev => ({ ...prev, height: calculatedHeight }));
                }
            }, [polygons, floatingTexts, geoSymbols, bgColor, autoSave, isInteracting, dimensions.width, extraTopSpace, orientationLeft, orientationRight]);

            // Cambiar ancho de hoja manteniendo textos de la columna derecha ("Observaciones") anclados
            const changeSheetWidth = (newWidth) => {
                const clamped = Math.max(750, Math.min(3000, Math.round(newWidth)));
                if (clamped === dimensions.width) return;
                const oldWidth = dimensions.width;
                const deltaW = clamped - oldWidth;
                const oldRightColStart = oldWidth - colDescWidth;

                setFloatingTexts(prev => prev.map(t => {
                    if (t.x >= oldRightColStart) {
                        return { ...t, x: t.x + deltaW };
                    }
                    return t;
                }));
                setDimensions(prev => ({ ...prev, width: clamped }));
            };

            // Botón manual para compactar todo el espacio vacío superior e inferior
            const handleCompactSheet = () => {
                if (polygons.length === 0 && floatingTexts.length === 0 && geoSymbols.length === 0) {
                    setExtraTopSpace(0);
                    setDimensions(prev => ({ ...prev, height: 600 }));
                    return;
                }
                let minY = Infinity;
                let maxY = 0;
                polygons.forEach(p => p.points.forEach(pt => {
                    if (pt.y < minY) minY = pt.y;
                    if (pt.y > maxY) maxY = pt.y;
                }));
                floatingTexts.forEach(t => {
                    if (t.y < minY) minY = t.y;
                    if (t.y > maxY) maxY = t.y;
                });
                geoSymbols.forEach(s => {
                    if (s.y < minY) minY = s.y;
                    if (s.y > maxY) maxY = s.y;
                });

                const safeTop = titleHeight + TOP_MARGIN;
                const shiftUp = Math.floor(minY - safeTop);
                if (shiftUp !== 0) {
                    saveHistory();
                    setPolygons(prev => prev.map(p => ({
                        ...p,
                        points: p.points.map(pt => ({ ...pt, y: pt.y - shiftUp }))
                    })));
                    setFloatingTexts(prev => prev.map(t => ({ ...t, y: t.y - shiftUp })));
                    setGeoSymbols(prev => prev.map(s => ({ ...s, y: s.y - shiftUp })));
                    setExtraTopSpace(0);
                    setDimensions(prev => ({ ...prev, height: Math.max(600, Math.ceil((maxY - shiftUp) + 60)) }));
                    showToast('Hoja encuadrada al contenido', 'success');
                }
            };

            const handleFitZoom = () => {
                if (!containerRef.current) return;
                const availW = containerRef.current.clientWidth - 64;
                const fitted = Math.max(0.45, Math.min(1, Math.floor((availW / dimensions.width) * 100) / 100));
                setZoom(fitted);
            };

            // Guardar / Cargar proyecto JSON
            const handleSaveProject = () => {
                const payload = {
                    version: '5.0',
                    bgColor,
                    dimensions,
                    extraTopSpace,
                    orientationLeft,
                    orientationRight,
                    polygons,
                    floatingTexts,
                    geoSymbols
                };
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `proyecto-afloramiento-${new Date().toISOString().slice(0, 10)}.json`;
                link.href = url;
                link.click();
                URL.revokeObjectURL(url);
                showToast('Proyecto guardado (.json)', 'success');
            };

            const handleLoadProject = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        saveHistory();
                        if (Array.isArray(data.polygons)) setPolygons(data.polygons);
                        if (Array.isArray(data.floatingTexts)) setFloatingTexts(data.floatingTexts);
                        if (Array.isArray(data.geoSymbols)) setGeoSymbols(data.geoSymbols);
                        if (data.bgColor) setBgColor(data.bgColor);
                        if (data.dimensions?.width) {
                            setDimensions({
                                width: Math.max(750, Math.min(3000, data.dimensions.width)),
                                height: Math.max(600, data.dimensions.height || 600)
                            });
                        }
                        setExtraTopSpace(typeof data.extraTopSpace === 'number' ? data.extraTopSpace : 0);
                        setOrientationLeft(data.orientationLeft || '');
                        setOrientationRight(data.orientationRight || '');
                        setSelectedId(null);
                        setSelectedTextId(null);
                        setSelectedSymbolId(null);
                        showToast('Proyecto cargado correctamente', 'success');
                    } catch (err) {
                        showToast('No se pudo leer el archivo .json seleccionado', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // Orden de capas y duplicación
            const movePolyLayer = (id, direction) => {
                const idx = polygons.findIndex(p => p.id === id);
                if (idx === -1) return;
                const targetIdx = direction === 'up' ? idx + 1 : idx - 1;
                if (targetIdx < 0 || targetIdx >= polygons.length) return;
                saveHistory();
                const copy = [...polygons];
                const [item] = copy.splice(idx, 1);
                copy.splice(targetIdx, 0, item);
                setPolygons(copy);
            };

            const duplicatePoly = (id) => {
                const poly = polygons.find(p => p.id === id);
                if (!poly) return;
                saveHistory();
                const clone = {
                    ...JSON.parse(JSON.stringify(poly)),
                    id: Date.now().toString(),
                    points: poly.points.map(pt => ({
                        x: Math.min(dimensions.width - colDescWidth - 10, pt.x + 25),
                        y: pt.y + 25
                    }))
                };
                setPolygons(prev => [...prev, clone]);
                setSelectedId(clone.id);
            };

            const getPattern = (ctx, type, colorHex) => {
                if (type === 'none' || !type) return colorHex;
                const pCanvas = document.createElement('canvas');
                pCanvas.width = 40; pCanvas.height = 40;
                const pCtx = pCanvas.getContext('2d');
                pCtx.fillStyle = colorHex;
                pCtx.fillRect(0, 0, 40, 40);
                pCtx.strokeStyle = 'rgba(0,0,0,0.55)';
                pCtx.lineWidth = 1;

                if (type === 'diagonal') {
                    for (let i = -40; i < 80; i += 10) {
                        pCtx.beginPath(); pCtx.moveTo(i, 0); pCtx.lineTo(i + 40, 40); pCtx.stroke();
                    }
                } else if (type === 'sandstone') {
                    pCtx.fillStyle = 'rgba(0,0,0,0.65)';
                    for (let x = 4; x < 40; x += 8) {
                        for (let y = 4; y < 40; y += 8) {
                            pCtx.beginPath(); pCtx.arc(x + (y % 16 === 0 ? 4 : 0), y, 0.8, 0, Math.PI * 2); pCtx.fill();
                        }
                    }
                } else if (type === 'limestone' || type === 'limestone_fossil') {
                    for (let y = 0; y < 40; y += 10) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                        for (let x = 0; x < 40; x += 20) {
                            pCtx.beginPath(); pCtx.moveTo(x + (y % 20 === 0 ? 0 : 10), y); pCtx.lineTo(x + (y % 20 === 0 ? 0 : 10), y + 10); pCtx.stroke();
                        }
                    }
                    if (type === 'limestone_fossil') {
                        pCtx.strokeStyle = 'rgba(0,0,0,0.5)';
                        const fossils = [{ x: 5, y: 5 }, { x: 25, y: 5 }, { x: 15, y: 15 }, { x: 35, y: 15 }, { x: 5, y: 25 }, { x: 25, y: 25 }, { x: 15, y: 35 }];
                        fossils.forEach(f => {
                            pCtx.beginPath(); pCtx.arc(f.x, f.y, 2, 0.2, Math.PI - 0.2); pCtx.stroke();
                        });
                    }
                } else if (type === 'arcillita') {
                    for (let y = 2; y < 40; y += 4) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                } else if (type === 'limolita') {
                    pCtx.setLineDash([4, 4]);
                    for (let y = 4; y < 40; y += 8) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                    pCtx.setLineDash([]);
                    for (let x = 6; x < 40; x += 10) {
                        for (let y = 8; y < 40; y += 10) {
                            pCtx.beginPath(); pCtx.arc(x, y, 0.6, 0, Math.PI * 2); pCtx.fill();
                        }
                    }
                } else if (type === 'margas') {
                    for (let i = -40; i < 80; i += 12) {
                        pCtx.beginPath(); pCtx.moveTo(i, 0); pCtx.lineTo(i + 10, 10); pCtx.stroke();
                    }
                    for (let y = 0; y < 40; y += 10) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                } else if (type === 'fangolita') {
                    for (let y = 2; y < 40; y += 5) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                    pCtx.fillStyle = 'rgba(0,0,0,0.45)';
                    const mudDots = [{ x: 10, y: 10 }, { x: 30, y: 15 }, { x: 15, y: 30 }, { x: 35, y: 35 }, { x: 5, y: 20 }, { x: 25, y: 5 }];
                    mudDots.forEach(d => {
                        pCtx.beginPath(); pCtx.arc(d.x, d.y, 0.7, 0, Math.PI * 2); pCtx.fill();
                    });
                } else if (type === 'arenisca_carbonatica') {
                    pCtx.fillStyle = 'rgba(0,0,0,0.6)';
                    for (let x = 4; x < 40; x += 10) {
                        for (let y = 4; y < 40; y += 10) {
                            pCtx.beginPath(); pCtx.arc(x, y, 0.8, 0, Math.PI * 2); pCtx.fill();
                        }
                    }
                    for (let y = 0; y < 40; y += 20) {
                        for (let x = 0; x < 40; x += 20) {
                            pCtx.strokeRect(x + 5, y + 5, 8, 4);
                        }
                    }
                } else if (type === 'metamorphic') {
                    for (let y = 5; y < 40; y += 10) {
                        pCtx.beginPath();
                        for (let x = 0; x <= 40; x += 5) {
                            pCtx.lineTo(x, y + Math.sin(x * 0.5) * 3);
                        }
                        pCtx.stroke();
                    }
                } else if (type === 'volcanic') {
                    for (let x = 10; x <= 40; x += 20) {
                        for (let y = 10; y <= 40; y += 20) {
                            pCtx.beginPath(); pCtx.moveTo(x - 4, y - 4); pCtx.lineTo(x, y + 2); pCtx.lineTo(x + 4, y - 4); pCtx.stroke();
                        }
                    }
                } else if (type === 'igneous') {
                    for (let x = 10; x <= 40; x += 20) {
                        for (let y = 10; y <= 40; y += 20) {
                            pCtx.beginPath(); pCtx.moveTo(x - 5, y); pCtx.lineTo(x + 5, y); pCtx.moveTo(x, y - 5); pCtx.lineTo(x, y + 5); pCtx.stroke();
                        }
                    }
                } else if (type === 'shale') {
                    pCtx.setLineDash([8, 6]);
                    for (let y = 8; y < 40; y += 12) {
                        pCtx.beginPath(); pCtx.moveTo(0, y); pCtx.lineTo(40, y); pCtx.stroke();
                    }
                } else if (type === 'conglomerate') {
                    const clasts = [
                        { x: 10, y: 10, r: 4 }, { x: 30, y: 8, r: 6 },
                        { x: 15, y: 28, r: 5 }, { x: 35, y: 25, r: 4 },
                        { x: 5, y: 35, r: 3 }, { x: 25, y: 35, r: 5 }
                    ];
                    clasts.forEach(c => {
                        pCtx.beginPath(); pCtx.arc(c.x, c.y, c.r, 0, Math.PI * 2); pCtx.stroke();
                    });
                }
                return ctx.createPattern(pCanvas, 'repeat');
            };

            const getSharedStyle = (p1, p2, poly, allPolys, drawAreaRight, colAgeW) => {
                const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
                if (Math.abs(p1.x - colAgeW) < 10 && Math.abs(p2.x - colAgeW) < 10) return { type: 'none' };
                if (Math.abs(p1.x - drawAreaRight) < 10 && Math.abs(p2.x - drawAreaRight) < 10) return { type: 'none' };

                let cy = 0; poly.points.forEach(p => cy += p.y); cy /= poly.points.length;
                const isBase = mid.y > cy; const isTop = mid.y <= cy;

                for (let other of allPolys) {
                    if (other.id === poly.id || other.type === 'line') continue;
                    if (isPointOnPolyBoundary(mid, other.points)) {
                        let oCy = 0; other.points.forEach(p => oCy += p.y); oCy /= other.points.length;
                        const oIsBase = mid.y > oCy; const oIsTop = mid.y <= oCy;
                        if (other.contactPosition === 'both' || (other.contactPosition === 'base' && oIsBase) || (other.contactPosition === 'top' && oIsTop)) {
                            return { type: other.contactType };
                        }
                    }
                }
                if (poly.contactPosition === 'both' || (poly.contactPosition === 'base' && isBase) || (poly.contactPosition === 'top' && isTop)) {
                    return { type: poly.contactType };
                }
                return { type: 'concordant' };
            };

            const drawCanvas = (ctx, canvasWidth, canvasHeight, forExport = false) => {
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                const drawAreaRight = canvasWidth - colDescWidth;

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, colAgeWidth, canvasHeight);
                ctx.fillRect(drawAreaRight, 0, colDescWidth, canvasHeight);
                ctx.fillRect(colAgeWidth, 0, drawAreaRight - colAgeWidth, titleHeight);

                // Cuadrícula guía opcional (solo en pantalla, nunca en exportación)
                if (!forExport && showGrid) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    for (let gx = colAgeWidth; gx <= drawAreaRight; gx += gridSize) {
                        ctx.moveTo(gx, titleHeight);
                        ctx.lineTo(gx, canvasHeight);
                    }
                    for (let gy = titleHeight; gy <= canvasHeight; gy += gridSize) {
                        ctx.moveTo(colAgeWidth, gy);
                        ctx.lineTo(drawAreaRight, gy);
                    }
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                ctx.beginPath();
                ctx.rect(colAgeWidth, titleHeight, canvasWidth - colAgeWidth - colDescWidth, canvasHeight - titleHeight);
                ctx.clip();

                polygons.forEach(poly => {
                    if (poly.points.length < 2) return;

                    if (poly.type === 'line') {
                        for (let i = 0; i < poly.points.length - 1; i++) {
                            drawDecoratedSegment(
                                ctx,
                                poly.points[i],
                                poly.points[i + 1],
                                poly.lineType || 'normal',
                                poly.color || '#000',
                                selectedId === poly.id && !forExport
                            );
                        }
                        return;
                    }

                    const drawPath = () => {
                        ctx.beginPath();
                        ctx.moveTo(poly.points[0].x, poly.points[0].y);
                        for (let i = 0; i < poly.points.length; i++) {
                            const style = getSharedStyle(poly.points[i], poly.points[(i + 1) % poly.points.length], poly, polygons, drawAreaRight, colAgeWidth);
                            if (style.type === 'erosive') {
                                traceErosiveSegment(ctx, poly.points[i], poly.points[(i + 1) % poly.points.length]);
                            } else {
                                ctx.lineTo(poly.points[(i + 1) % poly.points.length].x, poly.points[(i + 1) % poly.points.length].y);
                            }
                        }
                    };

                    drawPath();
                    ctx.fillStyle = poly.color;
                    ctx.fill();

                    const activePatterns = [poly.pattern1, poly.pattern2, poly.pattern3].filter(p => p && p !== 'none');
                    if (activePatterns.length > 0) {
                        let minY = Math.min(...poly.points.map(p => p.y)), maxY = Math.max(...poly.points.map(p => p.y));
                        let polyH = maxY - minY, sectionH = polyH / activePatterns.length;
                        activePatterns.forEach((pat, index) => {
                            ctx.save();
                            drawPath();
                            ctx.clip();
                            let sectionTop = minY + (index * sectionH);
                            ctx.beginPath();
                            ctx.rect(0, sectionTop, canvasWidth, sectionH);
                            ctx.clip();
                            ctx.fillStyle = getPattern(ctx, pat, 'transparent');
                            ctx.fill();
                            ctx.restore();
                        });
                    }

                    for (let i = 0; i < poly.points.length; i++) {
                        const style = getSharedStyle(poly.points[i], poly.points[(i + 1) % poly.points.length], poly, polygons, drawAreaRight, colAgeWidth);
                        if (style.type === 'none') continue;
                        drawDecoratedSegment(
                            ctx,
                            poly.points[i],
                            poly.points[(i + 1) % poly.points.length],
                            style.type,
                            '#000',
                            selectedId === poly.id && !forExport
                        );
                    }
                });

                geoSymbols.forEach(sym => {
                    drawGeoSymbol(ctx, {
                        ...sym,
                        color: (selectedSymbolId === sym.id && !forExport) ? '#3b82f6' : sym.color
                    });
                    if (selectedSymbolId === sym.id && !forExport) {
                        ctx.save();
                        ctx.strokeStyle = '#3b82f6';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(sym.x - 14, sym.y - 14, 28, 28);
                        ctx.restore();
                    }
                });

                if (!forExport && currentPoints.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(currentPoints[0].x, currentPoints[0].y);
                    for (let i = 1; i < currentPoints.length; i++) ctx.lineTo(currentPoints[i].x, currentPoints[i].y);
                    if (!isDrawingFreehand && mode !== 'draw_freehand') {
                        ctx.lineTo(snapPoint?.x || mousePos.x, snapPoint?.y || mousePos.y);
                    }
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 2;
                    ctx.setLineDash(isDrawingFreehand ? [] : [5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    if (!isDrawingFreehand) {
                        currentPoints.forEach((p, idx) => {
                            const isFirst = idx === 0;
                            const isLast = idx === currentPoints.length - 1;
                            ctx.fillStyle = (isFirst && isClosingSnap) || (mode === 'draw_line' && isLast && isClosingSnap) ? '#10b981' : '#ef4444';
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, (isFirst && isClosingSnap) ? 6 : 4, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    }
                }

                if (!forExport && mode === 'edit_vectors' && selectedId) {
                    const selP = polygons.find(p => p.id === selectedId);
                    if (selP) {
                        selP.points.forEach(pt => {
                            ctx.fillStyle = '#f59e0b';
                            ctx.strokeStyle = '#ffffff';
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.stroke();
                        });
                    }
                }

                ctx.restore();

                floatingTexts.forEach(t => {
                    ctx.save();
                    ctx.font = `bold ${t.size}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = (selectedTextId === t.id && !forExport) ? '#3b82f6' : t.color;
                    ctx.fillText(t.text, t.x, t.y);
                    if (selectedTextId === t.id && !forExport) {
                        const m = ctx.measureText(t.text);
                        ctx.strokeStyle = '#3b82f6';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(t.x - m.width / 2 - 4, t.y - t.size / 2 - 2, m.width + 8, t.size + 4);
                    }
                    ctx.restore();
                });

                // Encabezados de columnas
                ctx.fillStyle = '#1f2937';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Edad', colAgeWidth / 2, titleHeight / 2 + 6);
                ctx.fillText('Formación', colAgeWidth + (drawAreaRight - colAgeWidth) / 2, titleHeight / 2 + 6);
                ctx.fillText('Observaciones', drawAreaRight + colDescWidth / 2, titleHeight / 2 + 6);

                // Orientación cardinal del afloramiento (opcional)
                if (orientationLeft.trim()) {
                    ctx.font = 'bold 13px sans-serif';
                    ctx.fillStyle = '#374151';
                    ctx.textAlign = 'left';
                    ctx.fillText(orientationLeft.trim(), colAgeWidth + 12, titleHeight / 2 + 5);
                }
                if (orientationRight.trim()) {
                    ctx.font = 'bold 13px sans-serif';
                    ctx.fillStyle = '#374151';
                    ctx.textAlign = 'right';
                    ctx.fillText(orientationRight.trim(), drawAreaRight - 12, titleHeight / 2 + 5);
                }

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(colAgeWidth, 0); ctx.lineTo(colAgeWidth, canvasHeight);
                ctx.moveTo(drawAreaRight, 0); ctx.lineTo(drawAreaRight, canvasHeight);
                ctx.moveTo(0, titleHeight); ctx.lineTo(canvasWidth, titleHeight);
                ctx.stroke();
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (canvas) drawCanvas(canvas.getContext('2d'), dimensions.width, dimensions.height, false);
            }, [polygons, floatingTexts, geoSymbols, currentPoints, mousePos, snapPoint, mode, selectedId, selectedTextId, selectedSymbolId, draggingVertex, dimensions, bgColor, isClosingSnap, isDrawingFreehand, showGrid, orientationLeft, orientationRight]);

            // Atajos de teclado (Ctrl+Z, Delete, Enter, Escape)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const tag = document.activeElement?.tagName;
                    const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !isTyping) {
                        e.preventDefault();
                        handleUndo();
                        return;
                    }

                    if ((e.key === 'Delete' || e.key === 'Backspace') && !isTyping) {
                        if (selectedId) {
                            e.preventDefault();
                            saveHistory();
                            setPolygons(prev => prev.filter(p => p.id !== selectedId));
                            setSelectedId(null);
                        } else if (selectedSymbolId) {
                            e.preventDefault();
                            saveHistory();
                            setGeoSymbols(prev => prev.filter(s => s.id !== selectedSymbolId));
                            setSelectedSymbolId(null);
                        } else if (selectedTextId) {
                            e.preventDefault();
                            saveHistory();
                            setFloatingTexts(prev => prev.filter(t => t.id !== selectedTextId));
                            setSelectedTextId(null);
                        }
                        return;
                    }

                    if (e.key === 'Enter' && currentPoints.length >= 2) {
                        closePolygon();
                    } else if (e.key === 'Escape') {
                        setCurrentPoints([]);
                        setIsDrawingFreehand(false);
                        setDraggingSymbolId(null);
                        setDraggingPoly(null);
                        setDraggingVertex(null);
                        setDraggingTextId(null);

            }, [currentPoints, mode, polygons, activeLineType, selectedId, selectedSymbolId, selectedTextId, history]);

            const getMouseCoords = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) / zoom,
                    y: (e.clientY - rect.top) / zoom
                };
            };

            const applyGridSnap = (pt) => {
                if (!snapToGrid) return pt;
                return {
                    x: Math.round((pt.x - colAgeWidth) / gridSize) * gridSize + colAgeWidth,
                    y: Math.round((pt.y - titleHeight) / gridSize) * gridSize + titleHeight

            };

            const closePolygon = (pointsOverride = null) => {
                const pts = pointsOverride || currentPoints;
                if (!pts || pts.length < 2) {
                    setCurrentPoints([]);
                    setIsDrawingFreehand(false);
                    return;
                }
                saveHistory();
                const isLine = mode === 'draw_line';
                const defaultLineName = isLine ? (LINE_TYPES[activeLineType]?.name || 'Estructura') : `Fm. ${polygons.filter(p => p.type !== 'line').length + 1}`;
                const newObj = {
                    id: Date.now().toString(),
                    type: isLine ? 'line' : 'polygon',
                    name: defaultLineName,
                    points: pts,
                    color: isLine ? '#000000' : '#5c8a9e',
                    pattern1: 'none',
                    pattern2: 'none',
                    pattern3: 'none',
                    contactType: 'concordant',
                    contactPosition: 'base',
                    lineType: isLine ? activeLineType : 'normal'
                };
                setPolygons(prev => [...prev, newObj]);
                setCurrentPoints([]);
                setIsDrawingFreehand(false);
                setSelectedId(newObj.id);
                setSelectedTextId(null);
                setSelectedSymbolId(null);
                setMode('select');
                setIsClosingSnap(false);
                setSnapPoint(null);
            };

            const handleMouseDown = (e) => {
                const { x, y } = getMouseCoords(e);

                if (draggingSymbolId || draggingTextId || draggingPoly || draggingVertex) {
                    setDraggingSymbolId(null);
                    setDraggingTextId(null);
                    setDraggingPoly(null);
                    setDraggingVertex(null);
                    return;
                }

                if (mode === 'draw_freehand') {
                    const isInDrawZone = x > colAgeWidth && x < dimensions.width - colDescWidth && y > titleHeight;
                    if (isInDrawZone) {
                        setIsDrawingFreehand(true);
                        const startPt = snapPoint || { x, y };
                        setCurrentPoints([startPt]);
                    }
                    return;
                }

                if (mode === 'draw_poly' || mode === 'draw_line' || mode === 'add_symbol') {
                    return;
                }

                if (mode === 'select' || mode === 'move') {
                    for (let i = geoSymbols.length - 1; i >= 0; i--) {
                        const sym = geoSymbols[i];
                        if (Math.hypot(sym.x - x, sym.y - y) < 20) {
                            saveHistory();
                            setDraggingSymbolId(sym.id);
                            setSelectedSymbolId(sym.id);
                            setSelectedId(null);
                            setSelectedTextId(null);
                            return;
                        }
                    }
                }

                if (mode === 'select' || mode === 'move' || mode === 'add_text') {
                    const ctx = canvasRef.current.getContext('2d');
                    for (let t of floatingTexts) {
                        ctx.font = `bold ${t.size}px sans-serif`;
                        const m = ctx.measureText(t.text);
                        if (x >= t.x - m.width / 2 - 12 && x <= t.x + m.width / 2 + 12 &&
                            y >= t.y - t.size / 2 - 12 && y <= t.y + t.size / 2 + 12) {
                            saveHistory();
                            setDraggingTextId(t.id);
                            setSelectedTextId(t.id);
                            setSelectedId(null);
                            setSelectedSymbolId(null);
                            return;
                        }
                    }
                }

                if (mode === 'move') {
                    const ctx = canvasRef.current.getContext('2d');
                    let clickedPoly = null;

                    for (let i = polygons.length - 1; i >= 0; i--) {
                        const poly = polygons[i];
                        if (poly.type === 'line') {
                            for (let j = 0; j < poly.points.length - 1; j++) {
                                if (getDistToSegment({ x, y }, poly.points[j], poly.points[j + 1]).dist < 12) {
                                    clickedPoly = poly;
                                    break;
                                }
                            }
                            if (clickedPoly) break;
                        }
                    }

                    if (!clickedPoly) {
                        for (let i = polygons.length - 1; i >= 0; i--) {
                            const poly = polygons[i];
                            if (poly.type === 'line') continue;
                            ctx.beginPath();
                            ctx.moveTo(poly.points[0].x, poly.points[0].y);
                            poly.points.forEach(p => ctx.lineTo(p.x, p.y));
                            ctx.closePath();
                            if (ctx.isPointInPath(x, y)) {
                                clickedPoly = poly;
                                break;
                            }
                        }
                    }

                    if (clickedPoly) {
                        saveHistory();
                        setSelectedId(clickedPoly.id);
                        setSelectedTextId(null);
                        setSelectedSymbolId(null);
                        setDraggingPoly({
                            polyId: clickedPoly.id,
                            startX: x,
                            startY: y,
                            initialPoints: clickedPoly.points.map(pt => ({ ...pt }))
                        });
                        return;
                    }
                }

                if (mode === 'edit_vectors' && selectedId) {
                    const poly = polygons.find(p => p.id === selectedId);
                    if (poly) {
                        const ptIdx = poly.points.findIndex(pt => Math.hypot(pt.x - x, pt.y - y) < 16);
                        if (ptIdx !== -1) {
                            if (e.shiftKey) {
                                const minPts = poly.type === 'line' ? 2 : 3;
                                if (poly.points.length > minPts) {
                                    saveHistory();
                                    setPolygons(prev => prev.map(p => p.id === poly.id ? {
                                        ...p,
                                        points: p.points.filter((_, idx) => idx !== ptIdx)
                                    } : p));
                                }
                                return;
                            }
                            saveHistory();
                            setDraggingVertex({ polyId: poly.id, pointIndex: ptIdx });
                            return;
                        }
                    }
                }
            };

            const handleMouseMove = (e) => {
                const { x, y } = getMouseCoords(e);
                setMousePos({ x, y });

                if (draggingSymbolId) {
                    setGeoSymbols(prev => prev.map(s => s.id === draggingSymbolId ? { ...s, x, y } : s));
                    return;
                }
                if (draggingPoly) {
                    const dx = x - draggingPoly.startX;
                    const dy = y - draggingPoly.startY;
                    setPolygons(prev => prev.map(p => p.id === draggingPoly.polyId ? {
                        ...p,
                        points: draggingPoly.initialPoints.map(pt => ({ x: pt.x + dx, y: pt.y + dy }))
                    } : p));
                    return;
                }
                if (draggingVertex) {
                    const targetPt = applyGridSnap({ x, y });
                    setPolygons(prev => prev.map(p => p.id === draggingVertex.polyId ? {
                        ...p,
                        points: p.points.map((pt, i) => i === draggingVertex.pointIndex ? targetPt : pt)
                    } : p));
                    return;
                }
                if (draggingTextId) {
                    setFloatingTexts(prev => prev.map(t => t.id === draggingTextId ? { ...t, x, y } : t));
                    return;
                }
                if (isDrawingFreehand && mode === 'draw_freehand') {
                    const clampedX = Math.max(colAgeWidth, Math.min(dimensions.width - colDescWidth, x));
                    const clampedY = Math.max(titleHeight, y);
                    setCurrentPoints(prev => {
                        const last = prev[prev.length - 1];
                        if (!last || Math.hypot(last.x - clampedX, last.y - clampedY) > 4) {
                            return [...prev, { x: clampedX, y: clampedY }];
                        }
                        return prev;
                    });
                    return;
                }

                const isInDrawZone = x >= colAgeWidth - 15 && x <= dimensions.width - colDescWidth + 15 && y >= titleHeight - 15;
                if (mode.startsWith('draw') && isInDrawZone) {
                    let foundSnap = null;
                    let bestDist = 20;
                    let closing = false;

                    if (mode === 'draw_poly' && currentPoints.length >= 3) {
                        if (Math.hypot(currentPoints[0].x - x, currentPoints[0].y - y) < 35) {
                            foundSnap = currentPoints[0];
                            closing = true;
                        }
                    } else if (mode === 'draw_line' && currentPoints.length >= 2) {
                        const lastPt = currentPoints[currentPoints.length - 1];
                        if (Math.hypot(lastPt.x - x, lastPt.y - y) < 25) {
                            foundSnap = lastPt;
                            closing = true;
                        }
                    }

                    if (!foundSnap) {
                        for (let poly of polygons) {
                            for (let pt of poly.points) {
                                if (Math.hypot(pt.x - x, pt.y - y) < bestDist) {
                                    foundSnap = pt;
                                    bestDist = Math.hypot(pt.x - x, pt.y - y);
                                }
                            }
                        }
                    }

                    if (!foundSnap && snapToGrid) {
